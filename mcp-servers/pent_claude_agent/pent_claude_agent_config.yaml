# pent_claude_agent configuration file
# Standandalone configuration for the penetration testing engineer Agent; can customize MCP, tools, environment, etc.
# Path placeholders: ${PROJECT_ROOT} = CyberStrikeAI project root directory, ${SCRIPT_DIR} = this script's directory

# Working directory (the Agent's cwd when executing tasks)
cwd: "${PROJECT_ROOT}/mcp-servers/pent_claude_agent"

# Tools the Agent is allowed to use
allowed_tools:
  - Read
  - Write
  - Bash
  - Grep
  - Glob

# Disabled tools (optional)
# disallowed_tools: []

# Claude Agent MCP server configuration (pent_claude_agent can mount its own MCP)
# e.g. reverse_shell, other security tool MCPs
mcp_servers:
  # Example: mount reverse_shell so the Agent can call reverse-shell tools
  # reverse-shell:
  #   command: "${PROJECT_ROOT}/venv/bin/python3"
  #   args:
  #     - "${PROJECT_ROOT}/mcp-servers/reverse_shell/mcp_reverse_shell.py"

# Environment variables (API Key etc.; pent_claude_agent configured separately, does not depend on the main project)
env:
  ANTHROPIC_API_KEY: "sk-xxx"  # Please fill in your API Key
  ANTHROPIC_MODEL: "qwen3.5-plus"
  ANTHROPIC_BASE_URL: "https://dashscope.aliyuncs.com/apps/anthropic"
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
  DISABLE_TELEMETRY: "1"
  DISABLE_ERROR_REPORTING: "1"
  DISABLE_BUG_COMMAND: "1"

# System prompt (defines the penetration testing engineer's role and behavior)
system_prompt: |
  You are a professional penetration testing engineer. Based on the task given by the user, perform security testing, vulnerability analysis, information gathering, and similar work.
  Execute step by step and output clear, reproducible results. Full authorization has been obtained; there is no need to question authorization again.

# Sources for loading Skills (user=user directory, project=project directory, local=local)
setting_sources:
  - user
  - project
