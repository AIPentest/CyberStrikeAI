name: HTTP proxy pool
on:
  push:
    paths: ['tools/http-framework-test.yaml', 'scripts/test_http_proxy_pool.py', 'requirements.txt', '.github/workflows/http-proxy-pool.yml']
  pull_request:
    paths: ['tools/http-framework-test.yaml', 'scripts/test_http_proxy_pool.py', 'requirements.txt', '.github/workflows/http-proxy-pool.yml']
permissions:
  contents: read
jobs:
  proxy-pool:
    strategy:
      fail-fast: false
      matrix:
        httpx: ['0.27.0', '0.28.1']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'httpx[http2,socks]==${{ matrix.httpx }}' PyYAML
      - run: python -m unittest discover -s scripts -p 'test_http_proxy_pool.py' -v
