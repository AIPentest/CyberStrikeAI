name: Semi frontend

on:
  push:
    paths: ['web/frontend/**', 'web/static/app/**', 'web/static/i18n/**', 'web/templates/index.html', '.github/workflows/frontend-build.yml']
  pull_request:
    paths: ['web/frontend/**', 'web/static/app/**', 'web/static/i18n/**', 'web/templates/index.html', '.github/workflows/frontend-build.yml']

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci --prefix web/frontend
      - run: npm run --prefix web/frontend build
      - name: Check committed build
        run: |
          changes=$(git status --porcelain -- web/static/app)
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
      - name: Verify preview entry and build assets
        run: node --test web/frontend/tests/preview-entry.test.mjs
      - name: Install Chromium for isolated UI tests
        working-directory: web/frontend
        run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        run: npm run --prefix web/frontend test:ui -- --reporter=line
