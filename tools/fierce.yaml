name: "fierce"
command: "fierce"
enabled: true
short_description: "DNS a reconnaissance tool"
description: |
  Fierce is a DNS reconnaissance tool for discovering subdomains of a target domain.

  **Key features:**
  - Subdomain discovery
  - DNS Brute-forcing
  - Zone-transfer testing
  - Network mapping

  **Use cases:**
  - DNS Reconnaissance
  - Subdomain enumeration
  - Network mapping
  - Penetration testing
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain"
    required: true
    flag: "-dns"
    format: "flag"
  - name: "dns_server"
    type: "string"
    description: "DNS server to use"
    required: false
    flag: "-dnsserver"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra fierce arguments. Used to pass fierce options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
