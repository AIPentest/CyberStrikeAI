name: "fierce"
command: "fierce"
enabled: true
short_description: "DNS reconnaissance tool"
description: |
  Fierce is a DNS reconnaissance tool used to discover subdomains of a target domain.

  **Main features:**
  - Subdomain discovery
  - DNS brute-forcing
  - Zone transfer testing
  - Network mapping

  **Use cases:**
  - DNS reconnaissance
  - Subdomain enumeration
  - Network mapping
  - Penetration testing
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain"
    required: true
    flag: "-dns"
    format: "flag"
  - name: "dns_server"
    type: "string"
    description: "DNS server to use"
    required: false
    flag: "-dnsserver"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional fierce arguments. Used to pass fierce options that are not defined in the parameter list.

      **Example values:**
      - Add common parameter examples based on tool characteristics

      **Notes:**
      - Multiple arguments are separated by spaces
      - Ensure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
