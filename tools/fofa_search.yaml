name: "fofa_search"
command: "python3"
args:
  - "-c"
  - |
    import sys
    import json
    import base64
    import requests
    import os

    # ==================== FOFA Configuration ====================
    # Configure your credentials here: FOFA API Key
    # You can also set it in an environment variable: : FOFA_API_KEY
    # enable Defaults to false; must be enabled to invoke this MCP
    FOFA_API_KEY = "" # Enter your FOFA API key
    # ==================================================

    # FOFA API BasicURL
    base_url = "https://fofa.info/api/v1/search/all"

    # Parse arguments (from a JSON string or command-line arguments)
    def parse_args():
        # Try to read the JSON config from the first argument
        if len(sys.argv) > 1:
            try:
                # Ensure sys.argv[1] is a string
                arg1 = str(sys.argv[1])
                # Try to parse as JSON
                config = json.loads(arg1)
                # Ensure the returned value is a dict
                if isinstance(config, dict):
                    return config
            except (json.JSONDecodeError, TypeError, ValueError):
                # If it is not JSON, fall back to the legacy positional-argument mode
                pass

        # Legacy positional-argument mode (backward compatible)
        # Note: api_key is not passed as a call parameter but read from config or an environment variable
        # Parameter positions: query=2, size=3, page=4, fields=5, full=6
        # but in sys.argv, due to the python3 -c "code" format, the actual positions need adjustment
        # sys.argv[0] is '-c', and the actual arguments start at sys.argv[1]
        config = {}
        if len(sys.argv) > 1:
            config['query'] = str(sys.argv[1])
        if len(sys.argv) > 2:
            try:
                config['size'] = int(sys.argv[2])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 3:
            try:
                config['page'] = int(sys.argv[3])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 4:
            config['fields'] = str(sys.argv[4])
        if len(sys.argv) > 5:
            val = sys.argv[5]
            if isinstance(val, str):
                config['full'] = val.lower() in ('true', '1', 'yes')
            else:
                config['full'] = bool(val)
        return config

    try:
        config = parse_args()

        # Ensure config is a dict
        if not isinstance(config, dict):
            error_result = {
                "status": "error",
                "message": f" Parameter parse error: expected a dict, but got {type(config).__name__}",
                "type": "TypeError"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        # Obtained from config or an environment variable: api_key
        api_key = os.getenv('FOFA_API_KEY', FOFA_API_KEY).strip()
        query = config.get('query', '').strip()

        if not api_key:
            error_result = {
                "status": "error",
                "message": "Missing FOFA configuration: api_key (the FOFA API key)",
                "required_config": ["api_key"],
                "note": "Enter your API key in the FOFA_API_KEY setting of this YAML file, or set the FOFA_API_KEY environment variable. You can obtain an API key from the FOFA user center: https://fofa.info/userInfo"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        if not query:
            error_result = {
                "status": "error",
                "message": "Missing required parameter: query (the search query)",
                "required_params": ["query"],
                "examples": [
                    'app="Apache"',
                    'title=" Login"',
                    'domain="example.com"',
                    'ip="1.1.1.1"',
                    'port="80"',
                    'country="CN"',
                    'city="Beijing"'
                ]
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        # Build request parameters
        params = {
            'key': api_key,
            'qbase64': base64.b64encode(query.encode('utf-8')).decode('utf-8')
        }

        # Optional parameters
        if 'size' in config and config['size'] is not None:
            try:
                size = int(config['size'])
                if size > 0:
                    params['size'] = size
            except (ValueError, TypeError):
                pass

        if 'page' in config and config['page'] is not None:
            try:
                page = int(config['page'])
                if page > 0:
                    params['page'] = page
            except (ValueError, TypeError):
                pass

        if 'fields' in config and config['fields']:
            params['fields'] = str(config['fields']).strip()

        if 'full' in config and config['full'] is not None:
            full_val = config['full']
            if isinstance(full_val, bool):
                params['full'] = 'true' if full_val else 'false'
            elif isinstance(full_val, str):
                params['full'] = 'true' if full_val.lower() in ('true', '1', 'yes') else 'false'
            elif isinstance(full_val, (int, float)):
                params['full'] = 'true' if full_val != 0 else 'false'

        # Send request
        try:
            response = requests.get(base_url, params=params, timeout=30)
            response.raise_for_status()

            result_data = response.json()

            # Check the error returned by the FOFA API
            if result_data.get('error'):
                error_result = {
                    "status": "error",
                    "message": f"FOFA API Error: {result_data.get('errmsg', 'Unknown error')}",
                    "error_code": result_data.get('error'),
                    "suggestion": "Check that the API key is correct, or that the query conforms to FOFA syntax"
                }
                print(json.dumps(error_result, ensure_ascii=False, indent=2))
                sys.exit(1)

            # Format the output results
            output = {
                "status": "success",
                "query": query,
                "size": result_data.get('size', 0),
                "page": result_data.get('page', 1),
                "total": result_data.get('total', 0),
                "results_count": len(result_data.get('results', [])),
                "results": result_data.get('results', []),
                "message": f" Successfully retrieved {len(result_data.get('results', []))} results"
            }

            print(json.dumps(output, ensure_ascii=False, indent=2))

        except requests.exceptions.RequestException as e:
            error_result = {
                "status": "error",
                "message": f" Request failed: {str(e)}",
                "suggestion": "Check your network connection or the FOFA API service status"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

    except Exception as e:
        error_result = {
            "status": "error",
            "message": f" Execution error: {str(e)}",
            "type": type(e).__name__
        }
        print(json.dumps(error_result, ensure_ascii=False, indent=2))
        sys.exit(1)
enabled: false
short_description: "FOFA a cyberspace search engine supporting flexible query-parameter configuration"
description: |
  FOFA is a cyberspace-mapping search engine that can search internet assets by many query conditions.

  **Key features:**
  - Supports many query syntaxes (app, title, domain, ip, port, country, city, etc.)
  - Flexible configuration of returned fields
  - Paginated-query support
  - Full-data mode (the full parameter)

  **Use cases:**
  - Asset discovery and enumeration
  - Vulnerability impact-scope assessment
  - Security situational awareness
  - Threat-intelligence collection
  - Bug bounty Information gathering

  **Query syntax reference:**

  **Basic queries:**
  - Enter a query directly; it searches across the title, HTML content, HTTP headers, and URL fields
  - If the query expression has multiple AND/OR relations, wrap them in parentheses where possible, e.g. `(app="Apache" || app="Nginx") && country="CN"`

  **Logical connectors:**
  - `=` - match; with ="", you can query cases where a field does not exist or is empty
  - `==` - exact match; with =="", you can query cases where a field exists and is empty
  - `&&` - and (AND)
  - `||` - or (OR)
  - `!=` - not match; with !="", you can query cases where a value is not empty
  - `*=` - fuzzy match, searching with * or ?
  - `()` - Set query precedence; content in parentheses has the highest precedence

  **Common query-syntax categories:**

  **Basic:** `ip` (supports IPv4/IPv6//24 ranges), `port`, `domain`, `host`, `os`, `server`, `asn`, `org`, `is_domain`, `is_ipv6`

  **Tagging:** `app` (application identification), `fid` (site fingerprint), `product`, `product.version`, `category`, `type` (service/subdomain), `cloud_name`, `is_cloud`, `is_fraud`, `is_honeypot`

  **Protocol category (type=service):** `protocol`, `banner`, `banner_hash`, `banner_fid`, `base_protocol` (tcp/udp)

  **Website category (type=subdomain):** `title`, `header`, `header_hash`, `body`, `body_hash`, `js_name`, `js_md5`, `cname`, `cname_domain`, `icon_hash`, `status_code`, `icp`, `sdk_hash`

  **Geolocation:** `country` (supports codes/Chinese), `region` (supports English/Chinese, Chinese only within China), `city`

  **Certificate category:** `cert`, `cert.subject`, `cert.issuer`, `cert.subject.org`, `cert.subject.cn`, `cert.issuer.org`, `cert.issuer.cn`, `cert.domain`, `cert.is_equal`, `cert.is_valid`, `cert.is_match`, `cert.is_expired`, `jarm`, `tls.version`, `tls.ja3s`, `cert.sn`, `cert.not_after.after/before`, `cert.not_before.after/before`

  **Time:** `after` (updated after a given time), `before` (updated before a given time)

  **Standalone IP syntax (cannot be combined with other syntaxes):** `port_size`, `port_size_gt`, `port_size_lt`, `ip_ports`, `ip_country`, `ip_region`, `ip_city`, `ip_after`, `ip_before`

  **Common query examples:**
  - `app="Apache"` - Search for the Apache application
  - `title=" login"` - search pages whose title contains "login"
  - `domain="example.com"` - Search a specific domain
  - `ip="1.1.1.1"` or `ip="220.181.111.1/24"` - search an IP or a /24 range
  - `port="80"` - Search for assets with port 80 open
  - `country="CN"` or `country="China"` - search assets located in China
  - `city="Beijing"` - Search for assets in Beijing
  - `app="Apache" && country="CN"` - Combined queries
  - `(app="Apache" || app="Nginx") && country="CN"` - A complex query using parentheses
  - `title*=" login"` - fuzzy-match the title
  - `after="2023-01-01" && before="2023-12-01"` - Time-range query

  **Detailed syntax docs:** for more syntax notes and a component list, see the official FOFA documentation


  **Notes:**
  - API Calls are rate-limited; use responsibly
  - The number of results is limited by your account privileges
  - full This parameter requires elevated privileges
parameters:
  - name: "query"
    type: "string"
    description: |
      FOFA Query (required)

      Search query, supporting FOFA query syntax.
      Example: 
      - app="Apache"
      - title=" Login"
      - domain="example.com"
      - ip="1.1.1.1"
      - port="80"
      - country="CN"
      - app="Apache" && country="CN"
    required: true
    position: 2
    format: "positional"
  - name: "size"
    type: "int"
    description: |
      Number of results to return (optional)

      Number of results returned per page; default 100.
      Range: 1-10000, limited by your account privileges.
    required: false
    position: 3
    format: "positional"
    default: 100
  - name: "page"
    type: "int"
    description: |
      Page number (optional)

      Page number to return, starting at 1; default 1.
      Used to paginate through large result sets.
    required: false
    position: 4
    format: "positional"
    default: 1
  - name: "fields"
    type: "string"
    description: |
      List of fields to return (optional)

      Fields to return; separate multiple fields with commas.
      Default fields: ip,port,domain
      Available fields: host,title,ip,domain,port,protocol,country,region,city,server,icp,header,banner,body,asn,org
    required: false
    position: 5
    format: "positional"
    default: "ip,port,domain"
  - name: "full"
    type: "bool"
    description: |
      Whether to return full data (optional)

      When set to true, returns full data; requires elevated privileges.
      Default false; returns basic data.
    required: false
    position: 6
    format: "positional"
    default: false
