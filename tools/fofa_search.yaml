name: "fofa_search"
command: "python3"
args:
  - "-c"
  - |
    import sys
    import json
    import base64
    import requests
    import os

    # ==================== FOFA configuration ====================
    # Please configure your FOFA API Key here
    # You can also set it in the environment variable: FOFA_API_KEY
    # enable defaults to false; it must be enabled to call this MCP
    FOFA_API_KEY = ""  # Please fill in your FOFA API key
    # ==================================================

    # FOFA API base URL
    base_url = "https://fofa.info/api/v1/search/all"

    # Parse parameters (from JSON string or command-line arguments)
    def parse_args():
        # Try to read JSON configuration from the first argument
        if len(sys.argv) > 1:
            try:
                # Ensure sys.argv[1] is a string
                arg1 = str(sys.argv[1])
                # Try to parse as JSON
                config = json.loads(arg1)
                # Ensure the returned value is a dictionary
                if isinstance(config, dict):
                    return config
            except (json.JSONDecodeError, TypeError, ValueError):
                # If it is not JSON, use the traditional positional argument method
                pass

        # Traditional positional argument method (backward compatible)
        # Note: api_key is not passed as a call parameter, but read from configuration or environment variable
        # Parameter positions: query=2, size=3, page=4, fields=5, full=6
        # But in sys.argv, due to the python3 -c "code" format, actual positions need adjustment
        # sys.argv[0] is '-c'; actual arguments start from sys.argv[1]
        config = {}
        if len(sys.argv) > 1:
            config['query'] = str(sys.argv[1])
        if len(sys.argv) > 2:
            try:
                config['size'] = int(sys.argv[2])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 3:
            try:
                config['page'] = int(sys.argv[3])
            except (ValueError, TypeError):
                pass
        if len(sys.argv) > 4:
            config['fields'] = str(sys.argv[4])
        if len(sys.argv) > 5:
            val = sys.argv[5]
            if isinstance(val, str):
                config['full'] = val.lower() in ('true', '1', 'yes')
            else:
                config['full'] = bool(val)
        return config

    try:
        config = parse_args()

        # Ensure config is a dictionary
        if not isinstance(config, dict):
            error_result = {
                "status": "error",
                "message": f"Parameter parsing error: expected dict type, but got {type(config).__name__}",
                "type": "TypeError"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        # Get api_key from configuration or environment variable
        api_key = os.getenv('FOFA_API_KEY', FOFA_API_KEY).strip()
        query = config.get('query', '').strip()

        if not api_key:
            error_result = {
                "status": "error",
                "message": "Missing FOFA configuration: api_key (FOFA API key)",
                "required_config": ["api_key"],
                "note": "Please fill in your API key in the FOFA_API_KEY configuration item in the YAML file, or set it in the FOFA_API_KEY environment variable. The API key can be obtained from the FOFA personal center: https://fofa.info/userInfo"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        if not query:
            error_result = {
                "status": "error",
                "message": "Missing required parameter: query (search query statement)",
                "required_params": ["query"],
                "examples": [
                    'app="Apache"',
                    'title="login"',
                    'domain="example.com"',
                    'ip="1.1.1.1"',
                    'port="80"',
                    'country="CN"',
                    'city="Beijing"'
                ]
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        # Build request parameters
        params = {
            'key': api_key,
            'qbase64': base64.b64encode(query.encode('utf-8')).decode('utf-8')
        }

        # Optional parameters
        if 'size' in config and config['size'] is not None:
            try:
                size = int(config['size'])
                if size > 0:
                    params['size'] = size
            except (ValueError, TypeError):
                pass

        if 'page' in config and config['page'] is not None:
            try:
                page = int(config['page'])
                if page > 0:
                    params['page'] = page
            except (ValueError, TypeError):
                pass

        if 'fields' in config and config['fields']:
            params['fields'] = str(config['fields']).strip()

        if 'full' in config and config['full'] is not None:
            full_val = config['full']
            if isinstance(full_val, bool):
                params['full'] = 'true' if full_val else 'false'
            elif isinstance(full_val, str):
                params['full'] = 'true' if full_val.lower() in ('true', '1', 'yes') else 'false'
            elif isinstance(full_val, (int, float)):
                params['full'] = 'true' if full_val != 0 else 'false'

        # Send the request
        try:
            response = requests.get(base_url, params=params, timeout=30)
            response.raise_for_status()

            result_data = response.json()

            # Check errors returned by the FOFA API
            if result_data.get('error'):
                error_result = {
                    "status": "error",
                    "message": f"FOFA API error: {result_data.get('errmsg', 'unknown error')}",
                    "error_code": result_data.get('error'),
                    "suggestion": "Please check whether the API key is correct, or whether the query statement conforms to FOFA syntax"
                }
                print(json.dumps(error_result, ensure_ascii=False, indent=2))
                sys.exit(1)

            # Format output results
            output = {
                "status": "success",
                "query": query,
                "size": result_data.get('size', 0),
                "page": result_data.get('page', 1),
                "total": result_data.get('total', 0),
                "results_count": len(result_data.get('results', [])),
                "results": result_data.get('results', []),
                "message": f"Successfully retrieved {len(result_data.get('results', []))} results"
            }

            print(json.dumps(output, ensure_ascii=False, indent=2))

        except requests.exceptions.RequestException as e:
            error_result = {
                "status": "error",
                "message": f"Request failed: {str(e)}",
                "suggestion": "Please check the network connection or FOFA API service status"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

    except Exception as e:
        error_result = {
            "status": "error",
            "message": f"Execution error: {str(e)}",
            "type": type(e).__name__
        }
        print(json.dumps(error_result, ensure_ascii=False, indent=2))
        sys.exit(1)
enabled: false
short_description: "FOFA cyberspace search engine, supports flexible query parameter configuration"
description: |
  FOFA is a cyberspace mapping search engine that can search internet assets using a variety of query conditions.

  **Main features:**
  - Supports multiple query syntaxes (app, title, domain, ip, port, country, city, etc.)
  - Flexible field-return configuration
  - Paginated query support
  - Full data mode (full parameter)

  **Use cases:**
  - Asset discovery and enumeration
  - Vulnerability impact scope assessment
  - Security posture awareness
  - Threat intelligence gathering
  - Bug bounty reconnaissance

  **Query syntax explanation:**

  **Basic query:**
  - Directly enter a query statement, which will be searched in title, HTML content, HTTP header, and URL fields
  - If the query expression has multiple AND/OR relationships, it is best to enclose them in parentheses, e.g.: `(app="Apache" || app="Nginx") && country="CN"`

  **Logical operators:**
  - `=` - match; when ="" it can query for nonexistent fields or values that are empty
  - `==` - exact match; when =="" it can query for fields that exist and have empty values
  - `&&` - AND
  - `||` - OR
  - `!=` - does not match; when !="" it can query for values that are not empty
  - `*=` - fuzzy match, use * or ? for searching
  - `()` - determines query precedence; parenthesized content has the highest priority

  **Common query syntax categories:**

  **Basic class:** `ip` (supports IPv4/IPv6/C-segment), `port`, `domain`, `host`, `os`, `server`, `asn`, `org`, `is_domain`, `is_ipv6`

  **Tag class:** `app` (application identification), `fid` (site fingerprint), `product`, `product.version`, `category`, `type` (service/subdomain), `cloud_name`, `is_cloud`, `is_fraud`, `is_honeypot`

  **Protocol class (type=service):** `protocol`, `banner`, `banner_hash`, `banner_fid`, `base_protocol` (tcp/udp)

  **Website class (type=subdomain):** `title`, `header`, `header_hash`, `body`, `body_hash`, `js_name`, `js_md5`, `cname`, `cname_domain`, `icon_hash`, `status_code`, `icp`, `sdk_hash`

  **Geographic location:** `country` (supports code/Chinese name), `region` (supports English/Chinese; Chinese limited to China), `city`

  **Certificate class:** `cert`, `cert.subject`, `cert.issuer`, `cert.subject.org`, `cert.subject.cn`, `cert.issuer.org`, `cert.issuer.cn`, `cert.domain`, `cert.is_equal`, `cert.is_valid`, `cert.is_match`, `cert.is_expired`, `jarm`, `tls.version`, `tls.ja3s`, `cert.sn`, `cert.not_after.after/before`, `cert.not_before.after/before`

  **Time class:** `after` (updated after a certain time), `before` (updated before a certain time)

  **Standalone IP syntax (cannot be combined with other syntaxes):** `port_size`, `port_size_gt`, `port_size_lt`, `ip_ports`, `ip_country`, `ip_region`, `ip_city`, `ip_after`, `ip_before`

  **Common query examples:**
  - `app="Apache"` - Search for Apache applications
  - `title="login"` - Search for pages whose title contains "login"
  - `domain="example.com"` - Search for a specific domain
  - `ip="1.1.1.1"` or `ip="220.181.111.1/24"` - Search for an IP or C-segment
  - `port="80"` - Search for assets with port 80 open
  - `country="CN"` or `country="China"` - Search for assets located in China
  - `city="Beijing"` - Search for assets in Beijing
  - `app="Apache" && country="CN"` - combined query
  - `(app="Apache" || app="Nginx") && country="CN"` - complex query using parentheses
  - `title*="login"` - fuzzy title matching
  - `after="2023-01-01" && before="2023-12-01"` - time-range query

  **Detailed syntax documentation:** For more syntax details and component lists, refer to the official FOFA documentation


  **Notes:**
  - API calls are rate-limited, please use them judiciously
  - The number of query results is limited by account permissions
  - The full parameter requires elevated privileges
parameters:
  - name: "query"
    type: "string"
    description: |
      FOFA query statement (required)

      Search query statement, supports FOFA query syntax.
      Examples:
      - app="Apache"
      - title="login"
      - domain="example.com"
      - ip="1.1.1.1"
      - port="80"
      - country="CN"
      - app="Apache" && country="CN"
    required: true
    position: 2
    format: "positional"
  - name: "size"
    type: "int"
    description: |
      Number of results to return (optional)

      Number of results returned per page, default 100.
      Value range: 1-10000, limited by account permissions.
    required: false
    position: 3
    format: "positional"
    default: 100
  - name: "page"
    type: "int"
    description: |
      Page number (optional)

      The page number to return, starting from 1, default 1.
      Used for paginating through large result sets.
    required: false
    position: 4
    format: "positional"
    default: 1
  - name: "fields"
    type: "string"
    description: |
      List of fields to return (optional)

      Fields to return, multiple fields separated by commas.
      Default fields: ip,port,domain
      Available fields: host,title,ip,domain,port,protocol,country,region,city,server,icp,header,banner,body,asn,org
    required: false
    position: 5
    format: "positional"
    default: "ip,port,domain"
  - name: "full"
    type: "bool"
    description: |
      Whether to return full data (optional)

      When set to true, returns full data; requires elevated privileges.
      Default is false, returns basic data.
    required: false
    position: 6
    format: "positional"
    default: false
