name: "shodan_search"
command: "python3"
args:
  - "-c"
  - |
    import sys
    import json
    import requests
    import os
    import math

    # ==================== Shodan Configuration ====================
    # Configure your credentials here: Shodan API Key
    # You can also set it in an environment variable: : SHODAN_API_KEY
    # enable Defaults to false; must be enabled to invoke this MCP
    SHODAN_API_KEY = "" # Replace this with your own Shodan API Key
    # ==================================================

    # Shodan API BasicURL
    base_url = "https://api.shodan.io"

    # Parse arguments (from a JSON string or command-line arguments)
    def parse_args():
        # Try to read the JSON config from the first argument
        if len(sys.argv) > 1:
            try:
                arg1 = str(sys.argv[1])
                config = json.loads(arg1)
                if isinstance(config, dict):
                    return config
            except (json.JSONDecodeError, TypeError, ValueError):
                pass

        # Legacy positional-argument mode (backward compatible)
        # Compatible with both sequences: 
        # 1) query,page,facets,minify,fields,count_only,size
        # 2) query,page,minify,fields,count_only,size (facets When omitted, the executor compresses the arguments)
        config = {}
        if len(sys.argv) > 1:
            config["query"] = str(sys.argv[1])
        if len(sys.argv) > 2:
            try:
                config["page"] = int(sys.argv[2])
            except (ValueError, TypeError):
                pass

        def is_bool_like(val):
            if isinstance(val, bool):
                return True
            if not isinstance(val, str):
                return False
            return val.strip().lower() in ("true", "false", "1", "0", "yes", "no")

        remaining = [str(x) for x in sys.argv[3:]]
        if remaining:
            # facets When omitted, the first remaining argument is usually minify (boolean)
            first_is_bool = is_bool_like(remaining[0])
            idx = 0
            if not first_is_bool:
                config["facets"] = remaining[idx]
                idx += 1

            if idx < len(remaining):
                val = remaining[idx]
                config["minify"] = val.lower() in ("true", "1", "yes")
                idx += 1

            if idx < len(remaining):
                config["fields"] = remaining[idx]
                idx += 1

            if idx < len(remaining):
                val = remaining[idx]
                config["count_only"] = val.lower() in ("true", "1", "yes")
                idx += 1

            if idx < len(remaining):
                try:
                    config["size"] = int(remaining[idx])
                except (ValueError, TypeError):
                    pass

        return config

    def normalize_bool(value, default_value):
        if value is None:
            return default_value
        if isinstance(value, bool):
            return value
        if isinstance(value, str):
            return value.lower() in ("true", "1", "yes")
        if isinstance(value, (int, float)):
            return value != 0
        return default_value

    try:
        config = parse_args()

        if not isinstance(config, dict):
            error_result = {
                "status": "error",
                "message": f" Parameter parse error: expected a dict, but got {type(config).__name__}",
                "type": "TypeError"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        api_key = os.getenv("SHODAN_API_KEY", SHODAN_API_KEY).strip()
        query = str(config.get("query", "")).strip()

        if not api_key:
            error_result = {
                "status": "error",
                "message": "Missing Shodan configuration: api_key (the Shodan API key)",
                "required_config": ["api_key"],
                "note": "Enter your API key in the SHODAN_API_KEY setting of this YAML file, or set the SHODAN_API_KEY environment variable. You can view your API key on your Shodan account page: https://account.shodan.io/"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        if not query:
            error_result = {
                "status": "error",
                "message": "Missing required parameter: query (the search query)",
                "required_params": ["query"],
                "examples": [
                    "product:nginx",
                    "apache country:DE",
                    "port:22",
                    "ssl.cert.subject.cn:example.com",
                    "org:\"Amazon\" port:443"
                ]
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

        count_only = normalize_bool(config.get("count_only"), False)
        minify = normalize_bool(config.get("minify"), True)
        requested_size = config.get("size", None)
        if requested_size is not None:
            try:
                requested_size = int(requested_size)
                if requested_size <= 0:
                    requested_size = None
                else:
                    # Prevents a single request from being too large and causing quota and response-time issues
                    requested_size = min(requested_size, 1000)
            except (ValueError, TypeError):
                requested_size = None

        # Chooses the search endpoint based on count_only
        endpoint = "/shodan/host/count" if count_only else "/shodan/host/search"
        url = f"{base_url}{endpoint}"

        params = {
            "key": api_key,
            "query": query
        }

        # Optional facets parameter (supported by both search and count)
        if "facets" in config and config["facets"]:
            facets_value = str(config["facets"]).strip()
            if facets_value:
                params["facets"] = facets_value

        # search Optional parameters of the endpoint
        if not count_only:
            if "page" in config and config["page"] is not None:
                try:
                    page = int(config["page"])
                    if page > 0:
                        params["page"] = page
                except (ValueError, TypeError):
                    pass
            minify_effective = minify

            if "fields" in config and config["fields"]:
                fields_value = str(config["fields"]).strip()
                if fields_value:
                    params["fields"] = fields_value
                    # Shodan API Constraint: fields and minify=true are mutually exclusive
                    minify_effective = False

            params["minify"] = "true" if minify_effective else "false"

        try:
            if count_only:
                response = requests.get(url, params=params, timeout=30)
                response.raise_for_status()
                result_data = response.json()

                if isinstance(result_data, dict) and result_data.get("error"):
                    error_result = {
                        "status": "error",
                        "message": f"Shodan API Error: {result_data.get('error', 'Unknown error')}",
                        "suggestion": "Check your API key, query syntax, and account query quota"
                    }
                    print(json.dumps(error_result, ensure_ascii=False, indent=2))
                    sys.exit(1)

                output = {
                    "status": "success",
                    "mode": "count",
                    "query": query,
                    "total": result_data.get("total", 0),
                    "facets": result_data.get("facets", {}),
                    "size": requested_size,
                    "note": "count This mode returns statistics only, not detailed results",
                    "message": "Statistics query complete (no asset details returned)"
                }
            else:
                start_page = int(params.get("page", 1))
                # Shodan search At most 100 entries per page, fixed
                # If size is not specified, the original behavior is kept (single page)
                target_size = requested_size if requested_size else 100
                pages_needed = 1 if not requested_size else max(1, int(math.ceil(target_size / 100.0)))

                all_matches = []
                last_result_data = {}
                current_page = start_page
                pages_fetched = 0

                for _ in range(pages_needed):
                    page_params = dict(params)
                    page_params["page"] = current_page

                    response = requests.get(url, params=page_params, timeout=30)
                    response.raise_for_status()
                    result_data = response.json()
                    last_result_data = result_data if isinstance(result_data, dict) else {}
                    pages_fetched += 1

                    if isinstance(last_result_data, dict) and last_result_data.get("error"):
                        error_result = {
                            "status": "error",
                            "message": f"Shodan API Error: {last_result_data.get('error', 'Unknown error')}",
                            "suggestion": "Check your API key, query syntax, and account query quota"
                        }
                        print(json.dumps(error_result, ensure_ascii=False, indent=2))
                        sys.exit(1)

                    page_matches = last_result_data.get("matches", []) if isinstance(last_result_data, dict) else []
                    if not page_matches:
                        break

                    all_matches.extend(page_matches)
                    if len(all_matches) >= target_size:
                        break
                    current_page += 1

                matches = all_matches[:target_size]
                output = {
                    "status": "success",
                    "mode": "search",
                    "query": query,
                    "page": start_page,
                    "size": target_size,
                    "pages_fetched": pages_fetched,
                    "total": last_result_data.get("total", 0),
                    "results_count": len(matches),
                    "facets": last_result_data.get("facets", {}),
                    "results": matches,
                    "message": f" Successfully retrieved {len(matches)} results"
                }

            print(json.dumps(output, ensure_ascii=False, indent=2))

        except requests.exceptions.RequestException as e:
            response_body = ""
            status_code = None
            if hasattr(e, "response") and e.response is not None:
                status_code = e.response.status_code
                try:
                    response_body = e.response.text[:500]
                except Exception:
                    response_body = ""

            error_result = {
                "status": "error",
                "message": f" Request failed: {str(e)}",
                "status_code": status_code,
                "response": response_body,
                "suggestion": "Check your network connection, Shodan API status, API key, and query quota"
            }
            print(json.dumps(error_result, ensure_ascii=False, indent=2))
            sys.exit(1)

    except Exception as e:
        error_result = {
            "status": "error",
            "message": f" Execution error: {str(e)}",
            "type": type(e).__name__
        }
        print(json.dumps(error_result, ensure_ascii=False, indent=2))
        sys.exit(1)
enabled: false
short_description: "Shodan Cyberspace search, supporting search and count modes"
description: |
  Shodan An asset-search tool built on the official Developer API, supporting fast lookups and statistical analysis.

  **Key features:**
  - Use `/shodan/host/search` for asset search
  - Use `/shodan/host/count` for counts without details (saves query credits)
  - Supports controlling the number of returned entries via `size` (auto-paging and aggregation)
  - Supports pagination (page)
  - Supports faceted statistics (facets)
  - Supports trimming result fields (fields)
  - Supports `minify` to control the size of the returned data

  **Authentication method:**
  - Query Parameter usage `key`
  - You can enter `SHODAN_API_KEY` in this file, or inject it via the `SHODAN_API_KEY` environment variable

  **Query-syntax examples:**
  - `product:nginx`
  - `apache country:DE`
  - `port:22`
  - `org:"Amazon" port:443`
  - `ssl.cert.subject.cn:example.com`

  **Notes:**
  - A query with a filter usually consumes query credits
  - Paging (beyond page 1) consumes additional quota
  - `size` Beyond 100, it automatically requests more pages (at most per page 100)
  - `size` The maximum is 1000 (to prevent excessive requests)
  - `count_only=true` Uses the stats endpoint and does not return matches details
parameters:
  - name: "query"
    type: "string"
    description: |
      Shodan Search query (required).

      Supports Shodan filter syntax (`filter:value`) combined with keywords.
      Example: 
      - `product:nginx`
      - `apache country:DE`
      - `port:22`
      - `org:"Amazon" port:443`
    required: true
    position: 1
    format: "positional"
  - name: "page"
    type: "int"
    description: |
      Page number (optional, only effective in search mode), starting at 1; default 1.
    required: false
    position: 2
    format: "positional"
    default: 1
  - name: "facets"
    type: "string"
    description: |
      Faceted-statistics field (optional).

      Separate multiple fields with commas; a count can also be specified: 
      - `org,os`
      - `country:20,org:10`
    required: false
    position: 3
    format: "positional"
  - name: "minify"
    type: "bool"
    description: |
      Whether to trim the returned fields (optional, only effective in search mode).
      Default `true`.
    required: false
    position: 4
    format: "positional"
    default: true
  - name: "fields"
    type: "string"
    description: |
      Specify the returned fields (optional, only effective in search mode).

      Separate multiple fields with commas, e.g. 
      - `ip_str,port,org,hostnames,http.title`
      - `tags,http.title,http.favicon.hash`
    required: false
    position: 5
    format: "positional"
  - name: "count_only"
    type: "bool"
    description: |
      Whether to count the total only (optional).

      - `false` (default): calls `/shodan/host/search` to return details
      - `true`: Calling `/shodan/host/count` returns only total and facets
    required: false
    position: 6
    format: "positional"
    default: false
  - name: "size"
    type: "int"
    description: |
      Number of results to return (optional, only effective in search mode).

      - Supported `10 / 20 / 100 / n`
      - Shodan At most 100 per page; beyond 100 it auto-pages and concatenates
      - To avoid quota and latency issues, the maximum is limited to 1000
      - When not passed, a single page of results is returned by default (at most 100)
    required: false
    position: 7
    format: "positional"
