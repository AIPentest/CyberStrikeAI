name: "ffuf"
command: "ffuf"
enabled: true
short_description: "a fast web fuzzing tool for directory, parameter, and content discovery"
description: |
  FFuf is a fast web fuzzing tool for directory discovery, parameter fuzzing, and content discovery.

  **Key features:**
  - Fast directory and file discovery
  - Parameter fuzzing
  - Virtual host discovery
  - Custom filters and matchers
  - Multithreading support

  **Use cases:**
  - Web Application security testing
  - Directory enumeration
  - Parameter discovery
  - Content discovery
parameters:
  - name: "url"
    type: "string"
    description: "Target URL (use FUZZ as the placeholder)"
    required: true
    flag: "-u"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "Wordlist file path"
    required: false
    default: "/usr/share/wordlists/dirb/common.txt"
    flag: "-w"
    format: "flag"
  - name: "match_codes"
    type: "string"
    description: "HTTP status codes to match (comma-separated)"
    required: false
    default: "200,204,301,302,307,401,403"
    flag: "-mc"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Extra FFuf arguments"
    required: false
    format: "positional"
