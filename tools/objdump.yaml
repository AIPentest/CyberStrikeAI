name: "objdump"
command: "objdump"
enabled: true
short_description: "a binary disassembly tool"
description: |
  Objdump is part of GNU binutils, used to disassemble binary files.

  **Key features:**
  - Disassembly
  - Symbol-table display
  - Section-information display
  - Multiple-architecture support

  **Use cases:**
  - Binary analysis
  - Reverse engineering
  - Program comprehension
  - Debugging aid
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "disassemble"
    type: "bool"
    description: "Disassemble a binary file"
    required: false
    flag: "-d"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: |
      Extra objdump arguments. Used to pass objdump options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
