name: "objdump"
command: "objdump"
enabled: true
short_description: "Binary file disassembly tool"
description: |
  Objdump is part of GNU binutils, used to disassemble binary files.

  **Main features:**
  - Disassembly
  - Symbol table display
  - Section information display
  - Support for multiple architectures

  **Use cases:**
  - Binary analysis
  - Reverse engineering
  - Program understanding
  - Debugging assistance
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "disassemble"
    type: "bool"
    description: "Disassemble the binary file"
    required: false
    flag: "-d"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: |
      Extra objdump arguments. Used to pass objdump options not defined in the parameter list.

      **Example values:**
      - Add common parameter examples according to the tool's characteristics

      **Notes:**
      - Multiple arguments are separated by spaces
      - Make sure arguments are correctly formatted to avoid command injection
      - This argument is appended directly to the end of the command
    required: false
    format: "positional"
