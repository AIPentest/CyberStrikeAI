name: "checkov"
command: "checkov"
enabled: true
short_description: "An infrastructure-as-code security scanning tool"
description: |
  Checkov is a static code-analysis tool for security scanning of infrastructure-as-code (IaC).

  **Key features:**
  - Supports many IaC frameworks (Terraform, CloudFormation, Kubernetes, etc.)
  - Hundreds of built-in policies
  - Custom-policy support
  - CI/CD Integration

  **Use cases:**
  - IaC Security scanning
  - Cloud configuration auditing
  - Security-policy checks
  - Compliance checking
parameters:
  - name: "directory"
    type: "string"
    description: "Directory to scan"
    required: false
    flag: "-d"
    format: "flag"
    default: "."
  - name: "framework"
    type: "string"
    description: "Framework to scan (terraform, cloudformation, kubernetes, etc.)"
    required: false
    flag: "--framework"
    format: "flag"
  - name: "check"
    type: "string"
    description: "Specific check to run"
    required: false
    flag: "--check"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "Output format (json, yaml, cli)"
    required: false
    flag: "--output"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
      Extra checkov arguments. Used to pass checkov options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
