name: "checkov"
command: "checkov"
enabled: true
short_description: "Infrastructure-as-code security scanning tool"
description: |
  Checkov is a static code analysis tool for security scanning of infrastructure-as-code (IaC).

  **Main features:**
  - Support for multiple IaC frameworks (Terraform, CloudFormation, Kubernetes, etc.)
  - Hundreds of built-in policies
  - Custom policy support
  - CI/CD integration

  **Use cases:**
  - IaC security scanning
  - Cloud configuration auditing
  - Security policy checks
  - Compliance checks
parameters:
  - name: "directory"
    type: "string"
    description: "Directory to scan"
    required: false
    flag: "-d"
    format: "flag"
    default: "."
  - name: "framework"
    type: "string"
    description: "Framework to scan (terraform, cloudformation, kubernetes, etc.)"
    required: false
    flag: "--framework"
    format: "flag"
  - name: "check"
    type: "string"
    description: "Specific check to run"
    required: false
    flag: "--check"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "Output format (json, yaml, cli)"
    required: false
    flag: "--output"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
      Extra checkov arguments. Used to pass checkov options not defined in the parameter list.

      **Example values:**
      - Add common parameter examples according to the tool's characteristics

      **Notes:**
      - Multiple arguments are separated by spaces
      - Make sure arguments are correctly formatted to avoid command injection
      - This argument is appended directly to the end of the command
    required: false
    format: "positional"
