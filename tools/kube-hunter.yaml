name: "kube-hunter"
command: "kube-hunter"
enabled: true
short_description: "Kubernetes penetration testing tool"
description: |
  Kube-hunter is a Kubernetes penetration testing tool used to discover security issues in Kubernetes clusters.

  **Main features:**
  - Kubernetes security scanning
  - Vulnerability discovery
  - Configuration issue detection
  - Active and passive modes

  **Use cases:**
  - Kubernetes security testing
  - Cluster security assessment
  - Penetration testing
  - Security auditing
parameters:
  - name: "target"
    type: "string"
    description: "Scan a specific target"
    required: false
    flag: "--remote"
    format: "flag"
  - name: "cidr"
    type: "string"
    description: "Scan a CIDR range"
    required: false
    flag: "--cidr"
    format: "flag"
  - name: "interface"
    type: "string"
    description: "Scan a network interface"
    required: false
    flag: "--interface"
    format: "flag"
  - name: "active"
    type: "bool"
    description: "Enable active scanning (may be risky)"
    required: false
    flag: "--active"
    format: "flag"
    default: false
  - name: "report"
    type: "string"
    description: "Report format (json, yaml)"
    required: false
    flag: "--report"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
      Extra kube-hunter arguments. Used to pass kube-hunter options not defined in the parameter list.

      **Example values:**
      - Add common parameter examples according to the tool's characteristics

      **Notes:**
      - Multiple arguments are separated by spaces
      - Make sure arguments are correctly formatted to avoid command injection
      - This argument is appended directly to the end of the command
    required: false
    format: "positional"
