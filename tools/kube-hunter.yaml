name: "kube-hunter"
command: "kube-hunter"
enabled: true
short_description: "Kubernetes a penetration-testing tool"
description: |
  Kube-hunter is a Kubernetes penetration-testing tool for discovering security issues in Kubernetes clusters.

  **Key features:**
  - Kubernetes Security scanning
  - Vulnerability discovery
  - Configuration-issue detection
  - Active and passive modes

  **Use cases:**
  - Kubernetes Security testing
  - Cluster security assessment
  - Penetration testing
  - Security auditing
parameters:
  - name: "target"
    type: "string"
    description: "Specific-target scanning"
    required: false
    flag: "--remote"
    format: "flag"
  - name: "cidr"
    type: "string"
    description: "CIDR Range scanning"
    required: false
    flag: "--cidr"
    format: "flag"
  - name: "interface"
    type: "string"
    description: "Network-interface scanning"
    required: false
    flag: "--interface"
    format: "flag"
  - name: "active"
    type: "bool"
    description: "Enable active scanning (may be risky)"
    required: false
    flag: "--active"
    format: "flag"
    default: false
  - name: "report"
    type: "string"
    description: "Report format (json, yaml)"
    required: false
    flag: "--report"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
      Extra kube-hunter arguments. Used to pass kube-hunter options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
