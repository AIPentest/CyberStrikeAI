name: "trivy"
command: "trivy"
enabled: true
short_description: "a container and filesystem vulnerability scanner"
description: |
  Trivy is a simple yet comprehensive container and filesystem vulnerability scanner.

  **Key features:**
  - Container image scanning
  - Filesystem scanning
  - Code-repository scanning
  - Configuration-file scanning

  **Use cases:**
  - Container security scanning
  - CI/CD Integration
  - Vulnerability detection
  - Security auditing
parameters:
  - name: "scan_type"
    type: "string"
    description: "Scan type (image, fs, repo, config)"
    required: false
    default: "image"
    position: 0
    format: "positional"
  - name: "target"
    type: "string"
    description: "Scan target (image name, directory, repository)"
    required: true
    position: 1
    format: "positional"
  - name: "severity"
    type: "string"
    description: "Severity filtering (UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL)"
    required: false
    flag: "--severity"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "Output format (json, table, sarif)"
    required: false
    flag: "--format"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
      Extra Trivy arguments. Used to pass Trivy options not defined in the parameter list.

      **Example value:**
      - "--exit-code 1": On finding a vulnerability, the exit code is 1
      - "--skip-dirs": Skip directories
      - "--skip-files": Skip files
      - "--no-progress": Do not show the progress bar

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
