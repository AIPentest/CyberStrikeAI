name: "cloudmapper"
command: "cloudmapper"
enabled: true
short_description: "AWS a network-visualization and security-analysis tool"
description: |
  CloudMapper is an AWS network-visualization and security-analysis tool.

  **Key features:**
  - AWS Network visualization
  - Security analysis
  - Network mapping
  - Administrator discovery

  **Use cases:**
  - AWS Network analysis
  - Security assessment
  - Network visualization
  - Security auditing
parameters:
  - name: "action"
    type: "string"
    description: "Operation to perform (collect, prepare, webserver, find_admins, etc.)"
    required: false
    default: "collect"
    position: 0
    format: "positional"
  - name: "account"
    type: "string"
    description: "The AWS account to analyze"
    required: false
    flag: "--account"
    format: "flag"
  - name: "config"
    type: "string"
    description: "Configuration-file path"
    required: false
    flag: "--config"
    format: "flag"
    default: "config.json"
  - name: "additional_args"
    type: "string"
    description: |
      Extra cloudmapper arguments. Used to pass cloudmapper options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
