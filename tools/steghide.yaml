name: "steghide"
command: "steghide"
enabled: true
short_description: "a steganalysis tool"
description: |
  Steghide is a steganography tool for hiding data in image and audio files.

  **Key features:**
  - Data hiding
  - Data extraction
  - Information viewing
  - Password protection

  **Use cases:**
  - Steganalysis
  - Data-hiding detection
  - Forensic analysis
  - CTF Challenge
parameters:
  - name: "action"
    type: "string"
    description: "Operation type (extract, embed, info)"
    required: true
    position: 0
    format: "positional"
  - name: "cover_file"
    type: "string"
    description: "Carrier file path (used by the embed/info operations -cf)"
    required: false
    flag: "-cf"
    format: "flag"
  - name: "embed_file"
    type: "string"
    description: "File to embed (for the embed operation)"
    required: false
    flag: "-ef"
    format: "flag"
  - name: "passphrase"
    type: "string"
    description: "Password"
    required: false
    flag: "-p"
    format: "flag"
  - name: "stego_file"
    type: "string"
    description: "Steganography file path (output when embedding, input when extracting)"
    required: false
    flag: "-sf"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra steghide arguments. Used to pass steghide options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
