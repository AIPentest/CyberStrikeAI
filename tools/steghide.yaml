name: "steghide"
command: "steghide"
enabled: true
short_description: "Steganography analysis tool"
description: |
  Steghide is a steganography tool used to hide data in image and audio files.

  **Main features:**
  - Data hiding
  - Data extraction
  - Information viewing
  - Password protection

  **Use cases:**
  - Steganography analysis
  - Hidden data detection
  - Forensic analysis
  - CTF challenges
parameters:
  - name: "action"
    type: "string"
    description: "Action type (extract, embed, info)"
    required: true
    position: 0
    format: "positional"
  - name: "cover_file"
    type: "string"
    description: "Cover file path (used with -cf for embed/info operations)"
    required: false
    flag: "-cf"
    format: "flag"
  - name: "embed_file"
    type: "string"
    description: "File to embed (during the embed operation)"
    required: false
    flag: "-ef"
    format: "flag"
  - name: "passphrase"
    type: "string"
    description: "Password"
    required: false
    flag: "-p"
    format: "flag"
  - name: "stego_file"
    type: "string"
    description: "Steganography file path (output for embed, input for extract)"
    required: false
    flag: "-sf"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional steghide arguments. Used to pass steghide options not defined in the parameter list.

      **Example values:**
      - Add common parameter examples according to tool characteristics

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
