name: "xxd"
command: "xxd"
enabled: true
short_description: "a hex-dump tool"
description: |
  Xxd is a hex-dump tool for displaying file contents in hexadecimal.

  **Key features:**
  - Hex dump
  - Configurable offset and length
  - Reverse conversion
  - Multiple output formats

  **Use cases:**
  - Binary analysis
  - File inspection
  - Data extraction
  - Forensic analysis
parameters:
  - name: "file_path"
    type: "string"
    description: "Path to the file to dump"
    required: true
    position: 0
    format: "positional"
  - name: "offset"
    type: "string"
    description: "Offset to start reading from"
    required: false
    flag: "-s"
    format: "flag"
    default: "0"
  - name: "length"
    type: "string"
    description: "Number of bytes to read"
    required: false
    flag: "-l"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra xxd arguments. Used to pass xxd options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
