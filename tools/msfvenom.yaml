name: "msfvenom"
command: "msfvenom"
enabled: true
short_description: "Metasploit payload generation tool"
description: |
  MSFVenom is the Metasploit framework's payload generation tool, used to create various types of attack payloads.

  **Main features:**
  - Multiple payload types
  - Encoder support
  - Multiple output formats
  - Platform support

  **Use cases:**
  - Penetration testing
  - Payload generation
  - Exploitation
  - Security testing
parameters:
  - name: "payload"
    type: "string"
    description: "Payload to generate (e.g. windows/meterpreter/reverse_tcp)"
    required: true
    flag: "-p"
    format: "flag"
  - name: "format_type"
    type: "string"
    description: "Output format (exe, elf, raw, etc.)"
    required: false
    flag: "-f"
    format: "flag"
  - name: "output_file"
    type: "string"
    description: "Output file path"
    required: false
    flag: "-o"
    format: "flag"
  - name: "encoder"
    type: "string"
    description: "Encoder (e.g. x86/shikata_ga_nai)"
    required: false
    flag: "-e"
    format: "flag"
  - name: "iterations"
    type: "string"
    description: "Number of encoding iterations"
    required: false
    flag: "-i"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra msfvenom arguments. Used to pass msfvenom options not defined in the parameter list.

      **Example values:**
      - Add common parameter examples according to the tool's characteristics

      **Notes:**
      - Multiple arguments are separated by spaces
      - Make sure arguments are correctly formatted to avoid command injection
      - This argument is appended directly to the end of the command
    required: false
    format: "positional"
