name: "jwt-analyzer"
command: "jwt_tool"
enabled: true
short_description: "JWT a token-analysis and vulnerability-testing tool"
description: |
  An advanced JWT token-analysis and vulnerability-testing tool for detecting security issues in JWT implementations.

  **Key features:**
  - JWT Token analysis
  - Vulnerability testing
  - Attack-vector detection
  - Token operations

  **Use cases:**
  - JWT Security testing
  - Token analysis
  - Vulnerability discovery
  - Security testing
parameters:
  - name: "jwt_token"
    type: "string"
    description: "The JWT token to analyze"
    required: true
    flag: "-t"
    format: "flag"
  - name: "target_url"
    type: "string"
    description: "Optional target for testing token operationsURL"
    required: false
    flag: "-u"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra jwt-analyzer arguments. Used to pass jwt-analyzer options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
