name: "xsser"
command: "xsser"
enabled: true
short_description: "XSS vulnerability testing tool"
description: |
  XSSer is an automated XSS vulnerability testing tool.

  **Main features:**
  - XSS vulnerability detection
  - Multiple XSS techniques
  - Automated testing
  - Report generation

  **Use cases:**
  - XSS vulnerability testing
  - Web application security testing
  - Penetration testing
  - Vulnerability verification
parameters:
  - name: "url"
    type: "string"
    description: "Target URL"
    required: true
    flag: "--url"
    format: "flag"
  - name: "params"
    type: "string"
    description: "Parameters to test"
    required: false
    flag: "--Fp"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra xsser arguments. Used to pass xsser options not defined in the parameter list.

      **Example values:**
      - Add common parameter examples according to the tool's characteristics

      **Notes:**
      - Multiple arguments are separated by spaces
      - Make sure arguments are correctly formatted to avoid command injection
      - This argument is appended directly to the end of the command
    required: false
    format: "positional"
