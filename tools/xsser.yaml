name: "xsser"
command: "xsser"
enabled: true
short_description: "XSS a vulnerability-testing tool"
description: |
  XSSer is an automated XSS vulnerability-testing tool.

  **Key features:**
  - XSS Vulnerability detection
  - Multiple XSS techniques
  - Automated testing
  - Report generation

  **Use cases:**
  - XSS Vulnerability testing
  - Web Application security testing
  - Penetration testing
  - Vulnerability verification
parameters:
  - name: "url"
    type: "string"
    description: "TargetURL"
    required: true
    flag: "--url"
    format: "flag"
  - name: "params"
    type: "string"
    description: "Parameter to test"
    required: false
    flag: "--Fp"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra xsser arguments. Used to pass xsser options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
