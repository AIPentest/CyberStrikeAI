name: "arp-scan"
command: "arp-scan"
enabled: true
short_description: "ARP a network-discovery tool"
description: |
  Arp-scan is an ARP network-discovery tool for finding active hosts on the local network.

  **Key features:**
  - ARP Scan
  - Local network discovery
  - MAC Address identification
  - Fast scan

  **Use cases:**
  - Local network discovery
  - Host discovery
  - Network mapping
  - Penetration testing
parameters:
  - name: "target"
    type: "string"
    description: "Target IP range (if not using local_network)"
    required: false
    position: 0
    format: "positional"
  - name: "interface"
    type: "string"
    description: "Network interface"
    required: false
    flag: "-I"
    format: "flag"
  - name: "local_network"
    type: "bool"
    description: "Scan the local network"
    required: false
    flag: "-l"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: |
      Extra arp-scan arguments. Used to pass arp-scan options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
