name: "api-schema-analyzer"
command: "spectral"
args: ["lint"]
enabled: true
short_description: "API a pattern-analysis tool that identifies potential security issues"
description: |
  Runs `spectral lint` for static analysis of OpenAPI/Swagger/GraphQL schemas, optionally with custom rulesets or output formats.
parameters:
  - name: "schema_url"
    type: "string"
    description: "API Schema file or URL (the target passed to spectral lint)"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
      Extra Spectral arguments, such as `--ruleset`, `--format`, `--fail-severity`, etc..
    required: false
    format: "positional"
