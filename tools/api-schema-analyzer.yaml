name: "api-schema-analyzer"
command: "spectral"
args: ["lint"]
enabled: true
short_description: "API schema analysis tool, identifies potential security issues"
description: |
  Calls `spectral lint` to perform static analysis on OpenAPI/Swagger/GraphQL schemas, and can be combined with custom rule sets or output formats.
parameters:
  - name: "schema_url"
    type: "string"
    description: "API schema file or URL (the target passed to spectral lint)"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
      Additional Spectral arguments, e.g. `--ruleset`, `--format`, `--fail-severity`, etc.
    required: false
    format: "positional"
