name: "katana"
command: "katana"
enabled: true
short_description: "A next-generation web crawler and spider tool"
description: |
  Katana is a fast, smart web-crawling tool for discovering endpoints and resources in web applications.

  **Key features:**
  - Smart web crawler
  - JavaScript Rendering support
  - Form extraction
  - Endpoint discovery

  **Use cases:**
  - Web Application reconnaissance
  - Endpoint discovery
  - Content crawling
  - Security testing
parameters:
  - name: "url"
    type: "string"
    description: "TargetURL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "depth"
    type: "int"
    description: "Crawl depth"
    required: false
    flag: "-d"
    format: "flag"
    default: 3
  - name: "js_crawl"
    type: "bool"
    description: "Enable JavaScript crawling"
    required: false
    flag: "-jc"
    format: "flag"
    default: true
  - name: "form_extraction"
    type: "bool"
    description: "Enable form extraction (-fx / -form-extraction)"
    required: false
    flag: "-fx"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: |
      Extra Katana arguments. Used to pass Katana options not defined in the parameter list.

      **Example value:**
      - "-headless": Use a headless browser
      - "-output-template '{{url}}'": Custom output format
      - "-output output.txt": Output to a file
      - "-c 20": Concurrency

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
