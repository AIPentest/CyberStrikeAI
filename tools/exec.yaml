name: "exec"
command: "sh"
args: ["-c"]
enabled: true
# Short description (used in the tool list, to reduce token consumption)
short_description: "System command execution tool, used to execute shell commands and system operations (use with caution)"
# Detailed tool description
description: |
  System command execution tool, used to execute shell commands and perform system operations.

  **Main features:**
  - Execute arbitrary shell commands
  - Supports shells such as bash, sh, etc.
  - Can specify the working directory
  - Returns the command execution result

  **Use cases:**
  - System administration and maintenance
  - Automated script execution
  - File operations and processing
  - System information gathering

  **Security warnings:**
  - ⚠️ This tool can execute arbitrary system commands and poses a security risk
  - ⚠️ It should only be used in controlled environments
  - ⚠️ All command executions are logged
  - ⚠️ It is recommended to restrict the range of executable commands
  - ⚠️ Do not execute untrusted commands
# Parameter definitions
parameters:
  - name: "command"
    type: "string"
    description: |
      The system command to execute. Can be any valid shell command.

      **Format requirements:**
      - A complete shell command
      - Can include shell features such as pipes and redirection
      - Supports environment variables

      **Example values:**
      - Simple command: "ls -la"
      - With a pipe: "ps aux | grep nginx"
      - File operation: "cat /etc/passwd"
      - Network command: "curl http://example.com"
      - System information: "uname -a"
      - Find files: "find /var/log -name '*.log'"

      **Notes:**
      - The command is executed in the specified shell
      - Ensure the command syntax is correct
      - Be mindful of the security implications of the command
      - Required parameter, cannot be empty
    required: true
    position: 0
    format: "positional"
  - name: "shell"
    type: "string"
    description: |
      The shell type to use, defaults to sh.

      **Allowed values:**
      - sh: the standard shell (default)
      - bash: the Bash shell
      - zsh: the Z shell
      - other shells available on the system

      **Example values:**
      - "sh" (default)
      - "bash"
      - "zsh"

      **Notes:**
      - Ensure the specified shell is available on the system
      - Command syntax may differ slightly between shells
    required: false
    default: "sh"
  - name: "workdir"
    type: "string"
    description: |
      The working directory for command execution. If not specified, the current working directory is used.

      **Format requirements:**
      - Absolute or relative path
      - The directory must exist

      **Example values:**
      - "/tmp"
      - "/var/log"
      - "./data"
      - "/home/user/project"

      **Notes:**
      - Ensure the directory exists and is accessible
      - Relative paths are relative to the program's run directory
    required: false
  - name: "additional_args"
    type: "string"
    description: |
      Additional exec arguments. Used to pass exec options that are not defined in the parameter list.

      **Example values:**
      - Add common parameter examples based on tool characteristics

      **Notes:**
      - Multiple arguments are separated by spaces
      - Ensure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
