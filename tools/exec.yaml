name: "exec"
command: "sh"
args: ["-c"]
enabled: true
# Short description (used in the tool list to reduce token usage)
short_description: "a system-command execution tool for running shell commands and system operations (use with caution)"
# Detailed tool description
description: |
  a system-command execution tool for running shell commands and system operations.

  **Key features:**
  - Run an arbitrary shell command
  - Supports bash, sh, etc.shell
  - You can specify the working directory
  - Returns the command-execution result

  **Use cases:**
  - System administration and maintenance
  - Automated script execution
  - File operations and processing
  - System information gathering

  **Security warning:**
  - ⚠️ This tool can run arbitrary system commands and carries security risk
  - ⚠️ Should only be used in a controlled environment
  - ⚠️ All command executions are logged
  - ⚠️ It is recommended to restrict the range of executable commands
  - ⚠️ Do not run untrusted commands
# Parameter definitions
parameters:
  - name: "command"
    type: "string"
    description: |
      System command to run. Can be any valid shell command.

      **Format requirements:**
      - The full shell command
      - Can include shell features such as pipes and redirection
      - Supports environment variables

      **Example value:**
      - Simple command: "ls -la"
      - With pipe: "ps aux | grep nginx"
      - File operations: "cat /etc/passwd"
      - Network commands: "curl http://example.com"
      - System information: "uname -a"
      - Find files: "find /var/log -name '*.log'"

      **Notes:**
      - The command runs in the specified shell
      - Make sure the command syntax is correct
      - Be mindful of the security impact of the command
      - Required parameter; cannot be empty
    required: true
    position: 0
    format: "positional"
  - name: "shell"
    type: "string"
    description: |
      Shell type to use; defaults to sh.

      **Possible values:**
      - sh: Standard shell (default)
      - bash: Bash Shell
      - zsh: Z Shell
      - available to other systemsshell

      **Example value:**
      - "sh" (Default)
      - "bash"
      - "zsh"

      **Notes:**
      - Ensure the specified shell is available on the system
      - Command syntax may differ slightly between shells
    required: false
    default: "sh"
  - name: "workdir"
    type: "string"
    description: |
      Working directory for command execution. If not specified, the current working directory is used.

      **Format requirements:**
      - Absolute or relative path
      - The directory must exist

      **Example value:**
      - "/tmp"
      - "/var/log"
      - "./data"
      - "/home/user/project"

      **Notes:**
      - Make sure the directory exists and is accessible
      - A relative path is relative to the program's working directory
    required: false
  - name: "additional_args"
    type: "string"
    description: |
      Extra exec arguments. Used to pass exec options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
