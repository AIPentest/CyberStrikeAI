name: "wpscan"
command: "wpscan"
enabled: true
# Allowed exit-code list: wpscan returns exit code 4 when the target is not a WordPress site, which is normal informational output
allowed_exit_codes: [4]
short_description: "WordPress a security scanner for detecting WordPress vulnerabilities"
description: |
  WPScan is a tool dedicated to WordPress security scanning that can detect theme, plugin, and core vulnerabilities.

  **Key features:**
  - WordPress Core vulnerability detection
  - Theme and plugin vulnerability scanning
  - User enumeration
  - Password brute-forcing
  - Security-configuration checks

  **Use cases:**
  - WordPress Security assessment
  - Vulnerability scanning
  - Penetration testing
  - Security auditing
parameters:
  - name: "url"
    type: "string"
    description: "WordPress SiteURL"
    required: true
    flag: "--url"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Extra WPScan arguments"
    required: false
    format: "positional"
