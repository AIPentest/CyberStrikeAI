name: "dalfox"
command: "dalfox"
# dalfox v2+ Uses subcommands; single-target mode is `dalfox url <target>`, the root-level form is no longer supported -u
args:
  - "url"
enabled: true
short_description: "An advanced XSS vulnerability scanner"
description: |
  Dalfox is an advanced XSS vulnerability scanner supporting many XSS detection techniques.

  **Key features:**
  - XSS Vulnerability detection
  - Blind-XSS testing
  - DOM Mining
  - Dictionary mining

  **Use cases:**
  - XSS Vulnerability testing
  - Web Application security testing
  - Bug bounty Reconnaissance
  - Security testing
parameters:
  - name: "url"
    type: "string"
    description: |
      Target URL. In dalfox single-target mode the subcommand is url, and this is passed as the first positional argument after url.
      Example equivalent CLI: dalfox url "http://target/page?q=test"
    required: true
    position: 0
    format: "positional"
  - name: "pipe_mode"
    type: "bool"
    description: "Input using pipe mode"
    required: false
    flag: "--pipe"
    format: "flag"
    default: false
  - name: "blind"
    type: "string"
    description: "Blind-XSS callback address (e.g. Burp Collaborator URL)"
    required: false
    flag: "--blind"
    format: "flag"
  - name: "mining_dom"
    type: "bool"
    description: "Enable DOM mining"
    required: false
    flag: "--mining-dom"
    format: "flag"
    default: true
  - name: "mining_dict"
    type: "bool"
    description: "Enable dictionary mining"
    required: false
    flag: "--mining-dict"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: |
      Extra dalfox arguments. Used to pass dalfox options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
