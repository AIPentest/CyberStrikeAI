name: "nbtscan"
command: "nbtscan"
enabled: true
short_description: "NetBIOS a name-scanning tool"
description: |
  Nbtscan is a NetBIOS name-scanning tool for discovering Windows systems on a network.

  **Key features:**
  - NetBIOS Name scanning
  - Windows System discovery
  - Network mapping
  - Fast scan

  **Use cases:**
  - Windows Network discovery
  - NetBIOS Enumeration
  - Network mapping
  - Penetration testing
parameters:
  - name: "target"
    type: "string"
    description: "Target IP address or range"
    required: true
    position: 0
    format: "positional"
  - name: "verbose"
    type: "bool"
    description: "Verbose output"
    required: false
    flag: "-v"
    format: "flag"
    default: false
  - name: "timeout"
    type: "int"
    description: "Timeout (seconds)"
    required: false
    flag: "-t"
    format: "flag"
    default: 2
  - name: "additional_args"
    type: "string"
    description: |
      Extra nbtscan arguments. Used to pass nbtscan options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
