name: "clair"
command: "clair"
enabled: false
short_description: "a container vulnerability-analysis tool"
description: |
  Clair is a container vulnerability-analysis tool for scanning vulnerabilities in container images.

  **Key features:**
  - Container image scanning
  - Vulnerability detection
  - Multiple databases supported
  - API Endpoint

  **Use cases:**
  - Container security scanning
  - Vulnerability detection
  - CI/CD Integration
  - Security auditing
parameters:
  - name: "image"
    type: "string"
    description: "Container image to scan"
    required: true
    flag: "--image"
    format: "flag"
  - name: "config"
    type: "string"
    description: "Clair Configuration file"
    required: false
    flag: "--config"
    format: "flag"
    default: "/etc/clair/config.yaml"
  - name: "output_format"
    type: "string"
    description: "Output format (json, yaml)"
    required: false
    flag: "--format"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
      Extra clair arguments. Used to pass clair options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
