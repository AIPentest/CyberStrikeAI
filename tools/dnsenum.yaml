name: "dnsenum"
command: "dnsenum"
enabled: true
short_description: "DNS Enumeration tool"
description: |
  DNSenum is a DNS information-gathering tool for enumerating DNS information.

  **Key features:**
  - DNS Information gathering
  - Subdomain enumeration
  - Zone-transfer testing
  - Reverse lookup

  **Use cases:**
  - DNS Enumeration
  - Subdomain discovery
  - Network reconnaissance
  - Penetration testing
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain"
    required: true
    position: 0
    format: "positional"
  - name: "dns_server"
    type: "string"
    description: "DNS server to use"
    required: false
    flag: "-n"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "Wordlist file used for brute-forcing"
    required: false
    flag: "-f"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra dnsenum arguments. Used to pass dnsenum options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
