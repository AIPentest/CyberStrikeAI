name: "dnsenum"
command: "dnsenum"
enabled: true
short_description: "DNS enumeration tool"
description: |
  DNSenum is a DNS information gathering tool used to enumerate DNS information.

  **Main features:**
  - DNS information gathering
  - Subdomain enumeration
  - Zone transfer testing
  - Reverse lookup

  **Use cases:**
  - DNS enumeration
  - Subdomain discovery
  - Network reconnaissance
  - Penetration testing
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain"
    required: true
    position: 0
    format: "positional"
  - name: "dns_server"
    type: "string"
    description: "DNS server to use"
    required: false
    flag: "-n"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "Dictionary file for brute-forcing"
    required: false
    flag: "-f"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra dnsenum arguments. Used to pass dnsenum options not defined in the parameter list.

      **Example values:**
      - Add common parameter examples according to the tool's characteristics

      **Notes:**
      - Multiple arguments are separated by spaces
      - Make sure arguments are correctly formatted to avoid command injection
      - This argument is appended directly to the end of the command
    required: false
    format: "positional"
