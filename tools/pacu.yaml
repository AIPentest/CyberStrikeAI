name: "pacu"
command: "pacu"
enabled: false
short_description: "AWS Penetration-testing framework"
description: |
  Pacu is an AWS penetration-testing framework for testing the security of AWS environments.

  **Key features:**
  - AWS Penetration testing
  - Privilege escalation
  - Data access
  - Modular architecture

  **Use cases:**
  - AWS Security testing
  - Penetration testing
  - Privilege testing
  - Security assessment
parameters:
  - name: "session_name"
    type: "string"
    description: "Pacu Session name"
    required: false
    flag: "--session"
    format: "flag"
    default: "hexstrike_session"
  - name: "modules"
    type: "string"
    description: "Modules to run (comma-separated)"
    required: false
    flag: "--modules"
    format: "flag"
  - name: "regions"
    type: "string"
    description: "AWS Regions (comma-separated)"
    required: false
    flag: "--regions"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra pacu arguments. Used to pass pacu options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
