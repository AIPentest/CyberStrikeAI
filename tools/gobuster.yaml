name: "gobuster"
command: "gobuster"
enabled: false
short_description: "Web a content-scanning tool for discovering directories, files, and subdomains"
description: |
  Gobuster is a fast content-discovery tool for enumerating directories, files, and subdomains of web applications.

  **Key features:**
  - Directory and file discovery
  - DNS Subdomain enumeration
  - Virtual host discovery
  - Supports many modes (dir, dns, fuzz, vhost)

  **Use cases:**
  - Web Application security testing
  - Directory enumeration and file discovery
  - Subdomain discovery
  - Penetration-testing information gathering
parameters:
  - name: "mode"
    type: "string"
    description: |
      Scan mode (Gobuster subcommand), corresponding to the following values: 
      - `dir`: Directory/file enumeration
      - `dns`: DNS Subdomain enumeration
      - `fuzz`: Template FUZZ scanning
      - `vhost`: Virtual host discovery

      **Note:**
      Gobuster requires the first argument to be the mode subcommand, so it is passed here as a positional argument.
    required: false
    default: "dir"
    position: 0
    format: "positional"
    options: ["dir", "dns", "fuzz", "vhost"]
  - name: "url"
    type: "string"
    description: "TargetURL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "Wordlist file path"
    required: false
    default: "/usr/share/wordlists/dirb/common.txt"
    flag: "-w"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Extra Gobuster arguments"
    required: false
    format: "positional"
