name: "one-gadget"
command: "one_gadget"
enabled: true
short_description: "a tool for finding one-shot RCE gadgets in libc"
description: |
  One-gadget is a tool for finding one-shot RCE gadgets in libc.

  **Key features:**
  - One-shot gadget Search
  - Constraint-level checking
  - Multiple libc versions supported

  **Use cases:**
  - CTF Challenge
  - Exploit development
  - ROP Chain simplification
  - Security research
parameters:
  - name: "libc_path"
    type: "string"
    description: "libc Binary file path"
    required: true
    position: 0
    format: "positional"
  - name: "level"
    type: "int"
    description: "Constraint level (0, 1, 2)"
    required: false
    flag: "-l"
    format: "flag"
    default: 1
  - name: "additional_args"
    type: "string"
    description: |
      Extra one-gadget arguments. Used to pass one-gadget options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
