name: "gdb"
command: "gdb"
enabled: true
short_description: "GNU a debugger for binary analysis and debugging"
description: |
  GDB is the GNU debugger, used to debug and analyze binary programs.

  **Key features:**
  - Program debugging
  - Memory analysis
  - Disassembly
  - Breakpoint setting

  **Use cases:**
  - Binary analysis
  - Vulnerability research
  - Reverse engineering
  - Program debugging
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "commands"
    type: "string"
    description: "GDB command(s) to run (semicolon-separated)"
    required: false
    flag: "-ex"
    format: "flag"
  - name: "script_file"
    type: "string"
    description: "GDB Script file path"
    required: false
    flag: "-x"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra gdb arguments. Used to pass gdb options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
