name: "wafw00f"
command: "wafw00f"
enabled: true
short_description: "WAF an identification and fingerprinting tool"
description: |
  Wafw00f is a web application firewall (WAF) detection and fingerprinting tool.

  **Key features:**
  - WAF Detection
  - WAF Fingerprinting
  - Multiple WAFs supported
  - Bypass-technique detection

  **Use cases:**
  - WAF Identification
  - Security testing
  - Penetration testing
  - Security assessment
parameters:
  - name: "target"
    type: "string"
    description: "Target URL or IP"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
      Extra wafw00f arguments. Used to pass wafw00f options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
