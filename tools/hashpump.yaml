name: "hashpump"
command: "hashpump"
enabled: true
short_description: "a hash length-extension attack tool"
description: |
  HashPump is a tool for performing hash length-extension attacks.

  **Key features:**
  - Hash length-extension attack
  - Multiple hash algorithms supported
  - Signature generation
  - Data appending

  **Use cases:**
  - Cryptographic attacks
  - Hash-function testing
  - CTF Challenge
  - Security research
parameters:
  - name: "signature"
    type: "string"
    description: "Original hash signature"
    required: true
    flag: "-s"
    format: "flag"
  - name: "data"
    type: "string"
    description: "Raw data"
    required: true
    flag: "-d"
    format: "flag"
  - name: "key_length"
    type: "int"
    description: "Key length"
    required: true
    flag: "-k"
    format: "flag"
  - name: "append_data"
    type: "string"
    description: "Data to append"
    required: true
    flag: "-a"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra hashpump arguments. Used to pass hashpump options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
