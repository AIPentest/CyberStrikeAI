name: "prowler"
command: "prowler"
enabled: true
short_description: "a cloud security-assessment tool (AWS, Azure, GCP)"
description: |
  Prowler is a comprehensive cloud security-assessment tool supporting AWS, Azure, and GCP.

  **Key features:**
  - Cloud security assessment
  - Compliance checking
  - Security best-practice checks
  - Multiple output formats

  **Use cases:**
  - Cloud security auditing
  - Compliance checking
  - Security assessment
  - Cloud configuration auditing
parameters:
  - name: "provider"
    type: "string"
    description: "Cloud provider (aws, azure, gcp)"
    required: false
    default: "aws"
    position: 0
    format: "positional"
  - name: "profile"
    type: "string"
    description: "AWS Configuration file"
    required: false
    flag: "-p"
    format: "flag"
    default: "default"
  - name: "region"
    type: "string"
    description: "The specific region to scan"
    required: false
    flag: "-r"
    format: "flag"
  - name: "checks"
    type: "string"
    description: "Specific check to run"
    required: false
    flag: "-c"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "Output format (json, csv, html)"
    required: false
    flag: "-M"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
      Extra prowler arguments. Used to pass prowler options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
