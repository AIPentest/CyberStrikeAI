name: "dotdotpwn"
command: "dotdotpwn"
enabled: true
short_description: "a directory-traversal vulnerability-testing tool"
description: |
  DotDotPwn is a directory-traversal vulnerability-testing tool supporting many protocols.

  **Key features:**
  - Directory-traversal testing
  - Multiple protocols supported (HTTP, FTP, TFTP, etc.)
  - Automated testing
  - Report generation

  **Use cases:**
  - Directory-traversal vulnerability testing
  - Web Application security testing
  - Penetration testing
  - Vulnerability verification
parameters:
  - name: "target"
    type: "string"
    description: "Target hostname or IP"
    required: true
    flag: "-h"
    format: "flag"
  - name: "module"
    type: "string"
    description: "Module to use (http, ftp, tftp, etc.)"
    required: false
    flag: "-m"
    format: "flag"
    default: "http"
  - name: "additional_args"
    type: "string"
    description: |
      Extra dotdotpwn arguments. Used to pass dotdotpwn options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
