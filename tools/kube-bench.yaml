name: "kube-bench"
command: "kube-bench"
enabled: true
short_description: "CIS Kubernetes a benchmark-checking tool"
description: |
  Kube-bench is a CIS Kubernetes benchmark checking tool for verifying whether a Kubernetes cluster complies with the CIS benchmark.

  **Key features:**
  - CIS Benchmark checking
  - Multiple target types supported (master, node, etcd, policies)
  - Detailed report
  - Configuration verification

  **Use cases:**
  - Kubernetes Compliance checking
  - Security-configuration auditing
  - CIS Benchmark verification
  - Security assessment
parameters:
  - name: "targets"
    type: "string"
    description: "Target to check (master, node, etcd, policies)"
    required: false
    flag: "--targets"
    format: "flag"
  - name: "version"
    type: "string"
    description: "Kubernetes Version"
    required: false
    flag: "--version"
    format: "flag"
  - name: "config_dir"
    type: "string"
    description: "Configuration directory"
    required: false
    flag: "--config-dir"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "Output format (json, yaml)"
    required: false
    flag: "--output"
    format: "flag"
    default: "json"
  - name: "additional_args"
    type: "string"
    description: |
      Extra kube-bench arguments. Used to pass kube-bench options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
