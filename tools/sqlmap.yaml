name: "sqlmap"
command: "sqlmap"
enabled: true
# Short description (used in the tool list to reduce token usage)
short_description: "An automated SQL-injection detection and exploitation tool for finding and exploiting SQL-injection vulnerabilities"
# Detailed tool description
description: |
  An automated SQL-injection detection and exploitation tool for finding and exploiting SQL-injection vulnerabilities.

  **Key features:**
  - Automatically detect SQL-injection vulnerabilities
  - Supports many database types (MySQL, PostgreSQL, Oracle, MSSQL, etc.)
  - Automatically extract database information (tables, columns, data)
  - Supports many injection techniques (boolean-blind, time-blind, union-based, etc.)
  - Supports advanced features such as file upload/download and command execution

  **Use cases:**
  - Web Application security testing
  - SQL Injection-vulnerability detection
  - Database information gathering
  - Penetration testing and vulnerability verification

  **Notes:**
  - For authorized security testing only
  - Some operations may have an impact on the target system
  - It is recommended to verify in a test environment first
  - Use the --batch parameter to avoid interactive prompts
# Parameter definitions
parameters:
  - name: "url"
    type: "string"
    description: |
      Target URL, containing parameters that may be vulnerable to SQL injection.

      **Format requirements:**
      - Full URL, including the protocol (http:// or https://)
      - Must include query parameters, with the injection point marked by * in the value
      - or provide a full URL directly, and sqlmap will auto-detect the parameters

      **Example value:**
      - Mark the injection point: "http://example.com/page?id=1*"
      - FullURL: "http://example.com/page?id=1"
      - POST data: "http://example.com/login" (requires the data parameter)
      - Cookie injection: "http://example.com/page" (requires the cookie parameter)

      **Notes:**
      - URL Must be accessible
      - Make sure the URL is well-formed, including the protocol prefix
      - If using a POST request, the data parameter is required
      - Required parameter; cannot be empty
    required: true
    flag: "-u"
    format: "flag"
  - name: "batch"
    type: "bool"
    description: |
      Non-interactive mode: automatically chooses default options, requiring no user input.

      **Use cases:**
      - Automated test script
      - Batch scanning
      - Avoid interactive prompts

      **Notes:**
      - Recommended to always set to true to avoid the tool waiting for user input
      - Default value: true
    required: false
    default: true
    flag: "--batch"
    format: "flag"
  - name: "level"
    type: "int"
    description: |
      Test level, range 1-5; a higher level is more thorough but takes longer.

      **Level description:**
      - Level 1: Basic test, fast but may miss vulnerabilities
      - Level 2: Default level, balancing speed and coverage
      - Level 3: Extended test, more thorough detection
      - Level 4: Deep test, including more payload
      - Level 5: The most thorough test, including all known techniques

      **Recommendation:**
      - Used for fast scanning1-2
      - Use 3 for regular testing (default)
      - Used for deep testing4-5

      **Notes:**
      - A higher level means more requests and a greater chance of being blocked by a WAF
      - Default value: 3
    required: false
    default: 3
    flag: "--level"
    format: "combined" # --level=3
  - name: "data"
    type: "string"
    description: |
      POST Data string, used for SQL-injection detection in POST requests.

      **Format:**
      - Form-data format, e.g. "username=admin&password=123"
      - JSON Format, e.g. '{"username":"admin","password":"123"}'

      **Notes:**
      - If the URL uses the POST method, this parameter must be provided
      - Mark the injection point in the parameter value with *
    required: false
    flag: "--data"
    format: "flag"
  - name: "cookie"
    type: "string"
    description: |
      Cookie string, used for cookie-injection detection.

      **Format:**
      - Standard cookie format, e.g. "sessionid=abc123; user=admin"

      **Notes:**
      - If there is cookie injection, this parameter must be provided
    required: false
    flag: "--cookie"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra SQLMap arguments. Used to pass SQLMap options not defined in the parameter list.

      **Example value:**
      - "--dbs": List all databases
      - "--tables -D database": List the tables of the specified database
      - "--dump -D database -T table": Export table data
      - "--os-shell": Obtain the operating systemshell
      - "--risk 2": Risk level (1-3)
      - "--threads 10": Number of concurrent threads
      - "--tamper space2comment": Use a tamper script to bypass WAF

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
