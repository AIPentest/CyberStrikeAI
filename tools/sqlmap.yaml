name: "sqlmap"
command: "sqlmap"
enabled: true
# Short description (used for the tool list, to reduce token consumption)
short_description: "Automated SQL injection detection and exploitation tool, used to find and exploit SQL injection vulnerabilities"
# Detailed tool description
description: |
  Automated SQL injection detection and exploitation tool, used to find and exploit SQL injection vulnerabilities.

  **Main features:**
  - Automatic detection of SQL injection vulnerabilities
  - Support for multiple database types (MySQL, PostgreSQL, Oracle, MSSQL, etc.)
  - Automatic extraction of database information (tables, columns, data)
  - Support for multiple injection techniques (boolean-based blind, time-based blind, UNION queries, etc.)
  - Support for advanced features such as file upload/download and command execution

  **Use cases:**
  - Web application security testing
  - SQL injection vulnerability detection
  - Database information gathering
  - Penetration testing and vulnerability verification

  **Notes:**
  - Only for use in authorized security testing
  - Some operations may affect the target system
  - Recommended to validate in a test environment first
  - Use the --batch argument to avoid interactive prompts
# Parameter definitions
parameters:
  - name: "url"
    type: "string"
    description: |
      Target URL, containing the parameter that may be vulnerable to SQL injection.

      **Format requirements:**
      - Complete URL, including the protocol (http:// or https://)
      - Must contain query parameters; use * to mark the injection point in the parameter value
      - Or simply provide the complete URL, and sqlmap will detect parameters automatically

      **Example values:**
      - Mark injection point: "http://example.com/page?id=1*"
      - Complete URL: "http://example.com/page?id=1"
      - POST data: "http://example.com/login" (must be combined with the data parameter)
      - Cookie injection: "http://example.com/page" (must be combined with the cookie parameter)

      **Notes:**
      - The URL must be accessible
      - Make sure the URL format is correct, including the protocol prefix
      - If using POST requests, the data parameter must be provided
      - Required parameter, cannot be empty
    required: true
    flag: "-u"
    format: "flag"
  - name: "batch"
    type: "bool"
    description: |
      Non-interactive mode, automatically selects default options, no user input needed.

      **Use cases:**
      - Automated testing scripts
      - Bulk scanning
      - Avoiding interactive prompts

      **Notes:**
      - Recommended to always set it to true to avoid the tool waiting for user input
      - The default value is true
    required: false
    default: true
    flag: "--batch"
    format: "flag"
  - name: "level"
    type: "int"
    description: |
      Testing level, range 1-5; the higher the level, the more thorough the test but the longer it takes.

      **Level explanation:**
      - Level 1: basic testing, fast but may miss vulnerabilities
      - Level 2: default level, balancing speed and coverage
      - Level 3: extended testing, more comprehensive detection
      - Level 4: deep testing, includes more payloads
      - Level 5: most comprehensive testing, includes all known techniques

      **Recommendations:**
      - Use 1-2 for quick scans
      - Use 3 for routine testing (default)
      - Use 4-5 for deep testing

      **Notes:**
      - The higher the level, the more requests, which may be intercepted by a WAF
      - The default value is 3
    required: false
    default: 3
    flag: "--level"
    format: "combined" # --level=3
  - name: "data"
    type: "string"
    description: |
      POST data string, used for SQL injection detection in POST requests.

      **Format:**
      - Form data format, e.g.: "username=admin&password=123"
      - JSON format, e.g.: '{"username":"admin","password":"123"}'

      **Notes:**
      - If the URL uses the POST method, this parameter must be provided
      - Mark the injection point in the parameter value with *
    required: false
    flag: "--data"
    format: "flag"
  - name: "cookie"
    type: "string"
    description: |
      Cookie string, used for cookie injection detection.

      **Format:**
      - Standard cookie format, e.g.: "sessionid=abc123; user=admin"

      **Notes:**
      - If cookie injection exists, this parameter must be provided
    required: false
    flag: "--cookie"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra SQLMap arguments. Used to pass SQLMap options not defined in the parameter list.

      **Example values:**
      - "--dbs": list all databases
      - "--tables -D database": list the tables of the specified database
      - "--dump -D database -T table": dump table data
      - "--os-shell": get an operating system shell
      - "--risk 2": risk level (1-3)
      - "--threads 10": number of concurrent threads
      - "--tamper space2comment": use a tamper script to bypass WAF

      **Notes:**
      - Multiple arguments are separated by spaces
      - Make sure arguments are correctly formatted to avoid command injection
      - This argument is appended directly to the end of the command
    required: false
    format: "positional"
