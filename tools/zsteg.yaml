name: "zsteg"
command: "zsteg"
enabled: true
short_description: "LSB a steganography-detection tool for detecting hidden data in PNG/BMP images"
description: |
  zsteg is a tool for detecting LSB (Least Significant Bit) steganography in PNG and BMP images.

  **Key features:**
  - LSB Steganography detection
  - Multiple steganography algorithms supported
  - Automatically extract hidden data
  - Supports many image formats

  **Use cases:**
  - CTF Steganography challenges
  - Image steganalysis
  - Digital forensics
  - Security research

  **Notes:**
  - Requires a Ruby environment
  - Supports PNG and BMP formats
  - Can detect many steganography algorithms
parameters:
  - name: "file"
    type: "string"
    description: "Path to the image file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "all"
    type: "bool"
    description: "Detect all possible steganography methods"
    required: false
    flag: "--all"
    format: "flag"
  - name: "lsb"
    type: "bool"
    description: "Detect LSB steganography only"
    required: false
    flag: "--lsb"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra zsteg arguments. Used to pass zsteg options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
