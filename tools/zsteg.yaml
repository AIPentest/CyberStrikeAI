name: "zsteg"
command: "zsteg"
enabled: true
short_description: "LSB steganography detection tool, used to detect hidden data in PNG/BMP images"
description: |
  zsteg is a tool for detecting LSB (Least Significant Bit) steganography in PNG and BMP images.

  **Main features:**
  - LSB steganography detection
  - Support for multiple steganography algorithms
  - Automatic extraction of hidden data
  - Support for multiple image formats

  **Use cases:**
  - CTF steganography challenges
  - Image steganalysis
  - Digital forensics
  - Security research

  **Notes:**
  - Requires a Ruby environment
  - Supports the PNG and BMP formats
  - Can detect multiple steganography algorithms
parameters:
  - name: "file"
    type: "string"
    description: "Path of the image file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "all"
    type: "bool"
    description: "Detect all possible steganography methods"
    required: false
    flag: "--all"
    format: "flag"
  - name: "lsb"
    type: "bool"
    description: "Detect only LSB steganography"
    required: false
    flag: "--lsb"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional zsteg arguments. Used to pass zsteg options that are not defined in the parameter list.

      **Example values:**
      - Add common parameter examples based on tool characteristics

      **Notes:**
      - Multiple arguments are separated by spaces
      - Ensure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
