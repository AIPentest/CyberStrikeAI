name: "jaeles"
command: "jaeles"
args: ["scan"]
enabled: true
short_description: "an advanced vulnerability scanner supporting custom signatures"
description: |
  Jaeles is an advanced vulnerability scanner supporting custom signatures for detection.

  **Key features:**
  - Custom-signature support
  - Multiple vulnerability-detection types
  - Fast scan
  - Detailed report

  **Use cases:**
  - Vulnerability scanning
  - Web Application security testing
  - Custom detection rules
  - Security testing
parameters:
  - name: "url"
    type: "string"
    description: "TargetURL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "signatures"
    type: "string"
    description: "Custom-signature path"
    required: false
    flag: "-s"
    format: "flag"
  - name: "config"
    type: "string"
    description: "Configuration file"
    required: false
    flag: "-c"
    format: "flag"
  - name: "threads"
    type: "int"
    description: "Number of threads"
    required: false
    flag: "-t"
    format: "flag"
    default: 20
  - name: "timeout"
    type: "int"
    description: "Request timeout (seconds)"
    required: false
    flag: "--timeout"
    format: "flag"
    default: 20
  - name: "additional_args"
    type: "string"
    description: |
      Extra jaeles arguments. Used to pass jaeles options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
