name: "x8"
command: "x8"
enabled: true
short_description: "a hidden-parameter discovery tool"
description: |
  X8 is a tool for discovering hidden parameters in web applications.

  **Key features:**
  - Hidden-parameter discovery
  - Multiple HTTP methods supported
  - Custom wordlist
  - Fast scan

  **Use cases:**
  - Parameter discovery
  - Web Application security testing
  - Bug bounty Reconnaissance
  - Security testing
parameters:
  - name: "url"
    type: "string"
    description: "TargetURL"
    required: true
    flag: "--url"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "Parameter wordlist"
    required: false
    flag: "--wordlist"
    format: "flag"
    default: "/usr/share/wordlists/x8/params.txt"
  - name: "method"
    type: "string"
    description: "HTTP Method"
    required: false
    flag: "--method"
    format: "flag"
    default: "GET"
  - name: "body"
    type: "string"
    description: "Request body"
    required: false
    flag: "--body"
    format: "flag"
  - name: "headers"
    type: "string"
    description: "Custom request headers"
    required: false
    flag: "--headers"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra x8 arguments. Used to pass x8 options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
