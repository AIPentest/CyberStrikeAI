name: "impacket"
command: "python3"
args:
  - "-c"
  - |
    import json
    import shlex
    import subprocess
    import sys

    if len(sys.argv) < 2:
        sys.stderr.write(" Missing Impacket script path\n")
        sys.exit(1)

    script_path = sys.argv[1]
    args_raw = sys.argv[2] if len(sys.argv) > 2 else ""
    extra = sys.argv[3] if len(sys.argv) > 3 else ""

    cmd = [script_path]

    if args_raw:
        parsed = []
        try:
            candidate = json.loads(args_raw)
            if isinstance(candidate, list):
                parsed = [str(item) for item in candidate]
            elif isinstance(candidate, str):
                parsed = shlex.split(candidate)
        except (json.JSONDecodeError, ValueError):
            parsed = shlex.split(args_raw)
        cmd.extend(parsed)

    if extra:
        cmd.extend(shlex.split(extra))

    proc = subprocess.run(cmd, capture_output=True, text=True)
    if proc.stdout:
        sys.stdout.write(proc.stdout)
    if proc.stderr:
        sys.stderr.write(proc.stderr)
    sys.exit(proc.returncode)
enabled: true
short_description: "Impacket a network-protocol toolkit for protocol attacks and lateral movement"
description: |
  Impacket is a Python toolkit for working with network protocols, commonly used in penetration testing and lateral movement.

  **Key features:**
  - SMB Protocol attacks
  - Kerberos Protocol attacks
  - RPC Protocol attacks
  - Remote command execution
  - Credential dumping
  - Pass-the-ticket attack

  **Common tools:**
  - psexec: Remote command execution
  - smbexec: SMB Remote execution
  - wmiexec: WMI Remote execution
  - secretsdump: Credential dumping
  - getTGT: Kerberos Ticket acquisition

  **Use cases:**
  - Lateral movement
  - Credential dumping
  - Remote command execution
  - Post-exploitation testing

  **Notes:**
  - Requires a Python environment
  - Requires the corresponding credentials
  - For authorized security testing only
  - The tool path is usually under /usr/share/doc/python3-impacket/examples/ or installed via pip
parameters:
  - name: "script"
    type: "string"
    description: "Impacket Script path, e.g. '/usr/share/doc/python3-impacket/examples/psexec.py'"
    required: true
    position: 0
    format: "positional"
  - name: "args"
    type: "string"
    description: "Script arguments (a JSON array or a space-separated string)"
    required: false
    default: ""
    position: 1
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
      Extra impacket arguments. Used to pass impacket options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    default: ""
    position: 2
    format: "positional"
