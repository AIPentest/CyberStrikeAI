name: "rustscan"
command: "rustscan"
enabled: true
short_description: "Ultra-fast port scanning (Rust); optional greppable output, batching, and scripting levels"
description: |
  RustScan 2.x: Fast port discovery, optionally followed by Nmap scripts.

  **Correspondence with `rustscan -h`:**
  - `-a` / `--addresses`: List of scan targets (comma-separated or a file)
  - `-p`: Comma-separated ports; `-r`: port range `start-end` (pick one, or combine with `-p` per the CLI)
  - `-g` / `--greppable`: Output ports only, for easy grep/piping
  - `--scripts`:**The official default is default** (runs Nmap); set to **none** for port discovery only, which is faster
  - `-b` batch-size, `-t` timeout, `--scan-order` , etc., to fine-tune speed and order

  **Usage recommendations:**
  - Fast port scan without Nmap: set `scripts` to `none`, and if needed add `-g`
  - If you need service detection/scripts: use `default` or `custom`, and make sure the local machine has nmap
parameters:
  # -a, --addresses
  - name: "target"
    type: "string"
    description: |
      Maps to `-a`: comma-separated CIDRs, IPs, or hostnames; can also be a path to a file with newlines/a list.
      Example: `192.168.1.1`, `10.0.0.1,10.0.0.2`, `192.168.0.0/24`
    required: true
    flag: "-a"
    format: "flag"
  # -p, --ports; Use range (-r) for a range; do not put 1-1000 into ports
  - name: "ports"
    type: "string"
    description: |
      Ports to scan, a **comma-separated list only**, corresponding to `-p`.
      Example: `22,80,443`, `80,443,8080`.
      For a range such as `1-1000`, use the **range** parameter (`-r`); do not put it in this parameter.
    required: false
    flag: "-p"
    format: "flag"
  # -r, --range (Use either this or the ports list, or combine them per the official documentation)
  - name: "range"
    type: "string"
    description: |
      Port range, in the form start-end, corresponding to `-r`.
      Examples: `1-1000`, `1-65535` (all ports is very slow).
      For discrete ports such as `22,80,443`, use **ports** (`-p`); do not put them in this parameter.
    required: false
    flag: "-r"
    format: "flag"
  # -u, --ulimit
  - name: "ulimit"
    type: "int"
    description: "Raise the ulimit for scanning; adjust per the system fd limit"
    required: false
    flag: "-u"
    format: "flag"
    default: 5000
  # --scripts: none | default | custom (CLI Default default)
  - name: "scripts"
    type: "string"
    description: |
      Script level; **must** be passed as a string, not true/false.
      - **none**: Skip Nmap, port discovery only (fastest)
      - **default**: Matches rustscan's official default; will invoke Nmap
      - **custom**: Custom script, usually used together with additional_args
    required: false
    flag: "--scripts"
    format: "flag"
    default: "none"
    options:
      - "none"
      - "default"
      - "custom"
  # -g, --greppable: Port list only, no Nmap output
  - name: "greppable"
    type: "bool"
    description: "Greppable mode: output ports only, suitable for script parsing or writing to a file"
    required: false
    flag: "-g"
    format: "flag"
    default: false
  # -b, --batch-size [default: 4500]
  - name: "batch_size"
    type: "int"
    description: "Ports per concurrent batch; larger is faster, limited by the OS open-file limit. Official default 4500"
    required: false
    flag: "-b"
    format: "flag"
  # -t, --timeout ms [default: 1500]
  - name: "timeout_ms"
    type: "int"
    description: "Per-port timeout (milliseconds). Official default 1500"
    required: false
    flag: "-t"
    format: "flag"
  # --scan-order serial | random [default: serial]
  - name: "scan_order"
    type: "string"
    description: "Scan order: serial (ascending); random"
    required: false
    flag: "--scan-order"
    format: "flag"
    options:
      - "serial"
      - "random"
  # --top: top 1000 Port
  - name: "top_ports"
    type: "bool"
    description: "Use the built-in top 1000 ports (equivalent to passing `--top`)"
    required: false
    flag: "--top"
    format: "flag"
    default: false
  # -e, --exclude-ports
  - name: "exclude_ports"
    type: "string"
    description: "Ports to exclude, comma-separated. Example : `80,443`"
    required: false
    flag: "-e"
    format: "flag"
  # -x, --exclude-addresses
  - name: "exclude_addresses"
    type: "string"
    description: "Addresses to exclude, comma-separated CIDRs/IPs/hosts"
    required: false
    flag: "-x"
    format: "flag"
  # --tries [default: 1]
  - name: "tries"
    type: "int"
    description: "Retries before deciding a port is closed; 0 is corrected to 1"
    required: false
    flag: "--tries"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Options not listed above can be written here, space-separated.
      Examples: `--no-banner`, `--udp`, `-n` (ignore the configuration file), `-c /path/config.toml`, `--resolver 8.8.8.8`
    required: false
    format: "positional"
