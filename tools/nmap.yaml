name: "nmap"
command: "nmap"
# Default: TCP connect scan + Version detection + Default NSE scripts (usable without root)
args: ["-sT", "-sV", "-sC"]
enabled: true
short_description: "Network scan: ports/services/scripts; optional timing, custom NSE, OS detection (requires root)"
description: |
  Network mapping and port scanning.

  **Default behavior (just pass target/ports):**
  - `-sT` TCP Connect scan (no need for root)
  - `-sV` Version detection
  - `-sC` Default NSE scripts

  **Optional enhancements:**
  - `timing`: `-T0`-`-T5` Timing
  - `nse_scripts`: `--script` Custom script (e.g. `vuln`, `http-*`)
  - `os_detection`: `-O` **Requires root**, otherwise nmap will QUITTING
  - `aggressive`: `-A` **Requires root** (includes OS detection)
  - `scan_type`: If provided, it **replaces the whole** default `-sT -sV -sC`, so you must write the options you need yourself (e.g. `-sT -sV`)

  **Notes:**
  - `-sS` SYN Scanning requires root; without root, use the default or `-sT`
  - Scanning all ports `1-65535` is very slow; start with common ports
  - Make sure you are authorized to scan the target
parameters:
  - name: "target"
    type: "string"
    description: |
      Target IP, hostname, CIDR, or domain; the host part is extracted automatically from a URL.

      **Example:** `192.168.1.1`, `10.0.0.0/24`, `example.com`
    required: true
    position: 1
    format: "positional"
  - name: "ports"
    type: "string"
    description: |
      Port range. Examples: `80`, `1-1000`, `80,443,8080`, `1-65535` (all ports is very slow)
    required: false
    flag: "-p"
    format: "flag"
  - name: "timing"
    type: "string"
    description: "Timing template T0–T5, A larger number is faster. Example: `4` produces `-T4`"
    required: false
    format: "template"
    template: "-T{value}"
  - name: "nse_scripts"
    type: "string"
    description: "NSE Scripts, passed to `--script`. Example : `vuln`, `http-title,http-headers`"
    required: false
    flag: "--script"
    format: "flag"
  - name: "os_detection"
    type: "bool"
    description: |
      Enable `-O` OS detection. **Requires root**; without root, keep it false.
    required: false
    flag: "-O"
    format: "flag"
    default: false
  - name: "aggressive"
    type: "bool"
    description: |
      Enable `-A` aggressive scan (includes OS detection). **Requires root**; without root, keep it false.
    required: false
    flag: "-A"
    format: "flag"
    default: false
  - name: "scan_type"
    type: "string"
    description: |
      Scan-type options; **if set, replaces the default `-sT -sV -sC`**, keeping only the options you write.
      Separate multiple options with spaces, e.g. `-sT -sV`, `-sU` (UDP).
    required: false
    format: "template"
    template: "{value}"
  - name: "additional_args"
    type: "string"
    description: |
      Extra arguments, appended to the end of the command by spaces.
      Example: `--max-retries 3`, `-v`, `-Pn`
    required: false
    format: "positional"
