name: "nmap"
command: "nmap"
# Defaults: TCP connect scan + version detection + default NSE scripts (usable even without root)
args: ["-sT", "-sV", "-sC"]
enabled: true
short_description: "Network scanning: ports/services/scripts; optional timing, custom NSE, OS detection (requires root)"
description: |
  Network mapping and port scanning.

  **Default behavior (just pass target/ports):**
  - `-sT` TCP connect scan (no root needed)
  - `-sV` version detection
  - `-sC` default NSE scripts

  **Optional enhancements:**
  - `timing`: `-T0` through `-T5` timing templates
  - `nse_scripts`: `--script` custom scripts (e.g. `vuln`, `http-*`)
  - `os_detection`: `-O` **requires root**, otherwise nmap will QUITTING
  - `aggressive`: `-A` **requires root** (includes OS detection)
  - `scan_type`: if passed, it **entirely replaces** the default `-sT -sV -sC` above; you must write in the options you need yourself (e.g. `-sT -sV`)

  **Notes:**
  - `-sS` SYN scan requires root; without root use the defaults or `-sT`
  - Scanning all ports `1-65535` is very slow; common ports first is recommended
  - Please ensure you are authorized to scan the target
parameters:
  - name: "target"
    type: "string"
    description: |
      Target IP, hostname, CIDR, or domain; URLs are automatically reduced to the host part.

      **Examples:** `192.168.1.1`, `10.0.0.0/24`, `example.com`
    required: true
    position: 1
    format: "positional"
  - name: "ports"
    type: "string"
    description: |
      Port range. Examples: `80`, `1-1000`, `80,443,8080`, `1-65535` (all ports is very slow)
    required: false
    flag: "-p"
    format: "flag"
  - name: "timing"
    type: "string"
    description: "Timing template T0–T5; the higher the number, the faster. Example: `4` yields `-T4`"
    required: false
    format: "template"
    template: "-T{value}"
  - name: "nse_scripts"
    type: "string"
    description: "NSE scripts, passed to `--script`. Examples: `vuln`, `http-title,http-headers`"
    required: false
    flag: "--script"
    format: "flag"
  - name: "os_detection"
    type: "bool"
    description: |
      Enable `-O` OS detection. **Requires root**; without root please keep false.
    required: false
    flag: "-O"
    format: "flag"
    default: false
  - name: "aggressive"
    type: "bool"
    description: |
      Enable `-A` aggressive scanning (includes OS detection). **Requires root**; without root please keep false.
    required: false
    flag: "-A"
    format: "flag"
    default: false
  - name: "scan_type"
    type: "string"
    description: |
      Scan type options; **if filled in, they replace the default `-sT -sV -sC`**, keeping only the options you write.
      Multiple options are separated by spaces, e.g.: `-sT -sV`, `-sU` (UDP).
    required: false
    format: "template"
    template: "{value}"
  - name: "additional_args"
    type: "string"
    description: |
      Additional arguments, appended to the end of the command separated by spaces.
      Examples: `--max-retries 3`, `-v`, `-Pn`
    required: false
    format: "positional"
