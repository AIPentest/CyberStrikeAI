name: "subfinder"
command: "subfinder"
enabled: true
short_description: "a passive subdomain-discovery tool using multiple data sources"
description: |
  Subfinder is a passive subdomain-discovery tool that discovers subdomains by querying multiple data sources.

  **Key features:**
  - Passive subdomain discovery
  - Multiple data sources integrated
  - Fast scan
  - Supports API-key configuration

  **Use cases:**
  - Subdomain enumeration
  - Asset discovery
  - Bug bounty Reconnaissance
  - Penetration-testing information gathering
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain"
    required: true
    flag: "-d"
    format: "flag"
  - name: "silent"
    type: "bool"
    description: "Silent mode"
    required: false
    default: true
    flag: "-silent"
    format: "flag"
  - name: "all_sources"
    type: "bool"
    description: "Use all data sources"
    required: false
    default: false
    flag: "-all"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Extra Subfinder arguments"
    required: false
    format: "positional"
