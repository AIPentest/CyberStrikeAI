name: "dirsearch"
command: "dirsearch"
enabled: true
short_description: "an advanced directory and file-discovery tool"
description: |
  Dirsearch is an advanced web content scanner for discovering directories and files.

  **Key features:**
  - Fast directory and file discovery
  - Multithreading support
  - Recursive scanning
  - Extension filtering

  **Use cases:**
  - Web Application security testing
  - Directory enumeration
  - File discovery
  - Penetration testing
parameters:
  - name: "url"
    type: "string"
    description: "TargetURL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "extensions"
    type: "string"
    description: "File extensions (comma-separated)"
    required: false
    flag: "-e"
    format: "flag"
    default: "php,html,js,txt,xml,json"
  - name: "wordlist"
    type: "string"
    description: "Wordlist file path"
    required: false
    flag: "-w"
    format: "flag"
  - name: "threads"
    type: "int"
    description: "Number of threads"
    required: false
    flag: "-t"
    format: "flag"
    default: 30
  - name: "recursive"
    type: "bool"
    description: "Enable recursive scanning"
    required: false
    flag: "-r"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: |
      Extra dirsearch arguments. Used to pass dirsearch options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
