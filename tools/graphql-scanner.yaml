name: "graphql-scanner"
command: "graphqlmap"
enabled: true
short_description: "GraphQL a security-scanning and introspection tool"
description: |
  An advanced GraphQL security scanning and introspection tool for detecting security issues in GraphQL APIs.

  **Key features:**
  - GraphQL Introspection
  - Query-depth testing
  - Mutation-operation testing
  - Vulnerability assessment

  **Use cases:**
  - GraphQL Security testing
  - API Security assessment
  - Vulnerability discovery
  - Security testing
parameters:
  - name: "endpoint"
    type: "string"
    description: "GraphQL EndpointURL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "introspection"
    type: "bool"
    description: "Test introspection queries"
    required: false
    default: true
    flag: "--introspection"
    format: "flag"
  - name: "query_depth"
    type: "int"
    description: "Maximum query depth to test"
    required: false
    default: 10
    flag: "--depth"
    format: "flag"
  - name: "test_mutations"
    type: "bool"
    description: "Test mutation operations"
    required: false
    default: true
    flag: "--mutations"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra graphql-scanner arguments. Used to pass graphql-scanner options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
