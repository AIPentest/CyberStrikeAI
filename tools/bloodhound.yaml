name: "bloodhound"
command: "bloodhound-python"
enabled: true
short_description: "Active Directory an attack-path analysis and visualization tool"
description: |
  BloodHound is an Active Directory attack-path analysis and visualization tool that collects in-domain information and analyzes attack paths.

  **Key features:**
  - Domain information gathering
  - Attack-path analysis
  - Permission-relationship visualization
  - Shortest-attack-path computation
  - High-risk path identification

  **Use cases:**
  - Active Directory Security assessment
  - Post-exploitation testing
  - Domain-environment auditing
  - Red-team exercise

  **Notes:**
  - Requires domain-user credentials
  - Requires Neo4j database support
  - The collection process may take a while
  - Recommended for use in authorized environments
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain"
    required: false
    flag: "-d"
    format: "flag"
  - name: "username"
    type: "string"
    description: "Domain username"
    required: false
    flag: "-u"
    format: "flag"
  - name: "password"
    type: "string"
    description: "Domain-user password"
    required: false
    flag: "-p"
    format: "flag"
  - name: "collection_method"
    type: "string"
    description: "Collection method (All, ACL, DCOM, LocalAdmin, RDP, etc.)"
    required: false
    default: "All"
    flag: "-c"
    format: "flag"
  - name: "dc"
    type: "string"
    description: "Domain-controller IP address"
    required: false
    flag: "-dc"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra bloodhound arguments. Used to pass bloodhound options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
