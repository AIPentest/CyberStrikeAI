name: "bloodhound"
command: "bloodhound-python"
enabled: true
short_description: "Active Directory attack path analysis and visualization tool"
description: |
  BloodHound is an Active Directory attack path analysis and visualization tool that collects information within the domain and analyzes attack paths.

  **Main features:**
  - Domain information gathering
  - Attack path analysis
  - Permission relationship visualization
  - Shortest attack path calculation
  - High-risk path identification

  **Use cases:**
  - Active Directory security assessment
  - Post-exploitation testing
  - Domain environment auditing
  - Red team exercises

  **Notes:**
  - Domain user credentials required
  - A Neo4j database is required for support
  - The collection process can take a long time
  - Recommended for use in authorized environments
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain"
    required: false
    flag: "-d"
    format: "flag"
  - name: "username"
    type: "string"
    description: "Domain username"
    required: false
    flag: "-u"
    format: "flag"
  - name: "password"
    type: "string"
    description: "Domain user password"
    required: false
    flag: "-p"
    format: "flag"
  - name: "collection_method"
    type: "string"
    description: "Collection method (All, ACL, DCOM, LocalAdmin, RDP, etc.)"
    required: false
    default: "All"
    flag: "-c"
    format: "flag"
  - name: "dc"
    type: "string"
    description: "Domain controller IP address"
    required: false
    flag: "-dc"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional bloodhound arguments. Used to pass bloodhound options not defined in the parameter list.

      **Example values:**
      - Add common parameter examples according to the tool's characteristics

      **Notes:**
      - Multiple arguments are separated by spaces
      - Ensure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
