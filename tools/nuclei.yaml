name: "nuclei"
command: "nuclei"
enabled: true
short_description: "a fast vulnerability scanner that uses YAML templates for detection"
description: |
  Nuclei is a fast template-based vulnerability scanner that uses community-maintained YAML templates for detection.

  **Key features:**
  - Fast vulnerability scanning
  - Template-based detection
  - Supports many protocols (HTTP, TCP, DNS, etc.)
  - Real-time result output
  - Supports custom templates

  **Use cases:**
  - Vulnerability scanning and discovery
  - Security assessment
  - Penetration testing
  - Vulnerability verification
parameters:
  - name: "target"
    type: "string"
    description: "Target URL or IP"
    required: true
    flag: "-u"
    format: "flag"
  - name: "severity"
    type: "string"
    description: "Severity filtering (critical,high,medium,low,info)"
    required: false
    flag: "-s"
    format: "flag"
  - name: "tags"
    type: "string"
    description: "Tag filtering (e.g. cve,rce,lfi)"
    required: false
    flag: "-tags"
    format: "flag"
  - name: "template"
    type: "string"
    description: "Custom-template path"
    required: false
    flag: "-t"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Extra Nuclei arguments"
    required: false
    format: "positional"
