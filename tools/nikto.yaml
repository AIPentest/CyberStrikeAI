name: "nikto"
command: "nikto"
enabled: true
# Allowed exit-code list: nikto returns exit code 1 when it finds a vulnerability, which is a normal success status
allowed_exit_codes: [1]
# Short description (used in the tool list to reduce token usage)
short_description: "Web a server-scanning tool for detecting known vulnerabilities and misconfigurations in web servers and applications"
# Detailed tool description
description: |
  Web a server-scanning tool for detecting known vulnerabilities, misconfigurations, and potential security issues in web servers and applications.

  **Key features:**
  - Detect web-server version and configuration issues
  - Identifies known web vulnerabilities and CVE
  - Detect dangerous files and directories
  - Check for server misconfigurations
  - Identify outdated software versions
  - Detect default files and scripts

  **Use cases:**
  - Web Application security assessment
  - Server-configuration auditing
  - Vulnerability scanning and discovery
  - Early-stage information gathering for penetration testing

  **Notes:**
  - Scanning may generate a large volume of logs; manage logs accordingly
  - Some scans may trigger WAF or IDS alerts
  - Recommended for use within an authorized scope
  - Scan results require manual verification
# Parameter definitions
parameters:
  - name: "target"
    type: "string"
    description: |
      Target URL or IP address. Can be a full URL or an IP address.

      **Format requirements:**
      - Can include the protocol (http:// or https://)
      - You can provide just an IP address or a domain
      - If only an IP is provided, http is used by default

      **Example value:**
      - FullURL: "http://example.com"
      - HTTPS: "https://example.com"
      - IP Address: "192.168.1.1"
      - With port: "http://example.com:8080"
      - With path: "http://example.com/admin"

      **Notes:**
      - If only an IP is provided, the tool uses the http protocol
      - It is recommended to provide a full URL to ensure correct scanning
      - Required parameter; cannot be empty
    required: true
    flag: "-h"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra nikto arguments. Used to pass nikto options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
