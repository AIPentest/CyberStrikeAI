name: "nikto"
command: "nikto"
enabled: true
# Allowed exit codes list: nikto returns exit code 1 when it finds vulnerabilities, which is a normal success status
allowed_exit_codes: [1]
# Short description (used for the tool list to reduce token consumption)
short_description: "Web server scanning tool used to detect known vulnerabilities and misconfigurations in web servers and applications"
# Detailed tool description
description: |
  Web server scanning tool used to detect known vulnerabilities, misconfigurations, and potential security issues in web servers and applications.

  **Main features:**
  - Detects web server versions and configuration issues
  - Identifies known web vulnerabilities and CVEs
  - Detects dangerous files and directories
  - Checks for server misconfigurations
  - Identifies outdated software versions
  - Detects default files and scripts

  **Use cases:**
  - Web application security assessment
  - Server configuration audit
  - Vulnerability scanning and discovery
  - Information gathering in early-stage penetration testing

  **Notes:**
  - Scanning may generate large amounts of logs; be mindful of log management
  - Some scans may trigger WAF or IDS alerts
  - Recommended to stay within authorized scope
  - Scan results require manual verification
# Parameter definitions
parameters:
  - name: "target"
    type: "string"
    description: |
      Target URL or IP address. Can be a full URL or an IP address.

      **Format requirements:**
      - Can include a protocol (http:// or https://)
      - Can provide just an IP address or domain name
      - If only an IP is provided, the http protocol is used by default

      **Example values:**
      - Full URL: "http://example.com"
      - HTTPS: "https://example.com"
      - IP address: "192.168.1.1"
      - With port: "http://example.com:8080"
      - With path: "http://example.com/admin"

      **Notes:**
      - If only an IP is provided, the tool will use the http protocol
      - Providing the full URL is recommended to ensure correct scanning
      - Required parameter; cannot be empty
    required: true
    flag: "-h"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional nikto arguments. Used to pass nikto options not defined in the parameter list.

      **Example values:**
      - Add common parameter examples according to the tool's characteristics

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
