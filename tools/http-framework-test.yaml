short_description: "Pure Python HTTP testing framework (httpx, session reuse + encoding guards)"
description: |
  An HTTP testing framework built in pure Python: based on httpx sessions and complemented by a socket probe to fill in DNS/TCP/TLS observation,
  it provides end-to-end request body encoding guards, repeated replay, and observability, and is suited to scenarios such as blind injection timing and complex payload tuning.

  **Highlights:**
  - Pure Python implementation: httpx session reuse, HTTP/2/proxy/certs configured directly in the script, no external binary dependencies
  - Path fidelity (curl --path-as-is): a custom Transport + the full request/redirect chain preserves literal `.`/`..`; HTTP forward proxies automatically use absolute-form; compatible with httpx 0.28 `proxy=`
  - Smart body encoding: supports canonical encoding of application/x-www-form-urlencoded, JSON/text charset inference,
    injecting binaries via `@file`/`@-`, and visual debugging
  - Connection probe: in no-proxy scenarios it additionally performs DNS/TCP/TLS probing, coarsely replicating the curl -w metrics
  - Repeatable observability: repeat/delay + TTFB/total/speed_download statistics, useful for blind injection/timing tests
  - Extended toggles: http2 / httpx_options parse http2, cert, verify, trust_env, max_redirects and other httpx options
  - Response body slimming: response_filter extracts lines/blocks by regex, combined with max_lines/max_bytes to limit stdout, reducing Agent token consumption

  **Response filtering best practices:**
  - Large pages/HTML: use `response_filter` to grab lines with keywords such as error|exception|password|token|uid
  - Without a filter: set `response_max_lines=80` or `response_max_bytes=8192` to keep the full page from flooding the context
  - Zero hits: automatically preview the first `response_preview_lines` lines, avoiding the misjudgment of an "empty response"
  - Full retention: use `download` to save large bodies to disk, keeping only the summary lines in stdout
parameters:
  - name: "url"
    type: "string"
    description: "Target URL (path-as-is by default, preserving literal paths such as ../; enable auto_encode_url to encode special characters)"
    required: true
    flag: "--url"
  - name: "method"
    type: "string"
    description: "HTTP method (GET, POST, PUT, DELETE, etc.)"
    required: false
    default: "GET"
    flag: "--method"
  - name: "data"
    type: "string"
    description: "Request data/parameters (supports JSON, form data, and raw payloads; the @file or @- prefix can load a file/STDIN)"
    required: false
    flag: "--data"
  - name: "headers"
    type: "object"
    description: "Custom request headers (dictionary format, e.g. {\"X-Custom\": \"value\"})"
    required: false
    flag: "--headers"
  - name: "cookies"
    type: "string"
    description: "Custom cookies (format: name1=value1; name2=value2)"
    required: false
    flag: "--cookies"
  - name: "user_agent"
    type: "string"
    description: "Custom User-Agent"
    required: false
    flag: "--user-agent"
  - name: "proxy"
    type: "string"
    description: "Proxy (http(s):// or socks5:// address, passed directly to the httpx Client)"
    required: false
    flag: "--proxy"
  - name: "timeout"
    type: "string"
    description: "Maximum timeout in seconds (decimals supported)"
    required: false
    flag: "--timeout"
  - name: "repeat"
    type: "int"
    description: "Number of repeated requests, for blind injection/stability observation (>=1)"
    required: false
    default: 1
    flag: "--repeat"
  - name: "delay"
    type: "string"
    description: "Delay between repeated requests in seconds (can be fractional)"
    required: false
    default: "0"
    flag: "--delay"
  - name: "include_headers"
    type: "bool"
    description: "Output response headers (on by default, can be turned off with --no-include-headers)"
    required: false
    default: true
    flag: "--include-headers"
  - name: "auto_encode_url"
    type: "bool"
    description: "Automatic URL encoding (on by default, can be turned off with --no-auto-encode-url)"
    required: false
    default: true
    flag: "--auto-encode-url"
  - name: "follow_redirects"
    type: "bool"
    description: "Follow redirects (httpx follow_redirects)"
    required: false
    default: false
    flag: "--follow-redirects"
  - name: "allow_insecure"
    type: "bool"
    description: "Ignore TLS certificate errors (verify=False)"
    required: false
    default: false
    flag: "--allow-insecure"
  - name: "verbose_output"
    type: "bool"
    description: "Output extra debug information (body bytes, probe latencies, history length, etc.)"
    required: false
    default: false
    flag: "--verbose-output"
  - name: "show_command"
    type: "bool"
    description: "Print a request overview (method, URL, all headers, body summary)"
    required: false
    default: true
    flag: "--show-command"
  - name: "show_summary"
    type: "bool"
    description: "Print a metric summary (on by default, including DNS/TCP/TLS/TTFB/Total)"
    required: false
    default: true
    flag: "--show-summary"
  - name: "debug"
    type: "bool"
    description: "Debug mode: shows body-encoding processing details (mode/charset/length)"
    required: false
    default: false
    flag: "--debug"
  - name: "response_encoding"
    type: "string"
    description: "Force the encoding used for response decoding (e.g. GBK), overriding automatic detection"
    required: false
    flag: "--response-encoding"
  - name: "response_filter"
    type: "string"
    description: |
      Regex filter for the response body (only affects stdout; does not affect --download or metrics).
      Default mode is line, matching line by line; example: '(error|exception|SQL|password|token|uid)'.
      Combined with response_max_lines/response_max_bytes it can significantly reduce token consumption.
    required: false
    flag: "--response-filter"
  - name: "response_filter_mode"
    type: "string"
    description: "Filter mode: line (per line, default), multiline (cross-line blocks), full (whole-segment DOTALL match)"
    required: false
    default: "line"
    flag: "--response-filter-mode"
  - name: "response_filter_invert"
    type: "bool"
    description: "Inverted filter: output lines that do not match the regex (used to strip out HTML noise)"
    required: false
    default: false
    flag: "--response-filter-invert"
  - name: "response_filter_ignore_case"
    type: "bool"
    description: "Case-insensitive regex"
    required: false
    default: false
    flag: "--response-filter-ignore-case"
  - name: "response_max_lines"
    type: "int"
    description: "Maximum number of lines output to stdout (0=unlimited); with a filter it limits matched lines, without one it truncates the whole text"
    required: false
    default: 0
    flag: "--response-max-lines"
  - name: "response_max_bytes"
    type: "int"
    description: "UTF-8 byte limit for the response body on stdout (0=unlimited), truncated beyond it"
    required: false
    default: 0
    flag: "--response-max-bytes"
  - name: "response_preview_lines"
    type: "int"
    description: "First N lines previewed when a filter has zero hits (default 5, 0=no preview)"
    required: false
    default: 5
    flag: "--response-preview-lines"
  - name: "response_context_lines"
    type: "int"
    description: "In line mode, keep N context lines above and below each matched line (similar to grep -C)"
    required: false
    default: 0
    flag: "--response-context-lines"
  - name: "action"
    type: "string"
    description: "Reserved field: marks the call intent (request, spider, etc.); not used inside the script"
    required: false
    default: "request"
    flag: "--action"
  - name: "download"
    type: "string"
    description: |
      Save the response body to a local file, writing the raw byte data:
      - "output.bin": a single request is saved directly to the specified file
      - "outputs/run-{i}.bin": with repeat>1, files are distinguished by sequence number ({i} will be replaced by 1,2,...)
    required: false
    flag: "--download"
  - name: "http2"
    type: "bool"
    description: "Enable HTTP/2 (requires installing h2: pip install 'httpx[http2]'). Can also be set in httpx_options: http2=true"
    required: false
    default: false
    flag: "--http2"
  - name: "httpx_options"
    type: "string"
    description: |
      Additional httpx Client options (passed through whole to --additional-args). Supports "key=value" or bare words (equivalent to key=true):
      - "http2=true"
      - "cert=/path/to/client.pem"
      - "verify=/path/to/ca.pem" or "verify=false"
      - "trust_env=false", "max_redirects=5", etc.
      Note: do not use the framework's generic additional_args field (it would be split into bare argv). Please use this field or http2.
    required: false
    flag: "--additional-args"
