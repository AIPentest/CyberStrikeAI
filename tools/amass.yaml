name: "amass"
command: "amass"
enabled: true
short_description: "a subdomain-enumeration and network-mapping tool"
description: |
  Amass is a deep subdomain-enumeration and network-mapping tool that discovers subdomains of a target domain through multiple techniques.

  **Key features:**
  - Passive and active subdomain enumeration
  - Integration of multiple data sources
  - Network mapping and visualization
  - Certificate-transparency log query

  **Use cases:**
  - Subdomain discovery
  - Asset discovery
  - Penetration-testing information gathering
  - Bug bounty Reconnaissance
parameters:
  - name: "mode"
    type: "string"
    description: |
      Run mode (Amass subcommand): 
      - `enum`: Subdomain enumeration
      - `intel`: Threat-intelligence mode
      - `viz`: Result visualization

      **Note:** Amass uses a subcommand form, which must be the first positional argument.
    required: false
    default: "enum"
    position: 0
    format: "positional"
    options: ["enum", "intel", "viz"]
  - name: "domain"
    type: "string"
    description: "Target domain"
    required: true
    flag: "-d"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: "Extra Amass arguments"
    required: false
    format: "positional"
