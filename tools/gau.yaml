name: "gau"
command: "gau"
enabled: true
short_description: "Obtains all ... from multiple data sourcesURL"
description: |
  Gau (Get All URLs) Obtains all of the target domain's ... from multiple data sourcesURL.

  **Key features:**
  - Retrieved from the Wayback MachineURL
  - Retrieved from CommonCrawlURL
  - Retrieved from OTXURL
  - Retrieved from URLScanURL

  **Use cases:**
  - URL Discovery
  - Historical URL collection
  - Bug bounty Reconnaissance
  - Security testing
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain"
    required: true
    position: 0
    format: "positional"
  - name: "providers"
    type: "string"
    description: "Data source (wayback,commoncrawl,otx,urlscan)"
    required: false
    flag: "--providers"
    format: "flag"
  - name: "include_subs"
    type: "bool"
    description: "Include subdomains"
    required: false
    flag: "--subs"
    format: "flag"
    default: true
  - name: "additional_args"
    type: "string"
    description: |
      Extra Gau arguments. Used to pass Gau options not defined in the parameter list.

      **Example value:**
      - "--o output.txt": Output to a file
      - "--threads 4": Number of threads
      - "--blacklist ttf,woff,svg,png": Blacklist extensions

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
