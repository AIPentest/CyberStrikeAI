name: "foremost"
command: "foremost"
enabled: true
short_description: "File carving tool"
description: |
  Foremost is a file carving tool based on file headers and trailers.

  **Main features:**
  - File recovery
  - Support for many file types
  - Disk image analysis
  - Data recovery

  **Use cases:**
  - Data recovery
  - Forensic analysis
  - File extraction
  - Disk analysis
parameters:
  - name: "input_file"
    type: "string"
    description: "Input file or device"
    required: true
    flag: "-i"
    format: "flag"
  - name: "output_dir"
    type: "string"
    description: "Output directory"
    required: false
    flag: "-o"
    format: "flag"
    default: "/tmp/foremost_output"
  - name: "file_types"
    type: "string"
    description: "File types to recover (jpg, gif, png, etc.)"
    required: false
    flag: "-t"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra foremost arguments. Used to pass foremost options not defined in the parameter list.

      **Example values:**
      - Add common parameter examples according to the tool's characteristics

      **Notes:**
      - Multiple arguments are separated by spaces
      - Make sure arguments are correctly formatted to avoid command injection
      - This argument is appended directly to the end of the command
    required: false
    format: "positional"
