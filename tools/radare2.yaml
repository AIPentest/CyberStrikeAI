name: "radare2"
command: "r2"
enabled: true
short_description: "a binary-analysis and reverse-engineering framework supporting disassembly, debugging, and scripted analysis"
description: |
  Radare2 is a complete binary-analysis and reverse-engineering framework supporting many architectures and file formats.

  **Key features:**
  - Disassembly and decompilation: supports many architectures (x86, ARM, MIPS, etc.)
  - Debugging support: local and remote debugging
  - Scripting support: supports r2pipe scripts and r2 command scripts
  - Many file formats: ELF, PE, Mach-O, firmware, etc.
  - Interactive analysis: command-line interface and visual mode
  - Automated analysis: batch analysis and scripted analysis

  **Use cases:**
  - Binary-file analysis
  - Reverse engineering and vulnerability research
  - Malware analysis
  - CTF Reverse-engineering challenges in competitions
  - Firmware analysis
  - Exploit development

  **Notes:**
  - You can use the -c parameter to run a command and then exit (non-interactive mode)
  - You can use the -i parameter to run a script file
  - You can use the -q parameter for silent mode (hides startup info)
  - You can use the -A parameter to automatically analyze the binary
  - You can use the -d parameter to attach to a process for debugging
parameters:
  - name: "target"
    type: "string"
    description: |
      Target file, process ID, or a special value.

      **Format:**
      - File path: "/path/to/binary"
      - process ID: "1234" (requires the -d parameter)
      - Special values: "-" (read from stdin), "--" (interactive mode), "=" (read from an environment variable)

      **Example value:**
      - Binary file: "/tmp/vulnerable"
      - process debugging: "1234" (with -d)
      - fromstdin: "-"

      **Notes:**
      - Required parameter; cannot be empty
      - If a process ID is specified, it must be used together with the -d parameter
      - Note: radare2 requires the file path to be the last argument, so target uses position 1
    required: true
    position: 1
    format: "positional"
  - name: "commands"
    type: "string"
    description: |
      Radare2 command(s) to run. Can be a single command or multiple commands (separated by semicolons).

      **Format:**
      - single command: "aaa" (auto-analyze)
      - Multiple commands: "aaa; pdf @main; VV" (Analyze, disassemble the main function, and visualize)

      **Common commands:**
      - "aaa": Automatically analyze all functions
      - "afl": List all functions
      - "pdf @main": Disassemble the main function
      - "px 64": Display 64 bytes in hexadecimal
      - "VV": Enter visual mode
      - "i": Show file information
      - "iz": Show strings

      **Example value:**
      - "aaa" (Automatic analysis)
      - "aaa; pdf @main" (Analyze and disassemble the main function)
      - "i; iz" (Show information and strings)

      **Notes:**
      - Separate multiple commands with a semicolon (;)
      - The program exits after running the commands (non-interactive mode)
    required: false
    flag: "-c"
    format: "flag"
  - name: "script_file"
    type: "string"
    description: |
      Path to the script file to run. The script file contains Radare2 commands, one per line.

      **Format:**
      - Script file path: "/path/to/script.r2"

      **Example value:**
      - "/tmp/analyze.r2"
      - "./scripts/auto_analyze.r2"

      **Notes:**
      - The commands in the script file run in order
      - The program exits after the script finishes
    required: false
    flag: "-i"
    format: "flag"
  - name: "arch"
    type: "string"
    description: |
      Specify the target architecture.

      **Common architectures:**
      - "x86": 32 bitx86
      - "x86_64": 64 bitx86
      - "arm": ARM Architecture
      - "arm64": ARM64 Architecture
      - "mips": MIPS Architecture
      - "ppc": PowerPC Architecture

      **Example value:**
      - "x86"
      - "x86_64"
      - "arm"
      - "arm64"

      **Notes:**
      - If not specified, radare2 will try to auto-detect it
      - Some architectures may require additional configuration
    required: false
    flag: "-a"
    format: "flag"
  - name: "bits"
    type: "int"
    description: |
      Specify the target bitness (16, 32, 64).

      **Example value:**
      - 16 (16 bit)
      - 32 (32 bit)
      - 64 (64 bit)

      **Notes:**
      - Usually used together with the -a parameter
      - If not specified, radare2 will try to auto-detect it
    required: false
    flag: "-b"
    format: "flag"
  - name: "auto_analyze"
    type: "bool"
    description: |
      Automatically analyze the binary. Equivalent to running the "aaa" command.

      **Use cases:**
      - Quickly analyze a binary file
      - Batch analysis

      **Notes:**
      - When enabled, automatically analyzes all functions
      - May take a while
    required: false
    flag: "-A"
    format: "flag"
    default: false
  - name: "debug"
    type: "bool"
    description: |
      Debug mode. Can attach to a process or debug a file.

      **Use cases:**
      - Attach to a running process
      - Debug a binary file

      **Notes:**
      - Requires appropriate privileges
      - If target is a process ID, this option must be enabled
    required: false
    flag: "-d"
    format: "flag"
    default: false
  - name: "quiet"
    type: "bool"
    description: |
      Silent mode. Hides startup info and the prompt.

      **Use cases:**
      - Scripted use
      - Batch analysis
      - Automated tool invocation

      **Notes:**
      - Suitable for non-interactive use
      - Reduce output noise
    required: false
    flag: "-q"
    format: "flag"
    default: false
  - name: "seek"
    type: "string"
    description: |
      Set the start address. Can be a hexadecimal address or an expression.

      **Format:**
      - Hexadecimal: "0x400000"
      - Expression: "main+0x10"

      **Example value:**
      - "0x400000"
      - "main"
      - "0x1000"

      **Notes:**
      - The address can be hexadecimal or a symbol name
      - Used to start analysis from a specific location
    required: false
    flag: "-s"
    format: "flag"
  - name: "base_address"
    type: "string"
    description: |
      Set the base address. Used for the load address .

      **Format:**
      - Hexadecimal address: "0x400000"

      **Example value:**
      - "0x400000"
      - "0x1000000"

      **Notes:**
      - Used to specify the binary's load address
      - Usually used to analyze firmware or memory dumps
    required: false
    flag: "-B"
    format: "flag"
  - name: "eval"
    type: "string"
    description: |
      Set a configuration variable. Format: key=value.

      **Format:**
      - "key=value"
      - Separate multiple variables with spaces: "asm.arch=x86 asm.bits=32"

      **Example value:**
      - "asm.arch=x86"
      - "asm.bits=32"
      - "scr.color=false"

      **Notes:**
      - Used to set radare2 configuration variables
      - Separate multiple variables with spaces
    required: false
    flag: "-e"
    format: "flag"
  - name: "project"
    type: "string"
    description: |
      Load or save the project file.

      **Format:**
      - Project-file path: "/path/to/project.r2"

      **Example value:**
      - "./project.r2"
      - "/tmp/analysis.r2"

      **Notes:**
      - The project file stores the analysis state and configuration
      - Can be used to restore a previous analysis
    required: false
    flag: "-p"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra radare2 arguments. Used to pass radare2 options not defined in the parameter list.

      **Available options:**
      - "-C": Force colored output
      - "-f": Force-open the file (even if the format does not match)
      - "-L": List the supported plugins
      - "-M": Enable write mode
      - "-n": Do not load the configuration file
      - "-N": Do not run the script
      - "-S": Start in debug mode
      - "-t": Use threaded mode
      - "-u": Use the unicorn engine
      - "-v": Show version information
      - "-w": Write mode
      - "-z": Scan strings
      - "-X": Run an r2pipe script
      - "-P patch": Apply patches
      - "-m maddr": Mapping address

      **Example value:**
      - "-w" (Write mode)
      - "-n" (Do not load the configuration file)
      - "-M" (Enable write mode)
      - "-z" (Scan strings)

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
