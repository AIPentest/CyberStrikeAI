name: "hydra"
command: "hydra"
args: ["-I"]
enabled: true
short_description: "a password brute-forcing tool supporting many protocols and services"
description: |
  Hydra is a network login-credential brute-forcing tool supporting many protocols such as SSH, FTP, HTTP, and SMB.

  **Calling convention (required reading):**
  - You must provide a **username**: at least one of `username` (-l) or `username_file` (-L)
  - You must provide a **credential**: at least one of `password` (-p), `password_file` (-P), or `-C` (via `additional_args`)
  - **Do a trial run with a small wordlist first** (tens to hundreds of entries), confirm the target is reachable, then scale up; do not use huge wordlists such as rockyou by default
  - Enabled by default: stop on first find (-f), parallelism 4 (-t), ignore restore (-I); for long tasks, set `output_file`

  **CLI Order:** `hydra [options] <target> <service>` (this tool already arranges arguments in this order; do not put target before the options)

  **Use cases:** weak-credential detection and password-strength assessment in authorized environments

  **Note:** For authorized targets only; for unresponsive targets, reduce `wait_time` or shrink the wordlist to avoid long hangs.
parameters:
  - name: "username"
    type: "string"
    description: "A single username (-l); provide at least one of this or username_file"
    required: false
    flag: "-l"
    format: "flag"
  - name: "username_file"
    type: "string"
    description: "Username-wordlist file (-L)"
    required: false
    flag: "-L"
    format: "flag"
  - name: "password"
    type: "string"
    description: "A single password (-p)"
    required: false
    flag: "-p"
    format: "flag"
  - name: "password_file"
    type: "string"
    description: "Password wordlist file (-P); prefer a small wordlist for a trial run"
    required: false
    flag: "-P"
    format: "flag"
  - name: "stop_on_first"
    type: "bool"
    description: "Exit immediately after finding one valid credential pair (-f, default true)"
    required: false
    flag: "-f"
    format: "flag"
    default: true
  - name: "tasks"
    type: "int"
    description: "Parallel connections per target (-t); 4 is recommended for SSH, etc.; default 4"
    required: false
    flag: "-t"
    format: "flag"
    default: 4
  - name: "wait_time"
    type: "int"
    description: "Seconds to wait for a response per connection (-w), default 16 (lower than Hydra's default 32, to reduce hangs)"
    required: false
    flag: "-w"
    format: "flag"
    default: 16
  - name: "wait_between"
    type: "int"
    description: "Seconds between connections per thread (-W), default 1"
    required: false
    flag: "-W"
    format: "flag"
    default: 1
  - name: "output_file"
    type: "string"
    description: "Write the results to a file (-o); recommended for long tasks"
    required: false
    flag: "-o"
    format: "flag"
  - name: "target"
    type: "string"
    description: "Target IP, hostname, or CIDR (must come after the options)"
    required: true
    position: 1
    format: "positional"
  - name: "service"
    type: "string"
    description: "Service type (ssh, ftp, http-get, http-post-form, smb, etc.; see hydra -h)"
    required: true
    position: 2
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: "Extra arguments (such as -s port, -S SSL, -m module options, -C login:pass file), appended to the end of the command"
    required: false
    format: "positional"
