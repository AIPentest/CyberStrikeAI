name: "hydra"
command: "hydra"
args: ["-I"]
enabled: true
short_description: "Password brute-forcing tool supporting multiple protocols and services"
description: |
  Hydra is a network login password brute-forcing tool that supports SSH, FTP, HTTP, SMB, and many other protocols.

  **Calling conventions (must read):**
  - You must provide a **username**: `username` (-l) or `username_file` (-L), at least one of them
  - You must provide a **password**: `password` (-p), `password_file` (-P), or `-C` (via `additional_args`), at least one of them
  - **Do a test run with a small dictionary first** (tens to hundreds of entries), confirm the target is reachable before scaling up; using giant dictionaries such as rockyou by default is prohibited
  - Enabled by default: stop on first hit (-f), 4 parallel tasks (-t), ignore restore (-I); for long tasks please set `output_file`

  **CLI order:** `hydra [options] <target> <service>` (this tool assembles arguments in that order; do not put target before the options)

  **Use cases:** weak-password detection and password strength assessment in authorized environments

  **Note:** Only use against authorized targets; for unresponsive targets reduce `wait_time` or shrink the dictionary to avoid prolonged hangs.
parameters:
  - name: "username"
    type: "string"
    description: "A single username (-l); fill in at least one of this or username_file"
    required: false
    flag: "-l"
    format: "flag"
  - name: "username_file"
    type: "string"
    description: "Username dictionary file (-L)"
    required: false
    flag: "-L"
    format: "flag"
  - name: "password"
    type: "string"
    description: "A single password (-p)"
    required: false
    flag: "-p"
    format: "flag"
  - name: "password_file"
    type: "string"
    description: "Password dictionary file (-P); prefer a small dictionary for test runs"
    required: false
    flag: "-P"
    format: "flag"
  - name: "stop_on_first"
    type: "bool"
    description: "Exit immediately after finding a valid credential pair (-f, default true)"
    required: false
    flag: "-f"
    format: "flag"
    default: true
  - name: "tasks"
    type: "int"
    description: "Parallel connections per target (-t); 4 is recommended for SSH etc., default 4"
    required: false
    flag: "-t"
    format: "flag"
    default: 4
  - name: "wait_time"
    type: "int"
    description: "Seconds to wait for a response per connection (-w), default 16 (below Hydra's default of 32, reducing perceived hangs)"
    required: false
    flag: "-w"
    format: "flag"
    default: 16
  - name: "wait_between"
    type: "int"
    description: "Seconds between connections per thread (-W), default 1"
    required: false
    flag: "-W"
    format: "flag"
    default: 1
  - name: "output_file"
    type: "string"
    description: "Write results to a file (-o); recommended to set for long tasks"
    required: false
    flag: "-o"
    format: "flag"
  - name: "target"
    type: "string"
    description: "Target IP, hostname, or CIDR (must come after the options)"
    required: true
    position: 1
    format: "positional"
  - name: "service"
    type: "string"
    description: "Service type (ssh, ftp, http-get, http-post-form, smb, etc.; see hydra -h)"
    required: true
    position: 2
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: "Additional arguments (e.g. -s port, -S SSL, -m module options, -C login:pass file), appended to the end of the command"
    required: false
    format: "positional"
