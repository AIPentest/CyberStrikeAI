name: "arjun"
command: "arjun"
enabled: true
short_description: "HTTP a parameter-discovery tool"
description: |
  Arjun is an HTTP parameter-discovery tool for finding hidden parameters in web applications.

  **Key features:**
  - HTTP Parameter discovery
  - Multiple HTTP methods supported
  - Multithreading support
  - Stable mode

  **Use cases:**
  - Parameter discovery
  - Web Application security testing
  - Bug bounty Reconnaissance
  - Security testing
parameters:
  - name: "url"
    type: "string"
    description: "TargetURL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "method"
    type: "string"
    description: "HTTP Method (GET, POST, etc.)"
    required: false
    flag: "-m"
    format: "flag"
    default: "GET"
  - name: "wordlist"
    type: "string"
    description: "Custom wordlist file"
    required: false
    flag: "-w"
    format: "flag"
  - name: "threads"
    type: "int"
    description: "Number of threads"
    required: false
    flag: "-t"
    format: "flag"
    default: 25
  - name: "stable"
    type: "bool"
    description: "Use stable mode"
    required: false
    flag: "--stable"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: |
      Extra Arjun arguments. Used to pass Arjun options not defined in the parameter list.

      **Example value:**
      - "-o output.txt": Output to a file
      - "-q": Quiet mode
      - "-i": Read from a fileURL

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
