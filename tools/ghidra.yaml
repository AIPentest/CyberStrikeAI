name: "ghidra"
command: "analyzeHeadless"
enabled: true
short_description: "An advanced binary-analysis and reverse-engineering tool"
description: |
  Ghidra is a free binary-analysis and reverse-engineering tool developed by the NSA.

  **Key features:**
  - Disassembly and decompilation
  - Advanced analysis
  - Scripting support
  - Collaboration features

  **Use cases:**
  - Binary analysis
  - Reverse engineering
  - Malware analysis
  - Vulnerability research
parameters:
  - name: "project_dir"
    type: "string"
    description: "Ghidra Project storage directory"
    required: false
    default: "/tmp/ghidra_projects"
    position: 0
    format: "positional"
  - name: "project_name"
    type: "string"
    description: "Ghidra Project name"
    required: false
    default: "cyberstrike_analysis"
    position: 1
    format: "positional"
  - name: "binary"
    type: "string"
    description: "Path to the binary file to analyze"
    required: true
    flag: "-import"
    format: "flag"
  - name: "script_file"
    type: "string"
    description: "Optional Ghidra script file (run via -postScript)"
    required: false
    flag: "-postScript"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra ghidra arguments. Used to pass ghidra options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
