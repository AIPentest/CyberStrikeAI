name: "ghidra"
command: "analyzeHeadless"
enabled: true
short_description: "Advanced binary analysis and reverse engineering tool"
description: |
  Ghidra is a free binary analysis and reverse engineering tool developed by the NSA.

  **Main features:**
  - Disassembly and decompilation
  - Advanced analysis
  - Scripting support
  - Collaboration features

  **Use cases:**
  - Binary analysis
  - Reverse engineering
  - Malware analysis
  - Vulnerability research
parameters:
  - name: "project_dir"
    type: "string"
    description: "Directory where Ghidra projects are stored"
    required: false
    default: "/tmp/ghidra_projects"
    position: 0
    format: "positional"
  - name: "project_name"
    type: "string"
    description: "Ghidra project name"
    required: false
    default: "cyberstrike_analysis"
    position: 1
    format: "positional"
  - name: "binary"
    type: "string"
    description: "Path of the binary file to analyze"
    required: true
    flag: "-import"
    format: "flag"
  - name: "script_file"
    type: "string"
    description: "Optional Ghidra script file (executed via -postScript)"
    required: false
    flag: "-postScript"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional ghidra arguments. Used to pass ghidra options that are not defined in the parameter list.

      **Example values:**
      - Add common parameter examples based on tool characteristics

      **Notes:**
      - Multiple arguments are separated by spaces
      - Ensure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
