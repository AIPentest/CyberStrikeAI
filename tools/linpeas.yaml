name: "linpeas"
command: "linpeas.sh"
enabled: true
short_description: "Linux a privilege-escalation enumeration script that automatically detects common privesc paths"
description: |
  LinPEAS (Linux Privilege Escalation Awesome Script) is an automated privilege-escalation enumeration script for detecting common privesc paths on Linux systems.

  **Key features:**
  - System information gathering
  - Privilege and group checks
  - Writable-file and -directory detection
  - SUID/SGID File discovery
  - Environment-variable checks
  - Scheduled-task analysis
  - Network-configuration checks
  - Sensitive-file discovery

  **Use cases:**
  - Privilege escalation in penetration testing
  - Security auditing
  - Post-exploitation testing
  - CTF Competition

  **Notes:**
  - Requires the linpeas.sh script to already be downloaded on the target system
  - Execution may take a while
  - The output is large; it is recommended to save it to a file
parameters:
  - name: "output"
    type: "string"
    description: "Output file path (optional)"
    required: false
    flag: "-o"
    format: "flag"
  - name: "fast"
    type: "bool"
    description: "Fast mode, skips time-consuming checks"
    required: false
    flag: "-fast"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra linpeas arguments. Used to pass linpeas options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
