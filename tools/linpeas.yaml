name: "linpeas"
command: "linpeas.sh"
enabled: true
short_description: "Linux privilege escalation enumeration script that automatically detects common privesc paths"
description: |
  LinPEAS (Linux Privilege Escalation Awesome Script) is an automated privilege escalation enumeration script used to detect common privesc paths on Linux systems.

  **Main features:**
  - System information gathering
  - Permissions and group checks
  - Writable file and directory detection
  - SUID/SGID file discovery
  - Environment variable checks
  - Scheduled task analysis
  - Network configuration checks
  - Sensitive file discovery

  **Use cases:**
  - Privilege escalation during penetration testing
  - Security audit
  - Post-exploitation testing
  - CTF competitions

  **Notes:**
  - Requires the linpeas.sh script to already be downloaded on the target system
  - Execution time may be long
  - Output is large; saving it to a file is recommended
parameters:
  - name: "output"
    type: "string"
    description: "Output file path (optional)"
    required: false
    flag: "-o"
    format: "flag"
  - name: "fast"
    type: "bool"
    description: "Fast mode, skips time-consuming checks"
    required: false
    flag: "-fast"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Additional linpeas arguments. Used to pass linpeas options not defined in the parameter list.

      **Example values:**
      - Add common parameter examples according to the tool's characteristics

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
