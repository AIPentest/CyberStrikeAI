name: "checksec"
command: "checksec"
enabled: true
short_description: "Binary security feature checking tool"
description: |
  Checksec is a tool for checking the security features of binary files.

  **Main features:**
  - Security feature checking
  - Protection mechanism detection
  - Multiple architecture support
  - Detailed reports

  **Use cases:**
  - Binary security analysis
  - Protection mechanism checking
  - Vulnerability research
  - Security assessment
parameters:
  - name: "binary"
    type: "string"
    description: "Path of the binary file to check"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
      Additional checksec arguments. Used to pass checksec options not defined in the parameter list.

      **Example values:**
      - Add common parameter examples according to tool characteristics

      **Notes:**
      - Separate multiple arguments with spaces
      - Ensure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
