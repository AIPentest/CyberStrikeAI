name: "checksec"
command: "checksec"
enabled: true
short_description: "a binary security-feature checking tool"
description: |
  Checksec is a tool for checking the security features of binary files.

  **Key features:**
  - Security-feature checking
  - Protection-mechanism detection
  - Multiple-architecture support
  - Detailed report

  **Use cases:**
  - Binary security analysis
  - Protection-mechanism checking
  - Vulnerability research
  - Security assessment
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file to check"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
      Extra checksec arguments. Used to pass checksec options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
