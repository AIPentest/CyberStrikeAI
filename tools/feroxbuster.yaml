name: "feroxbuster"
command: "feroxbuster"
enabled: false
short_description: "a recursive content-discovery tool"
description: |
  Feroxbuster is a fast, simple recursive content-discovery tool.

  **Key features:**
  - Recursive directory discovery
  - Multithreading support
  - Automatic filtering
  - Multiple output formats

  **Use cases:**
  - Web Content discovery
  - Directory enumeration
  - File discovery
  - Security testing
parameters:
  - name: "url"
    type: "string"
    description: "TargetURL"
    required: true
    flag: "-u"
    format: "flag"
  - name: "wordlist"
    type: "string"
    description: "Wordlist file path"
    required: false
    flag: "-w"
    format: "flag"
  - name: "threads"
    type: "int"
    description: "Number of threads"
    required: false
    flag: "-t"
    format: "flag"
    default: 10
  - name: "additional_args"
    type: "string"
    description: |
      Extra feroxbuster arguments. Used to pass feroxbuster options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
