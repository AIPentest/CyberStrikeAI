name: "ropgadget"
command: "ROPgadget"
enabled: true
short_description: "ROP gadget search tool"
description: |
  ROPgadget is a tool for searching for ROP gadgets in binary files.

  **Main features:**
  - ROP gadget search
  - Support for multiple architectures
  - Gadget classification
  - Exploit chain generation

  **Use cases:**
  - Binary analysis
  - Exploit development
  - ROP chain construction
  - Security research
parameters:
  - name: "binary"
    type: "string"
    description: "Binary file path to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
      Additional ropgadget arguments. Used to pass ropgadget options not defined in the parameter list.

      **Example values:**
      - Add common parameter examples according to the tool's characteristics

      **Notes:**
      - Multiple arguments are separated by spaces
      - Ensure the argument format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
