name: "ropgadget"
command: "ROPgadget"
enabled: true
short_description: "ROP gadget a search tool"
description: |
  ROPgadget is a tool for searching ROP gadgets in binary files.

  **Key features:**
  - ROP gadget Search
  - Multiple-architecture support
  - Gadget Category
  - Exploit-chain generation

  **Use cases:**
  - Binary analysis
  - Exploit development
  - ROP Chain building
  - Security research
parameters:
  - name: "binary"
    type: "string"
    description: "Path to the binary file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "additional_args"
    type: "string"
    description: |
      Extra ropgadget arguments. Used to pass ropgadget options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
