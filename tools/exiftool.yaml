name: "exiftool"
command: "exiftool"
enabled: true
short_description: "Metadata extraction tool"
description: |
  ExifTool reads, writes, and edits metadata in a wide variety of file formats.

  **Main features:**
  - Metadata extraction
  - Support for many file formats
  - Metadata editing
  - Batch processing

  **Use cases:**
  - Forensic analysis
  - Metadata inspection
  - Privacy protection
  - File analysis
parameters:
  - name: "file_path"
    type: "string"
    description: "Path to the file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "output_json"
    type: "bool"
    description: "Output in JSON format (equivalent to -json)"
    required: false
    flag: "-json"
    format: "flag"
    default: false
  - name: "output_xml"
    type: "bool"
    description: "Output in XML format (equivalent to -X)"
    required: false
    flag: "-X"
    format: "flag"
    default: false
  - name: "output_csv"
    type: "bool"
    description: "Output in CSV format (equivalent to -csv)"
    required: false
    flag: "-csv"
    format: "flag"
    default: false
  - name: "tags"
    type: "string"
    description: "Specific tags to extract"
    required: false
    format: "template"
    template: "-{value}"
  - name: "additional_args"
    type: "string"
    description: |
      Extra exiftool arguments. Used to pass exiftool options not defined in the parameter list.

      **Example values:**
      - Add common parameter examples according to the tool's characteristics

      **Notes:**
      - Multiple arguments are separated by spaces
      - Make sure arguments are correctly formatted to avoid command injection
      - This argument is appended directly to the end of the command
    required: false
    format: "positional"
