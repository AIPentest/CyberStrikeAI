name: "waybackurls"
command: "waybackurls"
enabled: true
short_description: "Retrieves historical data from the Wayback Machine URL"
description: |
  Waybackurls Retrieves the target domain's historical URL.

  **Key features:**
  - Historical URL discovery
  - Version retrieval
  - Subdomain support

  **Use cases:**
  - Historical URL collection
  - Bug bounty Reconnaissance
  - Security testing
  - Content discovery
parameters:
  - name: "domain"
    type: "string"
    description: "Target domain"
    required: true
    position: 0
    format: "positional"
  - name: "get_versions"
    type: "bool"
    description: "Retrieve all versions of URL"
    required: false
    flag: "-get-versions"
    format: "flag"
    default: false
  - name: "no_subs"
    type: "bool"
    description: "Does not include subdomains"
    required: false
    flag: "-no-subs"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: |
      Extra waybackurls arguments. Used to pass waybackurls options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
