name: "binwalk"
command: "binwalk"
enabled: true
short_description: "a firmware and file-analysis tool"
description: |
  Binwalk is a firmware-analysis tool for analyzing, extracting, and reverse-engineering firmware images.

  **Key features:**
  - File-signature identification
  - File extraction
  - Entropy analysis
  - Firmware analysis

  **Use cases:**
  - Firmware analysis
  - File-format identification
  - Data extraction
  - Reverse engineering
parameters:
  - name: "file_path"
    type: "string"
    description: "Path to the file to analyze"
    required: true
    position: 0
    format: "positional"
  - name: "extract"
    type: "bool"
    description: "Extract the discovered files"
    required: false
    flag: "-e"
    format: "flag"
    default: false
  - name: "additional_args"
    type: "string"
    description: |
      Extra binwalk arguments. Used to pass binwalk options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
