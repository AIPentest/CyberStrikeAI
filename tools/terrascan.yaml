name: "terrascan"
command: "terrascan"
enabled: true
short_description: "An infrastructure-as-code security scanning tool"
description: |
  Terrascan is an infrastructure-as-code security scanning tool for detecting security issues in IaC configurations.

  **Key features:**
  - IaC Security scanning
  - Multiple frameworks supported
  - Policy checking
  - Compliance verification

  **Use cases:**
  - IaC Security scanning
  - Cloud configuration auditing
  - Security-policy checks
  - Compliance checking
parameters:
  - name: "scan_type"
    type: "string"
    description: "Scan type (all, terraform, k8s, etc.)"
    required: false
    flag: "--scan-type"
    format: "flag"
    default: "all"
  - name: "iac_dir"
    type: "string"
    description: "IaC Directory"
    required: false
    flag: "-d"
    format: "flag"
    default: "."
  - name: "policy_type"
    type: "string"
    description: "The policy type to use"
    required: false
    flag: "--policy-type"
    format: "flag"
  - name: "output_format"
    type: "string"
    description: "Output format (json, yaml, xml)"
    required: false
    flag: "--output"
    format: "flag"
    default: "json"
  - name: "severity"
    type: "string"
    description: "Severity filtering (high, medium, low)"
    required: false
    flag: "--severity"
    format: "flag"
  - name: "additional_args"
    type: "string"
    description: |
      Extra terrascan arguments. Used to pass terrascan options not defined in the parameter list.

      **Example value:**
      - Add common parameter examples based on the tool's characteristics

      **Notes:**
      - Separate multiple parameters with spaces
      - Ensure the parameter format is correct to avoid command injection
      - This parameter is appended directly to the end of the command
    required: false
    format: "positional"
