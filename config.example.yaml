# ============================================
# CyberStrikeAI 配置文件
# ============================================
# 本配置文件支持通过 Web 界面进行可视化配置
# 点击右上角"设置"按钮即可修改配置
# ============================================

# ============================================
# 系统设置
# ============================================

# 前端显示的版本号（可选，不填则显示默认版本）
version: "v1.7.18"
# 服务器配置
server:
  host: 0.0.0.0 # 监听地址，0.0.0.0 表示监听所有网络接口
  port: 8080 # 服务端口；未启用 TLS 时为 http://localhost:8080
  # 其他可信 Web 集成的精确 Origin。Chromium 浏览器插件会自动识别，无需配置；不要使用通配符。
  # cors_allowed_origins:
  #   - https://trusted-integration.example
  # --- 可选：HTTPS + HTTP/2（缓解浏览器对同源 HTTP/1.1 的并发连接数限制，多路 Deep 流式更稳）---
  # 启用 TLS 的条件（满足其一即可）：tls_enabled: true，或 tls_auto_self_sign: true，或同时配置了 tls_cert_path + tls_key_path。
  # 启用后请用 https://127.0.0.1:<本端口>/ 访问；若仍用 http:// 访问同端口，将自动 308 跳转到 HTTPS（可用 tls_http_redirect: false 关闭）。
  tls_enabled: true
  # 启用 HTTPS 时，明文 HTTP 是否自动跳转到 HTTPS（默认 true；同端口嗅探 TLS/HTTP 后分流）
  # tls_http_redirect: true
  # 方式 A（推荐生产）：PEM 证书与私钥路径
  # tls_cert_path: /path/to/fullchain.pem
  # tls_key_path: /path/to/privkey.pem
  # 方式 B（仅本地/测试）：无证书文件时内存自签（浏览器会提示不受信任；SAN 含 localhost / 127.0.0.1）
  tls_auto_self_sign: true
# 认证配置
auth:
  session_duration_hours: 12 # 登录有效期（小时），超时后需重新登录
# 日志配置
log:
  level: info # 日志级别: debug(调试), info(信息), warn(警告), error(错误)
  output: stdout # 日志输出位置: stdout(标准输出), stderr(标准错误), 或文件路径
  diagnostic_dir: log # 额外保存 warn 及以上诊断日志，按本地日期拆分；相对于进程工作目录
  diagnostic_retention_days: 14 # 保留天数（含当天）；省略或 <= 0 使用 14 天
  diagnostic_disabled: false # true 关闭额外诊断日志；修改后需重启
# 平台操作审计（系统设置 -> 日志审计；不记录对话正文与每次工具调用）
audit:
  enabled: true
  retention_days: 15 # 0 表示不自动清理
  max_detail_bytes: 8192
  auth_failure_cooldown_seconds: 60 # 同一 IP 登录/改密失败审计最短间隔（秒）；未配置时默认 60；-1 关闭节流
# MCP 状态监控执行记录保留（tool_executions 表）
monitor:
  retention_days: 90 # 省略时默认 90；0 表示不自动清理
# ============================================
# 对话相关配置
# ============================================

# AI 通道配置（支持保存多个 OpenAI 兼容 / Claude 通道）
# default_channel 指定新对话与未显式选择通道的任务使用哪个通道。
# 每个 channels.<id> 必填：api_key, base_url, model。
# 支持的 API 服务商：
#   - OpenAI: https://api.openai.com/v1
#   - DeepSeek: https://api.deepseek.com/v1
#   - OrcaRouter: https://api.orcarouter.ai/v1（OpenAI 兼容网关，模型名如 orcarouter/auto）
#   - 其他兼容 OpenAI 协议的 API
# 常用模型: gpt-4, gpt-3.5-turbo, deepseek-chat, claude-3-opus, orcarouter/auto 等
# provider: 可选值 openai_compatible(默认) | claude(Eino 原生 Anthropic Messages API) | orcarouter(OpenAI 兼容网关)
ai:
  default_channel: qwen-max
  channels:
    orcarouter:
      name: OrcaRouter
      provider: orcarouter
      base_url: https://api.orcarouter.ai/v1
      api_key: sk-orca-xxxxxxx
      model: orcarouter/auto
      max_total_tokens: 120000
      max_completion_tokens: 32768
    qwen-max:
      name: Qwen Max
      provider: openai_compatible
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: sk-xxxxxxx
      model: qwen3-max
      max_total_tokens: 120000
      max_completion_tokens: 32768
      # Eino 路径模型推理：DeepSeek/OpenAI 为 thinking / reasoning_effort；Claude 4.6+ 为 adaptive + output_config.effort（仅显式配置 effort 时下发）；3.7 为 enabled+budget_tokens:10000（文档示例），effort 不映射，自定义预算用 extra_request_fields
      reasoning:
        mode: on # auto | on | off；off：OpenAI/Claude 不附加推理字段，DeepSeek 发送 thinking.type=disabled（其默认开启思考）
        effort: high # low | medium | high | max | xhigh（最高档：OpenAI 常用 xhigh，部分网关用 max，原样下发）；空表示不指定
        allow_client_reasoning: true # false 时忽略对话请求体 reasoning，仅以下方为准
        profile: openai_compat # auto | deepseek_compat | openai_compat | output_config_effort
        # extra_request_fields: {} # 可选：管理员自定义根级 JSON 片段（高级）
    # qwen-plus:
    #   name: Qwen Plus Fallback
    #   provider: openai_compatible
    #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    #   api_key: sk-xxxxxxx
    #   model: qwen-plus
    #   max_total_tokens: 120000
    #   max_completion_tokens: 32768
# 视觉分析（analyze_image MCP 工具；图片仅在单次 VL 调用中出现，Agent 上下文只保留文字摘要）
vision:
  enabled: false # true 且 model 非空时注册 analyze_image
  model: qwen-vl # VL 模型名（enabled 时必填）
  api_key: "" # 留空则复用默认 AI 通道 api_key
  base_url: "" # 留空则复用默认 AI 通道 base_url
  provider: # 留空则复用默认 AI 通道 provider（openai_compatible | claude）
  max_image_bytes: 5242880 # 原始文件上限（字节），默认 5MB
  max_dimension: 2048 # 长边缩放像素
  jpeg_quality: 82
  max_payload_bytes: 524288 # 编码后送 VL API 上限，默认 512KB
  skip_preprocess_below_bytes: 2097152 # 低于 2MB 且长边<=max_dimension 且<=max_payload 时原图直传；0=始终压缩
  detail: auto # low | high | auto（Eino ImageURLDetail）
  timeout_seconds: 60
# ============================================
# 资产管理（网络空间测绘搜索）配置（可选）
# ============================================
# 用于「资产管理 → 信息收集」页面调用 FOFA / ZoomEye / Quake / Shodan API
# 后端代理请求，避免前端暴露 key；环境变量优先级更高
fofa:
  base_url: https://fofa.info/api/v1/search/all # 可选，留空则使用默认
  api_key: "" # FOFA API Key（可选，建议在系统设置中填写）
zoomeye:
  base_url: https://api.zoomeye.ai/v2/search # 可选，留空则使用默认
  api_key: "" # ZoomEye API Key；也可通过 ZOOMEYE_API_KEY 环境变量配置
quake:
  base_url: https://quake.360.net/api/v3/search/quake_service # 可选，留空则使用默认
  api_key: "" # Quake API Token；也可通过 QUAKE_API_KEY 环境变量配置
shodan:
  base_url: https://api.shodan.io # 可选，留空则使用默认
  api_key: "" # Shodan API Key；也可通过 SHODAN_API_KEY 环境变量配置
# Agent 配置
# 达到最大迭代次数时，AI 会自动总结测试结果
agent:
  max_iterations: 12000 # 全局最大迭代次数（单代理 / Deep / Supervisor / Plan-Execute 主执行器 / 子代理均沿用；agents/*.md 中 max_iterations>0 可单独覆盖）
  tool_timeout_minutes: 60 # 单次工具执行最大时长（分钟），超时自动终止；0 表示不限制（不推荐，易出现长时间挂起）
  tool_wait_timeout_seconds: 300 # 工具本轮最多等待（秒）；到时返回 execution_id，worker 继续后台执行，可用 wait_tool_execution 继续等待；0=等到完成
  external_mcp_max_concurrent_per_server: 5 # 单个外部 MCP server 同时运行的工具数；0=默认2；负数=不限制
  external_mcp_max_concurrent_total: 16 # 所有外部 MCP 工具全局并发上限；0=默认16；负数=不限制
  external_mcp_circuit_failure_threshold: 15 # 单个外部 MCP server 连续失败多少次后熔断；0=默认3；负数=关闭熔断
  external_mcp_circuit_cooldown_seconds: 60 # 熔断冷却秒数；0=默认60
  shell_no_output_timeout_seconds: 1200 # execute/exec 连续无新输出则终止（秒）；通用防挂死；0=默认300；-1=关闭
  workspace_root_dir: "" # 会话工作目录根路径（curl/wget 下载、read_file/glob/grep 本地分析）；空=tmp/workspace，其下按 projects/{id} 或 conversations/{id} 隔离；勿用系统 /tmp
  # system_prompt_path: prompts/single-agent.md # 可选：单代理系统提示文件（相对本配置文件所在目录）；非空且可读时替换内置提示

  system_prompt_path: ""
# 调用拦截：在「安全防护 → 调用拦截」编辑并保存后立即生效；与 HITL 审批白名单独立。
# 旧配置省略 tool_guard 时也默认启用政府域名保护。手动修改 YAML 后需重启。
tool_guard:
  enabled: true
  rules:
    - id: government-domains
      name: 政府网站保护
      enabled: true
      # Go/RE2 正则；命名捕获组 match 用于提醒中的 {match}。
      pattern: '(?i)(?:^|[^\p{L}\p{M}\p{N}_.-])(?P<match>(?:(?:[\p{L}\p{M}\p{N}_*-]+\.)+gov(?:\.[\p{L}\p{M}\p{N}_*-]+)*|gov(?:\.[\p{L}\p{M}\p{N}_*-]+)+|\.gov(?:\.[\p{L}\p{M}\p{N}_*-]+)*)\.?)(?:$|[^\p{L}\p{M}\p{N}_.-])'
      # 支持 {match}、{tool}、{rule}；留空使用通用提醒。
      message: '识别到 {match}，禁止攻击政府网站。请检查目标与授权范围，并更换为已获授权的非政府目标。'

# 人机协同（HITL）全局白名单：此处列出的工具始终免审批，与对话页「白名单工具（免审批，逗号分隔）」合并为并集；侧栏「应用」可合并写入本列表并立即生效。
# 非白名单工具在审批方=审计 Agent 时，按会话 HITL 模式选用提示词：
#   approval → audit_agent_prompt
#   review_edit → audit_agent_prompt_review_edit（可改参后放行）
hitl:
  # 全局默认人机协同模式：off=关闭，approval=审批模式，review_edit=审查编辑；新建会话无独立配置时沿用
  default_mode: off
  # 全局默认审批方：human=人工审批，audit_agent=审计 Agent；新建会话无独立配置时沿用
  default_reviewer: human
  # 全局默认审批等待时限（秒）：300=5分钟，0=不限时；新建会话无独立配置时沿用
  default_timeout_seconds: 300
  # 审计 Agent 专用模型；字段留空则复用上方 openai 配置。建议 model 填小模型，用于降低审批成本。
  audit_model:
    provider: "" # openai / claude；留空跟随 openai.provider
    base_url: "" # 留空跟随 openai.base_url
    api_key: "" # 留空跟随 openai.api_key
    model: "" # 留空跟随 openai.model，例如可填 gpt-4o-mini / qwen-turbo / deepseek-chat
  # 已决策审计日志保留天数（与 MCP 监控一致；省略默认 90；0 表示不自动清理）
  retention_days: 90
  # 按你环境里的真实工具名增删（与侧栏一致、小写不敏感）；不需要全局免审批可改为 []
  tool_whitelist: [read_file, ls, list_dir, glob, grep, tool_search, upsert_project_fact, get_project_fact, list_project_facts, search_project_facts, list_vulnerabilities, get_vulnerability, get_asset, query_assets, list_knowledge_risk_types, get_tool_execution, wait_tool_execution, batch_task_list, batch_task_get, manage_webshell_list, c2_event, c2_file]
  # audit_agent_prompt: |  # 审批模式；留空使用内置默认，可在「人机协同」页编辑
  # audit_agent_prompt_review_edit: |  # 审查编辑模式；留空使用内置默认

  audit_agent_prompt: |-
    你是 CyberStrikeAI 人机协同审计 Agent。审查 Agent 即将执行的工具调用是否会对系统造成实质性损害。

    你会收到 JSON，包含 hitlMode、toolName、arguments/argumentsObj、userMessage、thinking、reasoningChain、planning 等字段。

    规则优先级：
    - 必须 reject 的规则
    - 必须 approve 的规则
    - 默认放行规则

    规则匹配要求：
    - 如果同时命中 reject 和 approve，必须 reject。
    - 每次裁决必须给出一个规则编号，不得输出“命中规则：无”。
    - 未命中明确 reject 或 approve 规则，但未发现明确破坏行为时，命中 D1：默认放行。
    - 不得仅凭“本地执行”“设置超时”“文件名包含 test”判断脚本无害；必须检查实际 command、代码或请求参数。
    - 如果脚本具体内容不可见，应表述为“当前参数未显示明确高危操作”，不能断言“无持久化影响”。

    裁决基调（默认放行）：
    - 绝大多数渗透测试操作（包括各类攻击 payload）都应放行
    - 在裁决之前需要判断出：1、此请求的是干什么（理解请求内容）？2、此请求造成什么后果？
    - 仅在「明确会直接破坏目标业务系统正常运行，或造成真实用户数据丢失/不可逆篡改」时 → reject
    - 信息不足、参数略宽泛、仅为探测意图时 → approve
    - 拿不准时 → approve（宁可放过可恢复的测试，不要误拦合法攻击）

    必须 reject 的高危情形（示例，非穷举）：
    - 修改/重置任意用户或管理员密码、强制下线真实用户
    - 修改服务器或服务配置（系统配置、Web/数据库参数、防火墙、启动项、计划任务）
    - 修改/创建/删除用户、角色、权限（账户体系篡改）
    - 删除或大规模破坏数据/文件（DROP/TRUNCATE/DELETE 全表、rm 重要文件、清空数据库）
    - 停止、禁用、重启业务服务（systemctl stop、kill 关键进程、shutdown、reboot）
    - 大规模压测或高并发造成 DoS

    以下情形必须 approve（即使看起来“攻击性强”或包含写操作）：
    - 各类漏洞探测与利用 payload（SQL 注入含读写型、命令注入、反序列化、文件包含、路径遍历、SSRF、SSTI、XXE 等）
    - 文件上传测试，包括上传 webshell、写入 webshell 文件
    - 命令执行探测、反弹 Shell、dnslog / 数据外带探测
    - 数据库命令执行、写文件、写计划任务、内存马注入等 getshell 利用
    - 常规速率的口令爆破（非 DoS 级）
    - 信息收集、端口/目录扫描、枚举、抓取
    - 读取、查询、探测类操作（含敏感文件）
    - 攻陷后无害侦察命令（whoami/id/uname/ls/cat 等）
    - 参数宽泛但无明确破坏意图的请求

    判定原则：
    - “写”本身不是拦截理由——渗透测试大量依赖写操作（注入、上传、爆破、getshell）
    - 关键看是否破坏「业务可用性 / 关键数据完整性」
    - 只有明确命中上方 reject 清单才 reject

    仅输出一行 JSON，不要 markdown 代码块：
    {"decision":"approve"|"reject","comment":"实际操作：...；成功后的后果：...；命中规则：..."}
  audit_agent_prompt_review_edit: |-
    你是 CyberStrikeAI 人机协同审计 Agent。审查 Agent 即将执行的工具调用是否会对系统造成实质性损害。

