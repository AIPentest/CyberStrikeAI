# ============================================
# CyberStrikeAI configuration file
# ============================================
# This configuration file supports visual configuration through the Web UI
# Click the "Settings" button in the top-right corner to modify the configuration
# ============================================

# ============================================
# System settings
# ============================================

# Version number shown in the frontend (optional; if empty, the default version is shown). After a one-click update,
# the value of this file in the new code is used to sync your config.yaml's version field (the header version badge and static-asset cache follow the code).
version: "v1.7.24"
# Server configuration
server:
  host: 0.0.0.0 # Listen address; 0.0.0.0 means listen on all network interfaces
  port: 8080 # Service port; when TLS is not enabled, http://localhost:8080
  # Exact Origins for other trusted Web integrations. The Chromium browser extension is recognized automatically and needs no configuration; do not use wildcards.
  # cors_allowed_origins:
  #   - https://trusted-integration.example
  # --- Optional: HTTPS + HTTP/2 (mitigates browsers' per-origin HTTP/1.1 concurrent-connection limit; multiplexed Deep streaming is more stable) ---
  # Conditions to enable TLS (any one suffices): tls_enabled: true, or tls_auto_self_sign: true, or both tls_cert_path + tls_key_path are configured.
  # Once enabled, access via https://127.0.0.1:<this port>/; if you still use http:// on the same port, it will auto-308-redirect to HTTPS (disable with tls_http_redirect: false).
  tls_enabled: true
  # When HTTPS is enabled, whether plaintext HTTP auto-redirects to HTTPS (default true; sniffs TLS/HTTP on the same port and routes accordingly)
  # tls_http_redirect: true
  # Option A (recommended for production): PEM certificate and private key paths
  # tls_cert_path: /path/to/fullchain.pem
  # tls_key_path: /path/to/privkey.pem
  # Option B (local/testing only): in-memory self-signing when no certificate files are present (browsers will warn it is untrusted; SAN includes localhost / 127.0.0.1)
  tls_auto_self_sign: true
# Authentication configuration
auth:
  session_duration_hours: 12 # Login validity (hours); re-login is required after expiry
# Logging configuration
log:
  level: info # Log level: debug, info, warn, error
  output: stdout # Log output location: stdout (standard output), stderr (standard error), or a file path
  diagnostic_dir: log # Additionally save warn-and-above diagnostic logs, split by local date; relative to the process working directory
  diagnostic_retention_days: 14 # Retention days (including the current day); omit or <= 0 uses 14 days
  diagnostic_disabled: false # true disables the extra diagnostic logs; a restart is required after changing
# Platform operation audit (System Settings -> Log Audit; does not record conversation bodies or every tool call)
audit:
  enabled: true
  retention_days: 15 # 0 means no automatic cleanup
  max_detail_bytes: 8192
  auth_failure_cooldown_seconds: 60 # Minimum interval (seconds) for auditing login/password-change failures from the same IP; defaults to 60 when unset; -1 disables throttling
# MCP status-monitoring execution-record retention (tool_executions table)
monitor:
  retention_days: 90 # Defaults to 90 when omitted; 0 means no automatic cleanup
# Runtime-workspace garbage cleanup (System Settings -> Storage Cleanup)
# Covers the retention policy for disk artifacts such as Agent workspaces, tool output caches, C2 artifacts, and conversation uploads.
# auto_clean is off by default: existing data is not deleted without the administrator's knowledge after an upgrade;
# even when off, you can still preview and run cleanup manually on the "Storage Cleanup" page.
storage:
  auto_clean: false # true enables background scheduled cleanup
  interval_minutes: 60 # Background cleanup interval (minutes); minimum 5
  orphan_grace_days: 1 # When a session/project is deleted but its directory remains, how many idle days before it is reclaimed
  active_grace_hours: 24 # Sessions with recent activity are always skipped, to avoid deleting data of running tasks by mistake
  # Per-category retention_days: when omitted, the default below is used; 0 means no retention-based cleanup (orphan directories are still reclaimed)
  categories:
    workspace: # Agent workspace tmp/workspace; default 30 days
      enabled: true
      retention_days: 30
    reduction: # Over-long tool output persisted to disk tmp/reduction; default 7 days (purely derived data)
      enabled: true
      retention_days: 7
    conversation_artifacts: # Summaries and over-long input ledger data/conversation_artifacts; default 30 days
      enabled: true
      retention_days: 30
    plantask: # Multi-agent plan board skills/.eino/plantask; default 30 days (purely derived data)
      enabled: true
      retention_days: 30
    c2_artifacts: # C2 callback screenshots/uploads/delivered files/payloads tmp/c2; default 30 days
      enabled: true # Note: after a payload is cleaned up, its download link becomes invalid
      retention_days: 30
    chat_uploads: # Conversation upload attachments chat_uploads; default 90 days
      enabled: true
      retention_days: 90
    workflow_checkpoints: # Workflow checkpoints data/workflow-checkpoints; default 7 days
      enabled: true
      retention_days: 7
    diagnostic_logs: # Diagnostic logs log/diagnostic-*.log; default 14 days
      enabled: true # Takes effect independently of log.diagnostic_retention_days; whichever comes first wins
      retention_days: 14
# ============================================
# Conversation-related configuration
# ============================================

# AI channel configuration (supports saving multiple OpenAI-compatible / Claude channels)
# default_channel specifies which channel new conversations and tasks that do not explicitly select a channel use.
# Each channels.<id> requires: api_key, base_url, model.
# Supported API providers:
#   - OpenAI: https://api.openai.com/v1
#   - DeepSeek: https://api.deepseek.com/v1
#   - Other APIs compatible with the OpenAI protocol
# Common models: gpt-4, gpt-3.5-turbo, deepseek-chat, claude-3-opus, etc.
# provider: possible values openai_compatible (default) | claude (Eino native Anthropic Messages API)
ai:
  default_channel: qwen-max
  channels:
    qwen-max:
      name: Qwen Max
      provider: openai_compatible
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: sk-xxxxxxx
      model: qwen3-max
      max_total_tokens: 120000
      max_completion_tokens: 32768
      # headers: optional. Append or override HTTP request headers sent to the model gateway; values support ${ENV_VAR} and ${ENV_VAR:-default}.
      # Used for compatibility with third-party OpenAI-compatible providers that require private auth headers, version headers, or org headers (such as aggregation gateways like opencode).
      # Once configured, they override the built-in headers of the same name (Authorization, User-Agent, etc.); empty-valued items are ignored.
      # headers:
      #   X-Api-Key: ${OPENCODE_API_KEY}
      #   x-opencode-session: "%session_id%" # Automatically replaced with the current conversation ID
      #   X-Client-Name: cyberstrike-ai
      #   HTTP-Referer: https://example.com
      # When custom headers are configured, only same-origin redirects are allowed; redirects across host, port, or protocol are rejected.
      # The HITL audit inherits the primary channel's headers only when provider/base_url/api_key are not explicitly configured;
      # if the independent audit identity needs request headers, configure them separately in hitl.audit_model.headers.
      # Empty headers are equivalent to not configured; all custom header values are masked as sensitive in the settings API.
      # Eino-path model reasoning: DeepSeek/OpenAI use thinking / reasoning_effort; Claude 4.6+ uses adaptive + output_config.effort (sent only when effort is explicitly configured); 3.7 uses enabled+budget_tokens:10000 (documentation example), effort is not mapped, use extra_request_fields for a custom budget
      reasoning:
        mode: on # auto | on | off; off: OpenAI/Claude do not attach reasoning fields, DeepSeek sends thinking.type=disabled (which has thinking on by default)
        effort: high # low | medium | high | max | xhigh (highest tier: OpenAI commonly uses xhigh, some gateways use max, sent as-is); empty means unspecified
        allow_client_reasoning: true # when false, the conversation request body's reasoning is ignored and only the settings below apply
        profile: openai_compat # auto | deepseek_compat | openai_compat | output_config_effort
        # extra_request_fields: {} # optional: administrator-custom root-level JSON fragment (advanced)
    # qwen-plus:
    #   name: Qwen Plus Fallback
    #   provider: openai_compatible
    #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    #   api_key: sk-xxxxxxx
    #   model: qwen-plus
    #   max_total_tokens: 120000
    #   max_completion_tokens: 32768
# Vision analysis (analyze_image MCP tool; images appear only in a single VL call, the Agent context retains only the text summary)
vision:
  enabled: false # registers analyze_image when true and model is non-empty
  model: qwen-vl # VL model name (required when enabled)
  api_key: "" # leave empty to reuse the default AI channel's api_key
  base_url: "" # leave empty to reuse the default AI channel's base_url
  provider: # leave empty to reuse the default AI channel's provider (openai_compatible | claude)
  max_image_bytes: 5242880 # raw file limit (bytes), default 5MB
  max_dimension: 2048 # long-edge scaling pixels
  jpeg_quality: 82
  max_payload_bytes: 524288 # limit for the encoded payload sent to the VL API, default 512KB
  skip_preprocess_below_bytes: 2097152 # send the original image directly when below 2MB and long edge <= max_dimension and <= max_payload; 0 = always compress
  detail: auto # low | high | auto (Eino ImageURLDetail)
  timeout_seconds: 60
# ============================================
# Asset management (cyberspace mapping search) configuration (optional)
# ============================================
# Used by the "Asset Management -> Information Gathering" page to call the FOFA / ZoomEye / Quake / Shodan APIs
# The backend proxies the requests to avoid exposing keys in the frontend; environment variables take higher priority
fofa:
  base_url: https://fofa.info/api/v1/search/all # optional; leave empty to use the default
  api_key: "" # FOFA API Key (optional; recommended to fill it in System Settings)
zoomeye:
  base_url: https://api.zoomeye.ai/v2/search # optional; leave empty to use the default
  api_key: "" # ZoomEye API Key; can also be configured via the ZOOMEYE_API_KEY environment variable
quake:
  base_url: https://quake.360.net/api/v3/search/quake_service # optional; leave empty to use the default
  api_key: "" # Quake API Token; can also be configured via the QUAKE_API_KEY environment variable
shodan:
  base_url: https://api.shodan.io # optional; leave empty to use the default
  api_key: "" # Shodan API Key; can also be configured via the SHODAN_API_KEY environment variable
# Agent configuration
# When the maximum number of iterations is reached, the AI will automatically summarize the test results
agent:
  # After changing, restart the service; takes effect for new tasks; e.g., 1440 = 24 hours, the per-call tool timeout applies independently.
  task_timeout_minutes: 600 # Task execution timeout (minutes); unset=600, 0=no limit, negative=invalid; resume restarts the timer
  max_iterations: 12000 # Global maximum iterations (shared by single agent / Deep / Supervisor / Plan-Execute main executor / sub-agents; max_iterations>0 in agents/*.md can override individually)
  tool_timeout_minutes: 60 # Maximum duration of a single tool execution (minutes); auto-terminated on timeout; 0 means no limit (not recommended, prone to long hangs)
  tool_wait_timeout_seconds: 300 # Maximum wait for a tool this round (seconds); on timeout it returns an execution_id, the worker keeps running in the background, and you can keep waiting with wait_tool_execution; 0=wait until completion
  external_mcp_max_concurrent_per_server: 5 # Number of tools running concurrently on a single external MCP server; 0=default 2; negative=no limit
  external_mcp_max_concurrent_total: 16 # Global concurrency limit for all external MCP tools; 0=default 16; negative=no limit
  external_mcp_circuit_failure_threshold: 15 # How many consecutive failures on a single external MCP server before the circuit breaks; 0=default 3; negative=disable the circuit breaker
  external_mcp_circuit_cooldown_seconds: 60 # Circuit-breaker cooldown seconds; 0=default 60
  shell_no_output_timeout_seconds: 1200 # Terminate execute/exec when there is no new output for this long (seconds); a general anti-hang guard; 0=default 300; -1=disable
  workspace_root_dir: "" # Root path of the session working directory (curl/wget downloads, read_file/glob/grep local analysis); empty=tmp/workspace, isolated under it by projects/{id} or conversations/{id}; do not use the system /tmp
  # system_prompt_path: prompts/single-agent.md # optional: single-agent system prompt file (relative to this config file's directory); replaces the built-in prompt when non-empty and readable

  system_prompt_path: ""
# Call blocking: takes effect immediately after editing and saving under "Security -> Call Blocking"; independent of the HITL approval whitelist.
# Government-domain protection is also enabled by default when an older config omits tool_guard. A restart is required after manually editing the YAML.
tool_guard:
  enabled: true
  rules:
    - id: government-domains
      name: Government website protection
      enabled: true
      # Go/RE2 regex; the named capture group "match" is used for {match} in the reminder.
      pattern: '(?i)(?:^|[^\p{L}\p{M}\p{N}_.-])(?P<match>(?:(?:[\p{L}\p{M}\p{N}_*-]+\.)+gov(?:\.[\p{L}\p{M}\p{N}_*-]+)*|gov(?:\.[\p{L}\p{M}\p{N}_*-]+)+|\.gov(?:\.[\p{L}\p{M}\p{N}_*-]+)*)\.?)(?:$|[^\p{L}\p{M}\p{N}_.-])'
      # Supports {match}, {tool}, {rule}; leave empty to use the generic reminder.
      message: 'Detected {match}; attacking government websites is prohibited. Please check the target and authorization scope, and switch to an authorized non-government target.'

# Human-in-the-loop (HITL) global whitelist: tools listed here are always exempt from approval, and are merged (union) with the conversation page's "Whitelisted tools (approval-exempt, comma-separated)"; the sidebar "Apply" can merge-write into this list and take effect immediately.
# For non-whitelisted tools when the reviewer = audit Agent, the prompt is chosen by the session's HITL mode:
#   approval → audit_agent_prompt
#   review_edit → audit_agent_prompt_review_edit (parameters can be edited before allowing)
hitl:
  # Global default human-in-the-loop mode: off=disabled, approval=approval mode, review_edit=review-and-edit; inherited by new sessions without their own config
  default_mode: off
  # Global default reviewer: human=manual approval, audit_agent=audit Agent; inherited by new sessions without their own config
  default_reviewer: human
  # Global default approval wait timeout (seconds): 300=5 minutes, 0=no limit; inherited by new sessions without their own config
  default_timeout_seconds: 300
  # Choose one of two audit Agent backends: openai=compatible-protocol chat model (prompt JSON); typesafe=TypeSafe Jev structured allow/block.
  audit_backend: openai
  # Dedicated model for the audit Agent. For the openai backend, leaving fields empty reuses the primary model; for the typesafe backend, api_key is required and does not inherit the primary model's key.
  audit_model:
    provider: "" # openai / claude; effective only for the openai backend; leave empty to follow openai.provider
    base_url: "" # openai backend: leave empty to follow the primary model; typesafe backend: leave empty to use https://api.typesafe.ai
    api_key: "" # openai backend: leave empty to follow the primary model; typesafe backend: fill in the TypeSafe API Key
    model: "" # openai backend: a small model is recommended; typesafe backend: leave empty to use jev-latest
    reasoning:
      profile: "" # auto / deepseek_compat / openai_compat; only controls the thinking field of audit requests
  # Retention days for decided audit logs (same as MCP monitoring; defaults to 90 when omitted; 0 means no automatic cleanup)
  retention_days: 90
  # Add/remove according to the real tool names in your environment (consistent with the sidebar, case-insensitive); set to [] if you do not need any global approval exemption
  tool_whitelist: [read_file, ls, list_dir, glob, grep, tool_search, upsert_project_fact, get_project_fact, list_project_facts, search_project_facts, list_vulnerabilities, get_vulnerability, get_asset, query_assets, list_knowledge_risk_types, get_tool_execution, wait_tool_execution, batch_task_list, batch_task_get, manage_webshell_list, c2_event, c2_file]
  # audit_agent_prompt: |  # approval mode; leave empty to use the built-in default, editable on the "Human-in-the-loop" page. openai backend: used as a chat prompt; typesafe backend: used as the Jev organization policy
  # audit_agent_prompt_review_edit: |  # review-and-edit mode; leave empty to use the built-in default

  audit_agent_prompt: |-
    You are the CyberStrikeAI human-in-the-loop audit Agent. Review whether the tool call the Agent is about to execute would cause substantial harm to the system.

    You will receive JSON containing fields such as hitlMode, toolName, arguments/argumentsObj, userMessage, thinking, reasoningChain, planning.

    Rule priority:
    - Rules that must reject
    - Rules that must approve
    - Default-allow rule

    Rule-matching requirements:
    - If both reject and approve match, you must reject.
    - Every decision must cite a rule number; you must not output "Matched rule: none".
    - When no explicit reject or approve rule matches but no clear destructive behavior is found, match D1: default allow.
    - Do not judge a script harmless based only on "runs locally", "has a timeout", or "filename contains test"; you must inspect the actual command, code, or request parameters.
    - If the script's specific contents are not visible, state "the current parameters do not show a clearly high-risk operation" rather than asserting "no persistent impact".

    Decision tone (default allow):
    - The vast majority of penetration-testing operations (including all kinds of attack payloads) should be allowed
    - Before deciding, you must determine: 1. What is this request doing (understand the request content)? 2. What consequences does this request cause?
    - Only reject when it "will clearly and directly disrupt the normal operation of the target business system, or cause real user data loss / irreversible tampering" → reject
    - When information is insufficient, parameters are somewhat broad, or the intent is merely probing → approve
    - When unsure → approve (better to let a recoverable test through than to wrongly block a legitimate attack)

    High-risk cases that must be rejected (examples, not exhaustive):
    - Modifying/resetting any user or administrator password, forcibly logging out real users
    - Modifying server or service configuration (system config, Web/database parameters, firewall, startup items, scheduled tasks)
    - Modifying/creating/deleting users, roles, permissions (account-system tampering)
    - Deleting or massively destroying data/files (DROP/TRUNCATE/DELETE whole tables, rm important files, wiping the database)
    - Stopping, disabling, or restarting business services (systemctl stop, kill critical processes, shutdown, reboot)
    - Large-scale stress testing or high concurrency causing DoS

    The following cases must be approved (even if they look "highly offensive" or contain write operations):
    - All kinds of vulnerability probing and exploitation payloads (SQL injection including read/write type, command injection, deserialization, file inclusion, path traversal, SSRF, SSTI, XXE, etc.)
    - File upload testing, including uploading a webshell and writing a webshell file
    - Command execution probing, reverse shell, dnslog / data exfiltration probing
    - Database command execution, file writing, writing scheduled tasks, memory-shell injection, and other getshell exploitation
    - Normal-rate password brute-forcing (not DoS level)
    - Information gathering, port/directory scanning, enumeration, crawling
    - Read, query, and probe operations (including sensitive files)
    - Harmless reconnaissance commands after compromise (whoami/id/uname/ls/cat, etc.)
    - Requests with broad parameters but no clear destructive intent

    Decision principles:
    - "Writing" itself is not a reason to block—penetration testing relies heavily on write operations (injection, upload, brute-force, getshell)
    - The key is whether it damages "business availability / critical data integrity"
    - Only reject when it clearly matches the reject list above

    Output only a single line of JSON, no markdown code block:
    {"decision":"approve"|"reject","comment":"Actual operation: ...; consequence on success: ...; matched rule: ..."}
  audit_agent_prompt_review_edit: |-
    You are the CyberStrikeAI human-in-the-loop audit Agent. Review whether the tool call the Agent is about to execute would cause substantial harm to the system.

    You will receive JSON containing fields such as hitlMode, toolName, arguments/argumentsObj, userMessage, thinking, reasoningChain, planning.

    Rule priority:
    - Rules that must reject
    - Rules that must approve
    - Default-allow rule

    Rule-matching requirements:
    - If both reject and approve match, you must reject.
    - Every decision must cite a rule number; you must not output "Matched rule: none".
    - When no explicit reject or approve rule matches but no clear destructive behavior is found, match D1: default allow.
    - Do not judge a script harmless based only on "runs locally", "has a timeout", or "filename contains test"; you must inspect the actual command, code, or request parameters.
    - If the script's specific contents are not visible, state "the current parameters do not show a clearly high-risk operation" rather than asserting "no persistent impact".

    Decision tone (default allow):
    - The vast majority of penetration-testing operations (including all kinds of attack payloads) should be allowed
    - Before deciding, you must determine: 1. What is this request doing (understand the request content)? 2. What consequences does this request cause?
    - Only reject when it "will clearly and directly disrupt the normal operation of the target business system, or cause real user data loss / irreversible tampering" → reject
    - When information is insufficient, parameters are somewhat broad, or the intent is merely probing → approve
    - When unsure → approve (better to let a recoverable test through than to wrongly block a legitimate attack)

    High-risk cases that must be rejected (examples, not exhaustive):
    - Modifying/resetting any user or administrator password, forcibly logging out real users
    - Modifying server or service configuration (system config, Web/database parameters, firewall, startup items, scheduled tasks)
    - Modifying/creating/deleting users, roles, permissions (account-system tampering)
    - Deleting or massively destroying data/files (DROP/TRUNCATE/DELETE whole tables, rm important files, wiping the database)
    - Stopping, disabling, or restarting business services (systemctl stop, kill critical processes, shutdown, reboot)
    - Large-scale stress testing or high concurrency causing DoS

    The following cases must be approved (even if they look "highly offensive" or contain write operations):
    - All kinds of vulnerability probing and exploitation payloads (SQL injection including read/write type, command injection, deserialization, file inclusion, path traversal, SSRF, SSTI, XXE, etc.)
    - File upload testing, including uploading a webshell and writing a webshell file
    - Command execution probing, reverse shell, dnslog / data exfiltration probing
    - Database command execution, file writing, writing scheduled tasks, memory-shell injection, and other getshell exploitation
    - Normal-rate password brute-forcing (not DoS level)
    - Information gathering, port/directory scanning, enumeration, crawling
    - Read, query, and probe operations (including sensitive files)
    - Harmless reconnaissance commands after compromise (whoami/id/uname/ls/cat, etc.)
    - Requests with broad parameters but no clear destructive intent

    Decision principles:
    - "Writing" itself is not a reason to block—penetration testing relies heavily on write operations (injection, upload, brute-force, getshell)
    - The key is whether it damages "business availability / critical data integrity"
    - Only reject when it clearly matches the reject list above

    Output only a single line of JSON, no markdown code block:
    {"decision":"approve"|"reject","comment":"Actual operation: ...; consequence on success: ...; matched rule: ...","editedArguments":{...}}

    editedArguments rules (fill in only when approving and parameter changes are needed; otherwise omit this field):
    - Provide the complete replacement tool-parameter object, with key names identical to argumentsObj
    - Make only the minimal necessary changes to narrow the scope and eliminate risk (e.g., restrict path, remove dangerous flags)
    - Do not expand the attack surface: do not broaden the target scope, escalate privileges, or introduce destructive parameters
    - When parameters cannot be safely edited and the above high-risk cases exist, reject; do not force an approve
# Multi-agent and Eino single agent (CloudWeGo Eino ADK; single-agent entry /api/eino-agent*, multi-agent /api/multi-agent*)
# Dependencies are pulled via go.mod; if downloads fail, you can set: go env -w GOPROXY=https://goproxy.cn,direct
# Deep / Plan-Execute / Supervisor are specified by the mode selected on the conversation page and WebShell in the request body's orchestration; robots follow robot_default_agent_mode
multi_agent:
  enabled: true
  robot_default_agent_mode: eino_single # WeCom/DingTalk/Lark robot default: eino_single | deep | plan_execute | supervisor
  batch_use_multi_agent: false # when true, each subtask in the "Batch Tasks" queue also goes through the Eino multi-agent (higher cost)
  # plan_execute only: upper limit of the outer execute↔replan loop; 0 means the Eino default of 10. For main/sub-agent ReAct rounds, see agent.max_iterations.
  plan_execute_loop_max_iterations: 0
  sub_agent_user_context_max_runes: 0 # inject the user's original text into the sub-agent task description; 0=no truncation (default), >0=total character limit, negative=disabled
  without_general_sub_agent: false # when false, keep Deep's built-in general-purpose sub-agent
  without_write_todos: false
  orchestrator_instruction: "" # Deep main agent: the body of agents/orchestrator.md (or a single .md with kind: orchestrator) takes priority; this value is used when the body is empty; if both are empty, the Eino default is used
  orchestrator_instruction_plan_execute: "" # plan_execute main agent: the body of agents/orchestrator-plan-execute.md takes priority; this value is used when the body is empty; if both are empty, the built-in plan_execute prompt is used (Deep's orchestrator_instruction is not used)
  orchestrator_instruction_supervisor: "" # supervisor main agent: the body of agents/orchestrator-supervisor.md takes priority; this value is used when the body is empty; if both are empty, the built-in supervisor prompt is used (transfer/exit instructions are still appended by the runtime; Deep's orchestrator_instruction is not used)
  # Eino official Skills: progressive disclosure + optional local file/Shell (eino-ext local backend). See skills_dir for the Skills directory.
  eino_skills:
    disable: false # true: do not register the skill progressive-disclosure middleware, and do not mount local FS/Shell tools; false: load according to the switches below
    filesystem_tools: true # true: register read_file/glob/grep/write/edit/execute (use with care in authorized environments); false: skills only, do not expose local read/write and Shell
    skill_tool_name: skill # the name of the "load skill" tool callable on the model side; generally keep it as skill; it just needs to match the call name in the skill-package documentation
  # Eino ADK middleware and Deep/Supervisor/plan_execute Executor tuning (struct: internal/config/config.go → MultiAgentEinoMiddlewareConfig)
  # plan_execute: the patch/reduction/tool_search/plantask settings below also apply to the Executor (via ExecPreMiddlewares); Planner/Replanner do not mount MCP pre-middleware.
  eino_middleware:
    patch_tool_calls: true # true: patch dangling tool_calls in history that have no tool_result (more stable after stream interruption/retry); false: disabled; when the field is omitted, the default is equivalent to true
    tool_search_enable: true # true: enable tool_search when the number of tools is ≥ min, keeping only the first N tools resident and unlocking the rest on demand by regex, saving tokens and reducing mis-selection; false: all tools enter the context
    tool_search_min_tools: 20 # tool_search is enabled only when this count is reached (avoids pointlessness when there are very few tools); used together with always_visible
    tool_search_always_visible: 12 # number of tools always exposed directly to the model (order matches the role's tool list); the rest enter the dynamic pool and need tool_search to unlock
    tool_search_always_visible_tools: [read_file, glob, grep, analyze_image, write_file, edit_file, execute, task, transfer_to_agent, exit, write_todos, skill, tool_search, TaskCreate, TaskGet, TaskUpdate, TaskList, record_vulnerability, list_vulnerabilities, get_vulnerability, get_tool_execution, wait_tool_execution, cancel_tool_execution, list_knowledge_risk_types, search_knowledge_base, webshell_exec, webshell_file_list, webshell_file_read, webshell_file_write, manage_webshell_list, manage_webshell_add, manage_webshell_update, manage_webshell_delete, manage_webshell_test, batch_task_list, batch_task_get, batch_task_start, batch_task_rerun, batch_task_pause, batch_task_update_metadata, batch_task_update_schedule, batch_task_schedule_enabled, batch_task_update_task, batch_task_remove_task, batch_task_delete, batch_task_create, batch_task_add_task, http-framework-test, exec] # backend built-in resident-tool whitelist (takes priority over the always_visible count policy)
    plantask_enable: true # P0: the main agent mounts the TaskCreate/Get/Update/List structured task board; requires eino_skills to be available and skills_dir to exist
    plantask_rel_dir: .eino/plantask # task files relative to skills_dir, in per-session subdirectories: skills/.eino/plantask/<conversationId>/
    reduction_enable: true # true: large tool output is truncated and persisted to a local file (tmp/reduction/.../trunc/<id>), the context keeps only a <persisted-output> preview; does not depend on eino_skills
    reduction_max_length_for_trunc: 100000 # when a single tool result exceeds this byte count: the full text is written to a local trunc file and a truncated preview with the path is returned (MCP/exec and reduction share this threshold)
    reduction_max_tokens_for_clear: 60000 # historical tool-result cleanup threshold (tokens); should be lower than max_total_tokens * summarization_trigger_ratio
    reduction_root_dir: "" # non-empty: root path where truncated/cleaned content is persisted; empty: tmp/reduction under the project directory (isolated by session/project)
    reduction_clear_exclude: [] # extra list of tool names excluded from the "cleanup stage" (merged with built-in exclusions such as task/transfer/exit); fill in as a YAML list when needed
    reduction_sub_agents: true # true: sub-agents also mount reduction; false: only the orchestrating main agent uses reduction
    summarization_trigger_ratio: 0.8 # summarization trigger ratio (max_total_tokens * ratio); 0.75~0.85 is recommended
    summarization_output_reserve_tokens: 40960 # tokens reserved for the summary model's output; the summary input budget = trigger threshold - this value
    summarization_emit_internal_events: true # true: emit summarization internal events (for easier diagnostics)
    summarization_user_intent_ledger_max_runes: 96000 # total character limit of the "original user input and constraints ledger" injected into the model context after compression; the raw DB messages are not trimmed
    summarization_user_intent_ledger_entry_max_runes: 16000 # character limit of a single user message in the ledger; exceeding it trims only the model-visible ledger, not the DB original
    latest_user_message_max_runes: 48000 # character limit for the latest user message of this round entering the model context; when exceeded, the full text is persisted to disk and only head/tail previews are injected
    latest_user_message_head_runes: 24000 # number of head preview characters for an over-long user message this round
    latest_user_message_tail_runes: 24000 # number of tail preview characters for an over-long user message this round
    plan_execute_user_input_budget_ratio: 0.35 # userInput budget ratio in plan_execute (shared by planner/replanner/executor)
    plan_execute_executed_steps_budget_ratio: 0.2 # executed_steps budget ratio in plan_execute
    plan_execute_max_step_result_runes: 4000 # maximum characters per step result in plan_execute (truncated when exceeded)
    plan_execute_keep_last_steps: 8 # plan_execute keeps only the bodies of the most recent N steps; earlier steps are collapsed to titles
    checkpoint_dir: "" # the chat path no longer uses ADK checkpoints; cross-round model state uniformly uses conversations.last_react_*, making stale context easier to troubleshoot
    model_retry_max_retries: 0 # Eino native ChatModel retry; 408/409/425/429/5xx/network jitter/empty streaming output are retried; 0=default 4 (permanent 4xx are not retried)
    model_retry_max_backoff_sec: 0 # upper bound in seconds for a single backoff of the Eino native ChatModel retry; 0=default 30
    model_failover_channels: [] # Eino native ChatModel failover; fill in ai.channels IDs, e.g. [qwen-plus]; switched in order after retries are exhausted
    model_failover_max_retries: 0 # maximum attempts for backup channels; 0=try all model_failover_channels
    empty_response_continue_max_attempts: 0 # number of Handler backoff continuations when a Run succeeds but no assistant body is captured (including stream interruption); 0=default 5
    deep_output_key: final_answer # P0: the Eino session writes the final assistant conclusion (framework-internal; Deep/Supervisor main/eino_single)
    task_tool_description_prefix: "" # non-empty: only Deep's task tool uses this custom description prefix, with the sub-agent name concatenated at runtime; empty follows Eino's default generation logic
  # Eino callbacks + OpenTelemetry: framework-level spans (aligned with Zap); by default eino_trace_* is not pushed to the end-user UI (see sse_trace_to_client)
  eino_callbacks:
    enabled: true
    # log_only=Zap+OTel only (recommended default) | sse/full=enable streaming callback copy, close, etc. (full includes stream hooks)
    mode: log_only
    sse_trace_to_client: false # true: when mode is sse/full, push eino_trace_* to the frontend timeline (for troubleshooting/intranet demos)
    max_input_summary_runes: 400
    max_output_summary_runes: 400
    zap_verbose: false # true: Debug includes input/output summaries
    otel:
      enabled: true
      service_name: cyberstrike-ai
      exporter: stdout # none | stdout (development/local) | otlphttp (production connecting to a Collector)
      otlp_endpoint: localhost:4318 # used with otlphttp, host:port, fixed path /v1/traces
      sample_ratio: 1.0 # 0~1, ParentBased+TraceIDRatio
# Database configuration
database:
  path: data/conversations.db # SQLite database file path, used to store conversation history and messages
  knowledge_db_path: data/knowledge.db # Knowledge base database file path (optional; if empty, the session database is used), used to store knowledge items and vector embeddings; can be copied and reused independently
# ============================================
# Task-management related configuration
# ============================================
# (The configuration items are already included in the conversation-related configuration)

# ============================================
# Vulnerability-management related configuration
# ============================================

# Security tool configuration
# The system loads all .yaml tool configuration files from this directory
# Recommended approach: create a separate configuration file for each tool under the tools/ directory
security:
  # auto: native Job Object on Windows; Unix watchdog unless cgroup_root is set.
  # Linux production: configure a systemd service with Delegate=cpu memory pids; set
  # mode: required, cgroup_root: auto. Explicit isolation errors fail closed.
  process_isolation:
    mode: auto
    cgroup_root: ""
    max_processes: 256
    memory_max_bytes: 2147483648
    cpu_quota_micros: 0 # 0=no CPU cap; 100000=one core (100 ms period)
  tools_dir: tools # Tool configuration file directory (relative to this config file's directory)
  # Tool description mode: when loading tools under tools, the source of the description exposed to AI/API
  #   short - prefer short_description (brief description, saves tokens); use description when empty
  #   full  - use description (detailed description)
  tool_description_mode: full
# ============================================
# MCP-related configuration
# ============================================

# MCP protocol configuration
# MCP (Model Context Protocol) is used for tool registration and invocation
mcp:
  enabled: false # whether to enable the MCP server (http mode)
  host: 127.0.0.1 # MCP server listen address; explicitly change it and configure network-layer access control when remote access is needed
  port: 8081 # MCP server port
  auth_header: "X-MCP-Token" # optional global service credential Header; for normal calls, use the user Authorization: Bearer Token
  auth_header_value: "" # global service credential value, effective only when allow_global_access=true
  allow_global_access: false # high-risk compatibility mode: maps a static key to a global service identity; by default, use the user Bearer Token
# External MCP configuration
external_mcp:
  servers: {}
# Built-in C2: when the machine only does conversation/knowledge base, this can be set to false to not start listeners and not register C2 MCP tools; enabled by default when this section is omitted
c2:
  enabled: true
# ============================================
# Knowledge-base related configuration
# ============================================
knowledge:
  enabled: false # whether to enable the knowledge retrieval feature
  base_path: knowledge_base # knowledge base directory path (relative to this config file's directory)
  embedding:
    provider: openai # embedding model provider (currently only openai is supported)
    model: text-embedding-v4 # embedding model name
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1 # leave empty to use the base_url configured for OpenAI
    api_key: sk-xxxxxxx # leave empty to use the api_key configured for OpenAI
  retrieval:
    top_k: 5 # number of Top-K results returned by retrieval
    similarity_threshold: 0.4 # cosine similarity threshold (0-1); results below this value are filtered out
    # Eino MultiQuery: the LLM rewrites the query, then performs multi-path vector retrieval and fusion (always enabled)
    multi_query:
      max_queries: 4 # upper limit of rewrite variants (including semantic coverage); 3~4 is recommended
    # Reranking (always enabled): dashscope uses gte-rerank; other OpenAI-compatible endpoints use /v1/rerank
    rerank:
      provider: "" # empty=inferred from base_url: dashscope | cohere
      model: "" # empty=dashscope→gte-rerank, cohere→rerank-multilingual-v3.0
      base_url: "" # leave empty to use the base_url of embedding / openai
      api_key: "" # leave empty to use the api_key of embedding / openai
    post_retrieve:
      prefetch_top_k: 20 # number of vector candidates per MultiQuery variant; 0=built-in max(top_k*4,20)
      max_context_chars: 0 # 0=no limit; otherwise the total Unicode character limit of the returned body (whole chunks)
      max_context_tokens: 0 # 0=no limit; tiktoken total token limit
    sub_index_filter: ""
  # ============================================
  # Indexing configuration (used to work around API limits)
  # ============================================
  indexing:
    # Chunking configuration
    chunk_size: 512 # maximum tokens per chunk (default 512); long text is split into multiple chunks
    chunk_overlap: 50 # overlapping tokens between chunks (default 50), to maintain contextual continuity
    max_chunks_per_item: 0 # maximum number of chunks for a single knowledge item (0 means no limit), to prevent a single file from consuming too much API quota
    # Rate-limit configuration (works around 429 errors)
    max_rpm: 0 # maximum requests per minute (default 0 means no limit); e.g., OpenAI defaults to 200 RPM
    rate_limit_delay_ms: 300 # inter-request interval in milliseconds (default 300), used to avoid API rate limits; set to 0 for no limit
    # Suggested values: 200 req/min ≈ 300ms, 100 req/min ≈ 600ms

    # Retry configuration
    max_retries: 3 # maximum retries (default 3); automatically retried on rate limits or server errors
    retry_delay_ms: 1000 # retry interval in milliseconds (default 1000); the delay increases with each retry
    # Chunking strategy (Eino): markdown_then_recursive = split by Markdown headings first, then recursively; recursive = recursive splitting only. When empty, the program defaults to markdown_then_recursive
    chunk_strategy: markdown_then_recursive
    # Embedding HTTP request timeout (seconds). 0 means use the built-in default (usually 120), consistent with the vectorization API client
    request_timeout_seconds: 120
    # true: when indexing, prefer the disk file content pointed to by the knowledge item's file_path (Eino FileLoader); false: use the body stored in the database. A disk read failure falls back to the DB
    prefer_source_file: false
    # Upper limit on the number of text items per embedding API request (index writes are batched by this). Must be ≤ the provider's limit (e.g., some compatible APIs allow at most 10); too large easily causes 400
    batch_size: 10
    # Eino indexer.WithSubIndexes: a list of logical-partition labels, written to the vector table sub_indexes; retrieval can filter with sub_index_filter; use [] if not needed
    sub_indexes: []
# ============================================
# Robot configuration (WeCom, DingTalk, Lark)
# ============================================
# Used to chat with CyberStrikeAI on mobile via WeCom/DingTalk/Lark, usable without deploying on a server
# Configurable under System Settings -> Robot Settings
robots:
  wechat: # WeChat iLink (personal WeChat ClawBot, bound by scanning a QR code)
    enabled: false
    # Authentication defaults to user_binding; a dedicated robot can change it to service_account and must restrict the real senders
    auth:
      mode: user_binding # user_binding | service_account
      # service_user_id: "RBAC user ID of admin or a dedicated service account"
      # allowed_external_users: ["t:tenant|u:sender"]
    bot_token: ""
    ilink_bot_id: ""
    ilink_user_id: ""
    base_url: https://ilinkai.weixin.qq.com
    bot_type: "3"
    bot_agent: CyberStrikeAI/1.0
  wecom: # WeCom
    enabled: false
    auth:
      mode: user_binding
    token: ""
    encoding_aes_key: ""
    corp_id: ""
    secret: ""
    agent_id: 0
  dingtalk: # DingTalk
    enabled: false
    auth:
      mode: user_binding
    client_id: ""
    client_secret: ""
    allow_conversation_id_fallback: false
  lark: # Lark
    enabled: false
    auth:
      mode: user_binding
    app_id: ""
    app_secret: ""
    verify_token: ""
    allow_chat_id_fallback: false
  telegram: # Telegram
    enabled: false
    auth:
      mode: user_binding
    bot_token: ""
    bot_username: ""
    allow_group_messages: false
  slack: # Slack
    enabled: false
    auth:
      mode: user_binding
    bot_token: ""
    app_token: ""
  discord: # Discord
    enabled: false
    auth:
      mode: user_binding
    bot_token: ""
    allow_guild_messages: false
  qq: # QQ robot
    enabled: false
    auth:
      mode: user_binding
    app_id: ""
    client_secret: ""
    sandbox: true
# ============================================
# Skills-related configuration
# ============================================

# Skill-package directory: each subdirectory contains only a standard SKILL.md (Agent Skills: front matter has only name and description) + optional attached files; no SKILL.yaml
# Example: skills/cyberstrike-eino-demo/
skills_dir: skills # Skills configuration file directory (relative to this config file's directory)
# ============================================
# Multi-agent sub-Agents (Markdown, the single place of maintenance)
# ============================================
# Each .md: YAML front matter (name / id / description / tools / bind_role / optional max_iterations>0 to override the global / optional kind: orchestrator) + the body is the system prompt
# Main agent: the fixed filename orchestrator.md, or any filename + front matter kind: orchestrator (only one allowed in the whole directory); the main agent does not participate in the task sub-agent list
# Advanced usage: you can still write sub_agents inside the multi_agent block; they are merged with this directory, and for the same id the YAML can be overridden by the .md
agents_dir: agents
# ============================================
# Role-related configuration
# ============================================

# The system loads all .yaml role configuration files from this directory
# Each role should have a separate configuration file, for example: roles/CTF.yaml, roles/Default.yaml, etc.
roles_dir: roles # Role configuration file directory (relative to this config file's directory)
# ============================================
# Project management and the fact blackboard
# ============================================
project:
  enabled: true
  # On compression, automatically save the continuation summary as a tentative note (one update per session/agent, does not replace confirmed facts)
  context_checkpoints: true
  # default_project_id: "" # optional: default project ID when a robot/batch task creates a conversation
  # Project-continuation supplements are included in the fact-index budget; the working-file candidate list has a separate budget of up to 4000 characters
  fact_index_max_runes: 65000
  # Budget for the fact-relationship quick-view section (reserved from the total index budget)
  fact_index_path_max_runes: 10000
  fact_summary_max_runes: 24000
  default_inject_deprecated: false

# ============================================
# One-click update (optional)
# ============================================
# Update source: a repository address; the update follows that repository's own default branch; when not configured, it is the official repository
# (https://github.com/AIPentest/CyberStrikeAI.git). When GitHub access is poor, you can fill in a mirror address here,
# and if you want to follow your own fork, change only this one place; the console "System Settings -> One-click Update" page lets you fill it in and save directly.
# A non-git directory (unpacked/packaged installation) does not need this configured, and can still run "Connect update source" on the console "One-click Update" page
# to turn the directory into a git work tree tracking that repository, after which one-click update works as in a normal installation.
# update:
#   repo: https://github.com/AIPentest/CyberStrikeAI.git  # a repository address; empty/omitted = official repository

# ============================================
# Egress privacy gateway (optional) — hide the operator's real IP
# ============================================
# When enabled, every outbound connection the platform makes (LLM calls, MCP
# tools, recon HTTP clients, C2, webshell, robots) is routed through the
# configured proxy so your real IP is never exposed while the system is active.
# With fail_closed, traffic is BLOCKED if the proxy is unreachable instead of
# leaking out on the real interface — prefer a failed request over a leak.
# egress:
#   enabled: false              # master switch
#   mode: tor                   # socks5 | tor | http | https | direct
#   address: "127.0.0.1:9050"   # proxy host:port (empty + mode=tor => 127.0.0.1:9050)
#   username: ""                # optional proxy username
#   password: ""                # optional proxy password
#   fail_closed: true           # kill-switch: block outbound if the proxy is down
#   dns_through_proxy: true     # resolve hostnames at the proxy (SOCKS5/Tor) so DNS does not leak
#   dial_timeout_sec: 30        # per-dial timeout in seconds (0 => default 30s)
