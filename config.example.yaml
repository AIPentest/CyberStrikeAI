# ============================================
# CyberStrikeAI 配置文件
# ============================================
# 本配置文件支持通过 Web 界面进行可视化配置
# 点击右上角"设置"按钮即可修改配置
# ============================================

# ============================================
# 系统设置
# ============================================

# 前端显示的版本号（可选，不填则显示默认版本）。一键更新完成后，会用新代码里这个文件的值
# 同步更新你的 config.yaml 的 version 字段（页头版本号与静态资源缓存随代码走）。
version: "v1.7.24"
# 服务器配置
server:
  host: 0.0.0.0 # 监听地址，0.0.0.0 表示监听所有网络接口
  port: 8080 # 服务端口；未启用 TLS 时为 http://localhost:8080
  # 其他可信 Web 集成的精确 Origin。Chromium 浏览器插件会自动识别，无需配置；不要使用通配符。
  # cors_allowed_origins:
  #   - https://trusted-integration.example
  # --- 可选：HTTPS + HTTP/2（缓解浏览器对同源 HTTP/1.1 的并发连接数限制，多路 Deep 流式更稳）---
  # 启用 TLS 的条件（满足其一即可）：tls_enabled: true，或 tls_auto_self_sign: true，或同时配置了 tls_cert_path + tls_key_path。
  # 启用后请用 https://127.0.0.1:<本端口>/ 访问；若仍用 http:// 访问同端口，将自动 308 跳转到 HTTPS（可用 tls_http_redirect: false 关闭）。
  tls_enabled: true
  # 启用 HTTPS 时，明文 HTTP 是否自动跳转到 HTTPS（默认 true；同端口嗅探 TLS/HTTP 后分流）
  # tls_http_redirect: true
  # 方式 A（推荐生产）：PEM 证书与私钥路径
  # tls_cert_path: /path/to/fullchain.pem
  # tls_key_path: /path/to/privkey.pem
  # 方式 B（仅本地/测试）：无证书文件时内存自签（浏览器会提示不受信任；SAN 含 localhost / 127.0.0.1）
  tls_auto_self_sign: true
# 认证配置
auth:
  session_duration_hours: 12 # 登录有效期（小时），超时后需重新登录
# 日志配置
log:
  level: info # 日志级别: debug(调试), info(信息), warn(警告), error(错误)
  output: stdout # 日志输出位置: stdout(标准输出), stderr(标准错误), 或文件路径
  diagnostic_dir: log # 额外保存 warn 及以上诊断日志，按本地日期拆分；相对于进程工作目录
  diagnostic_retention_days: 14 # 保留天数（含当天）；省略或 <= 0 使用 14 天
  diagnostic_disabled: false # true 关闭额外诊断日志；修改后需重启
# 平台操作审计（系统设置 -> 日志审计；不记录对话正文与每次工具调用）
audit:
  enabled: true
  retention_days: 15 # 0 表示不自动清理
  max_detail_bytes: 8192
  auth_failure_cooldown_seconds: 60 # 同一 IP 登录/改密失败审计最短间隔（秒）；未配置时默认 60；-1 关闭节流
# MCP 状态监控执行记录保留（tool_executions 表）
monitor:
  retention_days: 90 # 省略时默认 90；0 表示不自动清理
# 运行空间垃圾清理（系统设置 -> 存储清理）
# 覆盖 Agent 工作区、工具输出缓存、C2 产物、对话上传件等磁盘产物的保留策略。
# auto_clean 默认关闭：升级后不会在管理员不知情的情况下删除既有数据；
# 关闭时仍可在「存储清理」页手动预览并执行清理。
storage:
  auto_clean: false # true 开启后台定时清理
  interval_minutes: 60 # 后台清理间隔（分钟）；最小 5
  orphan_grace_days: 1 # 会话/项目已删除但目录残留时，闲置多少天后回收
  active_grace_hours: 24 # 最近有活动的会话一律跳过，避免误删正在跑的任务数据
  # 各类别 retention_days：省略时使用下方默认值；0 表示不按保留期清理（孤儿目录仍会回收）
  categories:
    workspace: # Agent 工作区 tmp/workspace；默认 30 天
      enabled: true
      retention_days: 30
    reduction: # 超长工具输出落盘 tmp/reduction；默认 7 天（纯派生数据）
      enabled: true
      retention_days: 7
    conversation_artifacts: # 摘要与超长输入台账 data/conversation_artifacts；默认 30 天
      enabled: true
      retention_days: 30
    plantask: # 多代理计划看板 skills/.pi/plantask；默认 30 天（纯派生数据）
      enabled: true
      retention_days: 30
    c2_artifacts: # C2 回传截图/上传件/下发文件/payload tmp/c2；默认 30 天
      enabled: true # 注意：清理 payload 后对应下载链接会失效
      retention_days: 30
    chat_uploads: # 对话上传附件 chat_uploads；默认 90 天
      enabled: true
      retention_days: 90
    workflow_checkpoints: # 工作流断点 data/workflow-checkpoints；默认 7 天
      enabled: true
      retention_days: 7
    diagnostic_logs: # 诊断日志 log/diagnostic-*.log；默认 14 天
      enabled: true # 与 log.diagnostic_retention_days 各自独立生效，取先到者
      retention_days: 14
# ============================================
# 对话相关配置
# ============================================

# AI 通道配置（支持保存多个 OpenAI 兼容 / Claude 通道）
# default_channel 指定新对话与未显式选择通道的任务使用哪个通道。
# 每个 channels.<id> 必填：api_key, base_url, model。
# 支持的 API 服务商：
#   - OpenAI: https://api.openai.com/v1
#   - DeepSeek: https://api.deepseek.com/v1
#   - 其他兼容 OpenAI 协议的 API
# 常用模型: gpt-4, gpt-3.5-turbo, deepseek-chat, claude-3-opus 等
# provider: 可选值 openai_compatible(默认) | claude(Pi 原生 Anthropic Messages API)
ai:
  default_channel: qwen-max
  channels:
    qwen-max:
      name: Qwen Max
      provider: openai_compatible
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: sk-xxxxxxx
      model: qwen3-max
      max_total_tokens: 120000
      max_completion_tokens: 32768
      # headers: 可选。追加或覆盖发给模型网关的 HTTP 请求头，值支持 ${ENV_VAR} 与 ${ENV_VAR:-默认值}。
      # 用于兼容要求私有鉴权头、版本头或组织头的第三方 OpenAI 兼容供应商（如 opencode 等聚合网关）。
      # 配置后会覆盖同名的内置头（Authorization、User-Agent 等），空值项会被忽略。
      # headers:
      #   X-Api-Key: ${OPENCODE_API_KEY}
      #   x-opencode-session: "%session_id%" # 自动替换为当前对话 ID
      #   X-Client-Name: cyberstrike-ai
      #   HTTP-Referer: https://example.com
      # 配置自定义头时，仅允许同源重定向，跨主机、端口或协议的重定向会被拒绝。
      # HITL 审计仅在未显式配置 provider/base_url/api_key 时继承主渠道 headers；
      # 独立审计身份如需请求头，请在 hitl.audit_model.headers 中单独配置。
      # 空 headers 与未配置等价；所有自定义头值在设置接口中均按敏感值脱敏。
      # Pi 路径模型推理：DeepSeek/OpenAI 为 thinking / reasoning_effort；Claude 4.6+ 为 adaptive + output_config.effort（仅显式配置 effort 时下发）；3.7 为 enabled+budget_tokens:10000（文档示例），effort 不映射，自定义预算用 extra_request_fields
      reasoning:
        mode: on # auto | on | off；off：OpenAI/Claude 不附加推理字段，DeepSeek 发送 thinking.type=disabled（其默认开启思考）
        effort: high # low | medium | high | max | xhigh（最高档：OpenAI 常用 xhigh，部分网关用 max，原样下发）；空表示不指定
        allow_client_reasoning: true # false 时忽略对话请求体 reasoning，仅以下方为准
        profile: openai_compat # auto | deepseek_compat | openai_compat | output_config_effort
        # extra_request_fields: {} # 可选：管理员自定义根级 JSON 片段（高级）
    # qwen-plus:
    #   name: Qwen Plus Fallback
    #   provider: openai_compatible
    #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    #   api_key: sk-xxxxxxx
    #   model: qwen-plus
    #   max_total_tokens: 120000
    #   max_completion_tokens: 32768
# 视觉分析（analyze_image MCP 工具；图片仅在单次 VL 调用中出现，Agent 上下文只保留文字摘要）
vision:
  enabled: false # true 且 model 非空时注册 analyze_image
  model: qwen-vl # VL 模型名（enabled 时必填）
  api_key: "" # 留空则复用默认 AI 通道 api_key
  base_url: "" # 留空则复用默认 AI 通道 base_url
  provider: # 留空则复用默认 AI 通道 provider（openai_compatible | claude）
  max_image_bytes: 5242880 # 原始文件上限（字节），默认 5MB
  max_dimension: 2048 # 长边缩放像素
  jpeg_quality: 82
  max_payload_bytes: 524288 # 编码后送 VL API 上限，默认 512KB
  skip_preprocess_below_bytes: 2097152 # 低于 2MB 且长边<=max_dimension 且<=max_payload 时原图直传；0=始终压缩
  detail: auto # low | high | auto（Pi ImageURLDetail）
  timeout_seconds: 60
# ============================================
# 资产管理（网络空间测绘搜索）配置（可选）
# ============================================
# 用于「资产管理 → 信息收集」页面调用 FOFA / ZoomEye / Quake / Shodan API
# 后端代理请求，避免前端暴露 key；环境变量优先级更高
fofa:
  base_url: https://fofa.info/api/v1/search/all # 可选，留空则使用默认
  api_key: "" # FOFA API Key（可选，建议在系统设置中填写）
zoomeye:
  base_url: https://api.zoomeye.ai/v2/search # 可选，留空则使用默认
  api_key: "" # ZoomEye API Key；也可通过 ZOOMEYE_API_KEY 环境变量配置
quake:
  base_url: https://quake.360.net/api/v3/search/quake_service # 可选，留空则使用默认
  api_key: "" # Quake API Token；也可通过 QUAKE_API_KEY 环境变量配置
shodan:
  base_url: https://api.shodan.io # 可选，留空则使用默认
  api_key: "" # Shodan API Key；也可通过 SHODAN_API_KEY 环境变量配置
# Agent 配置
# 达到最大迭代次数时，AI 会自动总结测试结果
# Pi runtime (Node.js >=22.19). Build with: bash scripts/build-pi-runtime.sh
agent_runtime:
  engine: pi # Pi is the only agent runtime
  node_path: node
  worker_path: "" # empty: use the source-addressed runtime bundle
  session_dir: data/pi-sessions

agent:
  # 修改后重启服务，对新任务生效；例如 1440 = 24 小时，单次工具超时独立生效。
  task_timeout_minutes: 600 # 任务执行超时（分钟）；未配置=600，0=不限时，负数无效；续跑重新计时
  max_iterations: 12000 # 全局最大迭代次数（单代理 / Deep / Supervisor / Plan-Execute 主执行器 / 子代理均沿用；agents/*.md 中 max_iterations>0 可单独覆盖）
  tool_timeout_minutes: 60 # 单次工具执行最大时长（分钟），超时自动终止；0 表示不限制（不推荐，易出现长时间挂起）
  tool_wait_timeout_seconds: 300 # 工具本轮最多等待（秒）；到时返回 execution_id，worker 继续后台执行，可用 wait_tool_execution 继续等待；0=等到完成
  external_mcp_max_concurrent_per_server: 5 # 单个外部 MCP server 同时运行的工具数；0=默认2；负数=不限制
  external_mcp_max_concurrent_total: 16 # 所有外部 MCP 工具全局并发上限；0=默认16；负数=不限制
  external_mcp_circuit_failure_threshold: 15 # 单个外部 MCP server 连续失败多少次后熔断；0=默认3；负数=关闭熔断
  external_mcp_circuit_cooldown_seconds: 60 # 熔断冷却秒数；0=默认60
  shell_no_output_timeout_seconds: 1200 # execute/exec 连续无新输出则终止（秒）；通用防挂死；0=默认300；-1=关闭
  workspace_root_dir: "" # 会话工作目录根路径（curl/wget 下载、read_file/glob/grep 本地分析）；空=tmp/workspace，其下按 projects/{id} 或 conversations/{id} 隔离；勿用系统 /tmp
  # system_prompt_path: prompts/single-agent.md # 可选：单代理系统提示文件（相对本配置文件所在目录）；非空且可读时替换内置提示

  system_prompt_path: ""
# 调用拦截：在「安全防护 → 调用拦截」编辑并保存后立即生效；与 HITL 审批白名单独立。
# 旧配置省略 tool_guard 时也默认启用政府域名保护。手动修改 YAML 后需重启。
tool_guard:
  enabled: true
  rules:
    - id: government-domains
      name: 政府网站保护
      enabled: true
      # Go/RE2 正则；命名捕获组 match 用于提醒中的 {match}。
      pattern: '(?i)(?:^|[^\p{L}\p{M}\p{N}_.-])(?P<match>(?:(?:[\p{L}\p{M}\p{N}_*-]+\.)+gov(?:\.[\p{L}\p{M}\p{N}_*-]+)*|gov(?:\.[\p{L}\p{M}\p{N}_*-]+)+|\.gov(?:\.[\p{L}\p{M}\p{N}_*-]+)*)\.?)(?:$|[^\p{L}\p{M}\p{N}_.-])'
      # 支持 {match}、{tool}、{rule}；留空使用通用提醒。
      message: '识别到 {match}，禁止攻击政府网站。请检查目标与授权范围，并更换为已获授权的非政府目标。'

# 人机协同（HITL）全局白名单：此处列出的工具始终免审批，与对话页「白名单工具（免审批，逗号分隔）」合并为并集；侧栏「应用」可合并写入本列表并立即生效。
# 非白名单工具在审批方=审计 Agent 时，按会话 HITL 模式选用提示词：
#   approval → audit_agent_prompt
#   review_edit → audit_agent_prompt_review_edit（可改参后放行）
hitl:
  # 全局默认人机协同模式：off=关闭，approval=审批模式，review_edit=审查编辑；新建会话无独立配置时沿用
  default_mode: off
  # 全局默认审批方：human=人工审批，audit_agent=审计 Agent；新建会话无独立配置时沿用
  default_reviewer: human
  # 全局默认审批等待时限（秒）：300=5分钟，0=不限时；新建会话无独立配置时沿用
  default_timeout_seconds: 300
  # 审计 Agent 后端二选一：openai=兼容协议聊天模型（提示词 JSON）；typesafe=TypeSafe Jev 结构化放通/拦截。
  audit_backend: openai
  # 审计 Agent 专用模型。openai 后端字段留空则复用主模型；typesafe 后端 api_key 必填且不继承主模型密钥。
  audit_model:
    provider: "" # openai / claude；仅 openai 后端生效，留空跟随 openai.provider
    base_url: "" # openai 后端留空跟随主模型；typesafe 后端留空使用 https://api.typesafe.ai
    api_key: "" # openai 后端留空跟随主模型；typesafe 后端填写 TypeSafe API Key
    model: "" # openai 后端建议填小模型；typesafe 后端留空使用 jev-latest
    reasoning:
      profile: "" # auto / deepseek_compat / openai_compat；仅控制审计请求的 thinking 字段
  # 已决策审计日志保留天数（与 MCP 监控一致；省略默认 90；0 表示不自动清理）
  retention_days: 90
  # 按你环境里的真实工具名增删（与侧栏一致、小写不敏感）；不需要全局免审批可改为 []
  tool_whitelist: [read_file, ls, list_dir, glob, grep, tool_search, upsert_project_fact, get_project_fact, list_project_facts, search_project_facts, list_vulnerabilities, get_vulnerability, get_asset, query_assets, list_knowledge_risk_types, get_tool_execution, wait_tool_execution, batch_task_list, batch_task_get, manage_webshell_list, c2_event, c2_file]
  # audit_agent_prompt: |  # 审批模式；留空使用内置默认，可在「人机协同」页编辑。openai 后端作聊天提示词；typesafe 后端作为 Jev 组织策略
  # audit_agent_prompt_review_edit: |  # 审查编辑模式；留空使用内置默认

  audit_agent_prompt: |-
    你是 CyberStrikeAI 人机协同审计 Agent。审查 Agent 即将执行的工具调用是否会对系统造成实质性损害。

    你会收到 JSON，包含 hitlMode、toolName、arguments/argumentsObj、userMessage、thinking、reasoningChain、planning 等字段。

    规则优先级：
    - 必须 reject 的规则
    - 必须 approve 的规则
    - 默认放行规则

    规则匹配要求：
    - 如果同时命中 reject 和 approve，必须 reject。
    - 每次裁决必须给出一个规则编号，不得输出“命中规则：无”。
    - 未命中明确 reject 或 approve 规则，但未发现明确破坏行为时，命中 D1：默认放行。
    - 不得仅凭“本地执行”“设置超时”“文件名包含 test”判断脚本无害；必须检查实际 command、代码或请求参数。
    - 如果脚本具体内容不可见，应表述为“当前参数未显示明确高危操作”，不能断言“无持久化影响”。

    裁决基调（默认放行）：
    - 绝大多数渗透测试操作（包括各类攻击 payload）都应放行
    - 在裁决之前需要判断出：1、此请求的是干什么（理解请求内容）？2、此请求造成什么后果？
    - 仅在「明确会直接破坏目标业务系统正常运行，或造成真实用户数据丢失/不可逆篡改」时 → reject
    - 信息不足、参数略宽泛、仅为探测意图时 → approve
    - 拿不准时 → approve（宁可放过可恢复的测试，不要误拦合法攻击）

    必须 reject 的高危情形（示例，非穷举）：
    - 修改/重置任意用户或管理员密码、强制下线真实用户
    - 修改服务器或服务配置（系统配置、Web/数据库参数、防火墙、启动项、计划任务）
    - 修改/创建/删除用户、角色、权限（账户体系篡改）
    - 删除或大规模破坏数据/文件（DROP/TRUNCATE/DELETE 全表、rm 重要文件、清空数据库）
    - 停止、禁用、重启业务服务（systemctl stop、kill 关键进程、shutdown、reboot）
    - 大规模压测或高并发造成 DoS

    以下情形必须 approve（即使看起来“攻击性强”或包含写操作）：
    - 各类漏洞探测与利用 payload（SQL 注入含读写型、命令注入、反序列化、文件包含、路径遍历、SSRF、SSTI、XXE 等）
    - 文件上传测试，包括上传 webshell、写入 webshell 文件
    - 命令执行探测、反弹 Shell、dnslog / 数据外带探测
    - 数据库命令执行、写文件、写计划任务、内存马注入等 getshell 利用
    - 常规速率的口令爆破（非 DoS 级）
    - 信息收集、端口/目录扫描、枚举、抓取
    - 读取、查询、探测类操作（含敏感文件）
    - 攻陷后无害侦察命令（whoami/id/uname/ls/cat 等）
    - 参数宽泛但无明确破坏意图的请求

    判定原则：
    - “写”本身不是拦截理由——渗透测试大量依赖写操作（注入、上传、爆破、getshell）
    - 关键看是否破坏「业务可用性 / 关键数据完整性」
    - 只有明确命中上方 reject 清单才 reject

    仅输出一行 JSON，不要 markdown 代码块：
    {"decision":"approve"|"reject","comment":"实际操作：...；成功后的后果：...；命中规则：..."}
  audit_agent_prompt_review_edit: |-
    你是 CyberStrikeAI 人机协同审计 Agent。审查 Agent 即将执行的工具调用是否会对系统造成实质性损害。

    你会收到 JSON，包含 hitlMode、toolName、arguments/argumentsObj、userMessage、thinking、reasoningChain、planning 等字段。

    规则优先级：
    - 必须 reject 的规则
    - 必须 approve 的规则
    - 默认放行规则

    规则匹配要求：
    - 如果同时命中 reject 和 approve，必须 reject。
    - 每次裁决必须给出一个规则编号，不得输出“命中规则：无”。
    - 未命中明确 reject 或 approve 规则，但未发现明确破坏行为时，命中 D1：默认放行。
    - 不得仅凭“本地执行”“设置超时”“文件名包含 test”判断脚本无害；必须检查实际 command、代码或请求参数。
    - 如果脚本具体内容不可见，应表述为“当前参数未显示明确高危操作”，不能断言“无持久化影响”。

    裁决基调（默认放行）：
    - 绝大多数渗透测试操作（包括各类攻击 payload）都应放行
    - 在裁决之前需要判断出：1、此请求的是干什么（理解请求内容）？2、此请求造成什么后果？
    - 仅在「明确会直接破坏目标业务系统正常运行，或造成真实用户数据丢失/不可逆篡改」时 → reject
    - 信息不足、参数略宽泛、仅为探测意图时 → approve
    - 拿不准时 → approve（宁可放过可恢复的测试，不要误拦合法攻击）

    必须 reject 的高危情形（示例，非穷举）：
    - 修改/重置任意用户或管理员密码、强制下线真实用户
    - 修改服务器或服务配置（系统配置、Web/数据库参数、防火墙、启动项、计划任务）
    - 修改/创建/删除用户、角色、权限（账户体系篡改）
    - 删除或大规模破坏数据/文件（DROP/TRUNCATE/DELETE 全表、rm 重要文件、清空数据库）
    - 停止、禁用、重启业务服务（systemctl stop、kill 关键进程、shutdown、reboot）
    - 大规模压测或高并发造成 DoS

    以下情形必须 approve（即使看起来“攻击性强”或包含写操作）：
    - 各类漏洞探测与利用 payload（SQL 注入含读写型、命令注入、反序列化、文件包含、路径遍历、SSRF、SSTI、XXE 等）
    - 文件上传测试，包括上传 webshell、写入 webshell 文件
    - 命令执行探测、反弹 Shell、dnslog / 数据外带探测
    - 数据库命令执行、写文件、写计划任务、内存马注入等 getshell 利用
    - 常规速率的口令爆破（非 DoS 级）
    - 信息收集、端口/目录扫描、枚举、抓取
    - 读取、查询、探测类操作（含敏感文件）
    - 攻陷后无害侦察命令（whoami/id/uname/ls/cat 等）
    - 参数宽泛但无明确破坏意图的请求

    判定原则：
    - “写”本身不是拦截理由——渗透测试大量依赖写操作（注入、上传、爆破、getshell）
    - 关键看是否破坏「业务可用性 / 关键数据完整性」
    - 只有明确命中上方 reject 清单才 reject

    仅输出一行 JSON，不要 markdown 代码块：
    {"decision":"approve"|"reject","comment":"实际操作：...；成功后的后果：...；命中规则：...","editedArguments":{...}}

    editedArguments 规则（仅 approve 且需要改参时填写，否则省略该字段）：
    - 提供完整替换后的工具参数对象，键名与 argumentsObj 一致
    - 只做最小必要修改以收窄范围、消除风险（如限制 path、去掉危险 flag）
    - 禁止扩大攻击面：不得扩大目标范围、提升权限或引入破坏性参数
    - 无法安全改参且存在上述高危情形时应 reject，不要勉强 approve
# 多代理与 Pi 单代理（Pi SDK；单代理入口 /api/agent*，多代理 /api/multi-agent*）
# 依赖在 go.mod 中拉取；若下载失败可设置: go env -w GOPROXY=https://goproxy.cn,direct
# Deep / Plan-Execute / Supervisor 由对话页与 WebShell 所选模式在请求体 orchestration 中指定；机器人按 robot_default_agent_mode
multi_agent:
  enabled: true
  robot_default_agent_mode: single # 企微/钉钉/飞书机器人默认：single | deep | plan_execute | supervisor
  batch_use_multi_agent: false # true 时「批量任务」队列中每个子任务也走 Pi 多代理（成本更高）
  # plan_execute 专用：execute↔replan 外层循环上限，0 表示 原生默认 10。主/子代理 ReAct 轮次见 agent.max_iterations。
  plan_execute_loop_max_iterations: 0
  sub_agent_user_context_max_runes: 0 # 子代理 task 描述中注入用户原文；0=不截断（默认），>0=总字符上限，负数=禁用
  without_general_sub_agent: false # false 时保留 Deep 内置 general-purpose 子代理
  without_write_todos: false
  orchestrator_instruction: "" # Deep 主代理：agents/orchestrator.md（或 kind: orchestrator 的单个 .md）正文优先；正文为空时用此处；皆空则 原生默认
  orchestrator_instruction_plan_execute: "" # plan_execute 主代理：agents/orchestrator-plan-execute.md 正文优先；正文为空时用此处；皆空则用内置 plan_execute 提示（不使用 Deep 的 orchestrator_instruction）
  orchestrator_instruction_supervisor: "" # supervisor 主代理：agents/orchestrator-supervisor.md 正文优先；正文为空时用此处；皆空则用内置 supervisor 提示（transfer/exit 说明仍由运行追加；不使用 Deep 的 orchestrator_instruction）
  # Pi 官方 Skills：渐进式披露 + 可选本机文件/Shell（原生 Go 工具）。Skills 目录见 skills_dir。
  skills:
    disable: false # true：不注册 skill 渐进式披露中间件，也不挂本机 FS/Shell 工具；false：按下方开关加载
    filesystem_tools: true # true：注册 read_file/glob/grep/write/edit/execute（授权环境慎用）；false：仅 skill，不暴露本机读写与 Shell
    skill_tool_name: skill # 模型侧可调用的「加载技能」工具名，一般保持 skill；与技能包文档中的调用名一致即可
  # Pi 原生 中间件与 Deep/Supervisor/plan_execute Executor 调参（结构体见 internal/config/config.go → MultiAgentPiMiddlewareConfig）
  # plan_execute：下列 patch/reduction/tool_search/plantask 等同样作用于 Executor（经 ExecPreMiddlewares）；Planner/Replanner 不挂 MCP 前置中间件。
  runtime:
    tool_search_enable: true
    tool_search_min_tools: 20
    tool_search_always_visible: 12
    tool_search_always_visible_tools: [get_tool_execution, wait_tool_execution, cancel_tool_execution, search_knowledge_base]
    tool_search_include_builtins: true # true：后端内置工具始终常驻，绕过 tool_search
    plantask_enable: true
    plantask_rel_dir: .pi/plantask
    reduction_enable: true
    reduction_root_dir: tmp/reduction
    reduction_max_length_for_trunc: 12000
    model_retry_max_retries: 0 # 0 uses Pi SDK defaults
    model_retry_max_backoff_sec: 0 # 0 uses Pi SDK defaults
    model_failover_channels: []
    model_failover_max_retries: 0
    empty_response_continue_max_attempts: 5

# 数据库配置
database:
  path: data/conversations.db # SQLite 数据库文件路径，用于存储对话历史和消息
  knowledge_db_path: data/knowledge.db # 知识库数据库文件路径（可选，为空则使用会话数据库），用于存储知识库项和向量嵌入，可独立复制和复用
# ============================================
# 任务管理相关配置
# ============================================
# （配置项已包含在对话相关配置中）

# ============================================
# 漏洞管理相关配置
# ============================================

# 安全工具配置
# 系统会从该目录加载所有 .yaml 格式的工具配置文件
# 推荐方式：在 tools/ 目录下为每个工具创建独立的配置文件
security:
  # auto: native Job Object on Windows; Unix watchdog unless cgroup_root is set.
  # Linux production: configure a systemd service with Delegate=cpu memory pids; set
  # mode: required, cgroup_root: auto. Explicit isolation errors fail closed.
  process_isolation:
    mode: auto
    cgroup_root: ""
    max_processes: 256
    memory_max_bytes: 2147483648
    cpu_quota_micros: 0 # 0=no CPU cap; 100000=one core (100 ms period)
  tools_dir: tools # 工具配置文件目录（相对于配置文件所在目录）
  # 工具描述模式：加载 tools 下工具时，暴露给 AI/API 使用的描述来源
  #   short - 优先使用 short_description（简短描述，省 token），为空时用 description
  #   full  - 使用 description（详细描述）
  tool_description_mode: full
# ============================================
# MCP 相关配置
# ============================================

# MCP 协议配置
# MCP (Model Context Protocol) 用于工具注册和调用
mcp:
  enabled: false # 是否启用 MCP 服务器（http模式）
  host: 127.0.0.1 # MCP 服务器监听地址；需要远程访问时再显式修改并配置网络层访问控制
  port: 8081 # MCP 服务器端口
  auth_header: "X-MCP-Token" # 可选的全局服务凭证 Header；普通调用请使用用户 Authorization: Bearer Token
  auth_header_value: "" # 全局服务凭证值，仅 allow_global_access=true 时生效
  allow_global_access: false # 高风险兼容模式：静态密钥映射为全局服务身份；默认请使用用户 Bearer Token
# 外部 MCP 配置
external_mcp:
  servers: {}
# 内置 C2：本机仅做对话/知识库时可设为 false，不启动监听器、不注册 C2 MCP 工具；省略本段时默认启用
c2:
  enabled: true
# ============================================
# 知识库相关配置
# ============================================
knowledge:
  enabled: false # 是否启用知识检索功能
  base_path: knowledge_base # 知识库目录路径（相对于配置文件所在目录）
  embedding:
    provider: openai # 嵌入模型提供商（目前仅支持openai）
    model: text-embedding-v4 # 嵌入模型名称
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1 # 留空则使用OpenAI配置的base_url
    api_key: sk-xxxxxxx # 留空则使用OpenAI配置的api_key
  retrieval:
    top_k: 5 # 检索返回的Top-K结果数量
    similarity_threshold: 0.4 # 余弦相似度阈值（0-1），低于此值的结果将被过滤
    # Pi MultiQuery：LLM 改写查询后多路向量检索再融合
    multi_query:
      max_queries: 4 # 含原查询的检索次数上限，设为 1 时直接向量检索
    # 精排（始终启用）：dashscope 用 gte-rerank；其他 OpenAI 兼容端点走 /v1/rerank
    rerank:
      provider: "" # 空=按 base_url 推断：dashscope | cohere
      model: "" # 空=dashscope→gte-rerank，cohere→rerank-multilingual-v3.0
      base_url: "" # 留空则用 embedding / openai 的 base_url
      api_key: "" # 留空则用 embedding / openai 的 api_key
    post_retrieve:
      prefetch_top_k: 20 # 每条 MultiQuery 变体的向量候选数；0=内置 max(top_k*4,20)
      max_context_chars: 0 # 0 不限制；否则返回的正文总 Unicode 字符上限（整段 chunk）
      max_context_tokens: 0 # 0 不限制；tiktoken 总 token 上限
    sub_index_filter: ""
  # ============================================
  # 索引配置（用于解决 API 限制问题）
  # ============================================
  indexing:
    # 分块配置
    chunk_size: 512 # 每个块的最大 token 数（默认 512），长文本会被分割成多个块
    chunk_overlap: 50 # 块之间的重叠 token 数（默认 50），保持上下文连贯性
    max_chunks_per_item: 0 # 单个知识项的最大块数量（0 表示不限制），防止单个文件消耗过多 API 配额
    # 速率限制配置（解决 429 错误）
    max_rpm: 0 # 每分钟最大请求数（默认 0 表示不限制），如 OpenAI 默认 200 RPM
    rate_limit_delay_ms: 300 # 请求间隔毫秒数（默认 300），用于避免 API 速率限制，设为 0 不限制
    # 建议值：200 次/分钟≈300ms, 100 次/分钟≈600ms

    # 重试配置
    max_retries: 3 # 最大重试次数（默认 3），遇到速率限制或服务器错误时自动重试
    retry_delay_ms: 1000 # 重试间隔毫秒数（默认 1000），每次重试会递增延迟
    # 分块策略（Pi）：markdown_then_recursive = 先按 Markdown 标题切再递归；recursive = 仅递归切分。留空时程序内默认 markdown_then_recursive
    chunk_strategy: markdown_then_recursive
    # 嵌入 HTTP 请求超时（秒）。0 表示使用内置默认（一般为 120），与向量化 API 客户端一致
    request_timeout_seconds: 120
    # true：索引时优先用知识项 file_path 指向的磁盘文件内容（Pi FileLoader）；false：用数据库里存的正文。读盘失败会回退 DB
    prefer_source_file: false
    # 单次嵌入 API 请求的文本条数上限（索引写入按此分批）。须 ≤ 服务商限制（如部分兼容接口最多 10）；过大易 400
    batch_size: 10
    # Pi indexer.WithSubIndexes：逻辑分区标签列表，会写入向量表 sub_indexes，检索可用 sub_index_filter 过滤；无需求可 []
    sub_indexes: []
# ============================================
# 机器人配置（企业微信、钉钉、飞书）
# ============================================
# 用于在手机端通过企业微信/钉钉/飞书与 CyberStrikeAI 对话，无需部署在服务器上也可使用
# 在系统设置 -> 机器人设置 中可配置
robots:
  wechat: # 微信 iLink（个人微信 ClawBot，扫码绑定）
    enabled: false
    # 鉴权默认 user_binding；专用机器人可改 service_account，并必须限制真实发送者
    auth:
      mode: user_binding # user_binding | service_account
      # service_user_id: "admin 或专用服务账号的 RBAC user ID"
      # allowed_external_users: ["t:tenant|u:sender"]
    bot_token: ""
    ilink_bot_id: ""
    ilink_user_id: ""
    base_url: https://ilinkai.weixin.qq.com
    bot_type: "3"
    bot_agent: CyberStrikeAI/1.0
  wecom: # 企业微信
    enabled: false
    auth:
      mode: user_binding
    token: ""
    encoding_aes_key: ""
    corp_id: ""
    secret: ""
    agent_id: 0
  dingtalk: # 钉钉
    enabled: false
    auth:
      mode: user_binding
    client_id: ""
    client_secret: ""
    allow_conversation_id_fallback: false
  lark: # 飞书
    enabled: false
    auth:
      mode: user_binding
    app_id: ""
    app_secret: ""
    verify_token: ""
    allow_chat_id_fallback: false
  telegram: # Telegram
    enabled: false
    auth:
      mode: user_binding
    bot_token: ""
    bot_username: ""
    allow_group_messages: false
  slack: # Slack
    enabled: false
    auth:
      mode: user_binding
    bot_token: ""
    app_token: ""
  discord: # Discord
    enabled: false
    auth:
      mode: user_binding
    bot_token: ""
    allow_guild_messages: false
  qq: # QQ 机器人
    enabled: false
    auth:
      mode: user_binding
    app_id: ""
    client_secret: ""
    sandbox: true
# ============================================
# Skills 相关配置
# ============================================

# 技能包目录：每个子目录仅标准 SKILL.md（Agent Skills：front matter 仅 name、description）+ 可选附属文件；无 SKILL.yaml
# 示例：skills/cyberstrike-pi-demo/
skills_dir: skills # Skills配置文件目录（相对于配置文件所在目录）
# ============================================
# 多代理子 Agent（Markdown，唯一维护处）
# ============================================
# 每个 .md：YAML front matter（name / id / description / tools / bind_role / 可选 max_iterations>0 覆盖全局 / 可选 kind: orchestrator）+ 正文为系统提示词
# 主代理：固定文件名 orchestrator.md，或任意文件名 + front matter kind: orchestrator（全目录仅允许一个）；主代理不参与 task 子代理列表
# 高级用法：仍可在 multi_agent 块内写 sub_agents，会与本文目录合并且同 id 时 YAML 可被 .md 覆盖
agents_dir: agents
# ============================================
# 角色相关配置
# ============================================

# 系统会从该目录加载所有 .yaml 格式的角色配置文件
# 每个角色应创建独立的配置文件，例如：roles/CTF.yaml, roles/默认.yaml 等
roles_dir: roles # 角色配置文件目录（相对于配置文件所在目录）
# ============================================
# 项目管理与事实黑板
# ============================================
project:
  enabled: true
  # 压缩时自动保存续接摘要为 tentative note（每会话/代理更新一条，不替代已确认事实）
  context_checkpoints: true
  # default_project_id: "" # 可选：机器人/批量任务创建对话时的默认项目 ID
  # 项目续接补充包含在事实索引预算内；工作文件候选清单另有最多 4000 字符预算
  fact_index_max_runes: 65000
  # 事实关系速览段预算（从索引总预算中预留）
  fact_index_path_max_runes: 10000
  fact_summary_max_runes: 24000
  default_inject_deprecated: false

# ============================================
# 一键更新（可选）
# ============================================
# 更新源：一个仓库地址，更新跟随该仓库自己的默认分支；不配置时就是官方仓库
# （https://github.com/AIPentest/CyberStrikeAI.git）。GitHub 访问不畅时可在这里填镜像地址，
# 想跟随自己的二开也只改这一处；控制台「系统设置 → 一键更新」页可以直接填写保存。
# 非 git 目录（解压/打包安装）不需要配置，也能在控制台「一键更新」页执行「接入更新源」，
# 把目录变成跟踪该仓库的 git 工作树，此后按正常安装一键更新。
# update:
#   repo: https://github.com/AIPentest/CyberStrikeAI.git  # 一个仓库地址；留空/不写 = 官方仓库
