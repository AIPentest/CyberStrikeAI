# ============================================
# CyberStrikeAI configuration file
# ============================================
# This configuration file supports visual configuration via the Web interface
# Click the "Settings" button in the top-right corner to modify the configuration
# ============================================

# ============================================
# System settings
# ============================================

# Version number displayed in the frontend (optional; blank shows the default version). After one-click update completes,
# this file's value in the new code will sync your config.yaml's version field (the page header version and static asset cache follow the code).
version: "v1.7.24"
# Server configuration
server:
  host: 0.0.0.0 # Listen address; 0.0.0.0 means listen on all network interfaces
  port: 8080 # Service port; without TLS it is http://localhost:8080
  # Exact Origins of other trusted web integrations. The Chromium browser extension recognizes itself automatically, no configuration needed; do not use wildcards.
  # cors_allowed_origins:
  #   - https://trusted-integration.example
  # --- Optional: HTTPS + HTTP/2 (mitigates browser same-origin HTTP/1.1 concurrent connection limits; multi-path Deep streaming is more stable) ---
  # TLS is enabled when any of: tls_enabled: true, or tls_auto_self_sign: true, or both tls_cert_path + tls_key_path are set.
  # Once enabled, access via https://127.0.0.1:<this port>/; if you still use http:// on the same port, it will automatically 308 redirect to HTTPS (can be turned off with tls_http_redirect: false).
  tls_enabled: true
  # When HTTPS is enabled, whether plain HTTP automatically redirects to HTTPS (default true; sniff TLS/HTTP on the same port then split)
  # tls_http_redirect: true
  # Option A (recommended for production): PEM certificate and private key paths
  # tls_cert_path: /path/to/fullchain.pem
  # tls_key_path: /path/to/privkey.pem
  # Option B (local/testing only): in-memory self-signed when no cert files (browser will warn untrusted; SAN includes localhost / 127.0.0.1)
  tls_auto_self_sign: true
# Authentication configuration
auth:
  session_duration_hours: 12 # Login validity period (hours); when exceeded, re-login is required
# Log configuration
log:
  level: info # Log level: debug (debug), info (info), warn (warning), error (error)
  output: stdout # Log output location: stdout (standard output), stderr (standard error), or a file path
  diagnostic_dir: log # Extra storage of warn-and-above diagnostic logs, split by local date; relative to the process working directory
  diagnostic_retention_days: 14 # Retention days (including today); omitted or <= 0 uses 14 days
  diagnostic_disabled: false # true turns off extra diagnostic logs; requires restart after change
# Platform operation audit (System Settings -> log audit; does not record conversation content or each tool call)
audit:
  enabled: true
  retention_days: 15 # 0 means no automatic cleanup
  max_detail_bytes: 8192
  auth_failure_cooldown_seconds: 60 # Minimum interval (seconds) between audit entries for the same IP's login/change-password failures; default 60 if not configured; -1 turns off throttling
# MCP status monitoring execution record retention (tool_executions table)
monitor:
  retention_days: 90 # Default 90 if omitted; 0 means no automatic cleanup
# Running-space garbage cleanup (System Settings -> storage cleanup)
# Retention policy covering the disk artifacts of the agent workspace, tool output cache, C2 artifacts, conversation uploads, and similar.
# auto_clean is off by default: after upgrades, existing data will not be deleted without the administrator's knowledge;
# when off, you can still preview and execute cleanup manually on the "Storage Cleanup" page.
storage:
  auto_clean: false # true turns on background scheduled cleanup
  interval_minutes: 60 # Background cleanup interval (minutes); minimum 5
  orphan_grace_days: 1 # When a session/project is deleted but the directory remains, reclaim after how many idle days
  active_grace_hours: 24 # Sessions with recent activity always skip, to avoid mistakenly deleting data for tasks currently running
  # Per-category retention_days; when omitted use the defaults below; 0 means no retention-based cleanup (orphan directories are still reclaimed)
  categories:
    workspace: # Agent workspace tmp/workspace; default 30 days
      enabled: true
      retention_days: 30
    reduction: # Very long tool outputs persisted to disk tmp/reduction; default 7 days (pure derived data)
      enabled: true
      retention_days: 7
    conversation_artifacts: # Summary and very-long input ledger data/conversation_artifacts; default 30 days
      enabled: true
      retention_days: 30
    plantask: # Multi-agent plan board skills/.eino/plantask; default 30 days (pure derived data)
      enabled: true
      retention_days: 30
    c2_artifacts: # C2 exfiltration screenshots/uploads/pushed files/payloads tmp/c2; default 30 days
      enabled: true # Note: after cleaning payload, the corresponding download link becomes invalid
      retention_days: 30
    chat_uploads: # Conversation upload attachments chat_uploads; default 90 days
      enabled: true
      retention_days: 90
    workflow_checkpoints: # Workflow checkpoints data/workflow-checkpoints; default 7 days
      enabled: true
      retention_days: 7
    diagnostic_logs: # Diagnostic logs log/diagnostic-*.log; default 14 days
      enabled: true # Effective independently from log.diagnostic_retention_days, whichever comes first
      retention_days: 14
# ============================================
# Conversation-related configuration
# ============================================

# AI channel configuration (supports saving multiple OpenAI-compatible / Claude channels)
# default_channel specifies which channel new conversations and tasks without an explicitly chosen channel use.
# Each channels.<id> requires: api_key, base_url, model.
# Supported API providers:
#   - OpenAI: https://api.openai.com/v1
#   - DeepSeek: https://api.deepseek.com/v1
#   - Other APIs compatible with the OpenAI protocol
# Common models: gpt-4, gpt-3.5-turbo, deepseek-chat, claude-3-opus, etc.
# provider: optional values openai_compatible (default) | claude (Eino native Anthropic Messages API)
ai:
  default_channel: qwen-max
  channels:
    qwen-max:
      name: Qwen Max
      provider: openai_compatible
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: sk-xxxxxxx
      model: qwen3-max
      max_total_tokens: 120000
      max_completion_tokens: 32768
      # Eino path model reasoning: DeepSeek/OpenAI is thinking / reasoning_effort; Claude 4.6+ is adaptive + output_config.effort (only sent when effort is explicitly configured); 3.7 is enabled+budget_tokens:10000 (document example), effort does not map, custom budget goes via extra_request_fields
      reasoning:
        mode: on # auto | on | off; off: OpenAI/Claude attach no reasoning field, DeepSeek sends thinking.type=disabled (it defaults to thinking enabled)
        effort: high # low | medium | high | max | xhigh (highest tier: OpenAI commonly xhigh, some gateways use max, sent as-is); blank means not specified
        allow_client_reasoning: true # when false, ignore the conversation request body's reasoning, only the above is authoritative
        profile: openai_compat # auto | deepseek_compat | openai_compat | output_config_effort
        # extra_request_fields: {} # optional: administrator custom root-level JSON fragments (advanced)
    # qwen-plus:
    #   name: Qwen Plus Fallback
    #   provider: openai_compatible
    #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    #   api_key: sk-xxxxxxx
    #   model: qwen-plus
    #   max_total_tokens: 120000
    #   max_completion_tokens: 32768
# Vision analysis (analyze_image MCP tool; images appear only in a single VL call, the Agent context keeps only the text summary)
vision:
  enabled: false # when true and model is non-empty, register analyze_image
  model: qwen-vl # VL model name (required when enabled)
  api_key: "" # leave blank to reuse the default AI channel's api_key
  base_url: "" # leave blank to reuse the default AI channel's base_url
  provider: # leave blank to reuse the default AI channel's provider (openai_compatible | claude)
  max_image_bytes: 5242880 # Original file size limit (bytes), default 5MB
  max_dimension: 2048 # Long-side scaled-down pixels
  jpeg_quality: 82
  max_payload_bytes: 524288 # Encoded payload limit sent to the VL API, default 512KB
  skip_preprocess_below_bytes: 2097152 # Below 2MB and long side<=max_dimension and<=max_payload, the original image is sent directly; 0=always compress
  detail: auto # low | high | auto (Eino ImageURLDetail)
  timeout_seconds: 60
# ============================================
# Asset management (cyberspace mapping search) configuration (optional)
# ============================================
# Used by the "Asset Management → Information Gathering" page to call FOFA / ZoomEye / Quake / Shodan APIs
# Backend proxies the request, avoiding exposing the key in the frontend; environment variables take priority
fofa:
  base_url: https://fofa.info/api/v1/search/all # optional, leave blank to use the default
  api_key: "" # FOFA API Key (optional, recommended to fill in System Settings)
zoomeye:
  base_url: https://api.zoomeye.ai/v2/search # optional, leave blank to use the default
  api_key: "" # ZoomEye API Key; can also be configured via the ZOOMEYE_API_KEY environment variable
quake:
  base_url: https://quake.360.net/api/v3/search/quake_service # optional, leave blank to use the default
  api_key: "" # Quake API Token; can also be configured via the QUAKE_API_KEY environment variable
shodan:
  base_url: https://api.shodan.io # optional, leave blank to use the default
  api_key: "" # Shodan API Key; can also be configured via the SHODAN_API_KEY environment variable
# Agent configuration
# When the maximum iteration count is reached, the AI will automatically summarize the test results
agent:
  max_iterations: 12000 # Global maximum iteration count (single agent / Deep / Supervisor / Plan-Execute main executor / sub agents all inherit; in agents/*.md, max_iterations>0 can override individually)
  tool_timeout_minutes: 60 # Maximum duration (minutes) of a single tool execution; automatically terminated on timeout; 0 means no limit (not recommended, prone to long hangs)
  tool_wait_timeout_seconds: 300 # Maximum wait (seconds) per tool turn; when reached returns execution_id, the worker continues in the background, can continue waiting with wait_tool_execution; 0=wait until completion
  external_mcp_max_concurrent_per_server: 5 # Concurrent tool executions per external MCP server; 0=default 2; negative=no limit
  external_mcp_max_concurrent_total: 16 # Global concurrency limit for all external MCP tools; 0=default 16; negative=no limit
  external_mcp_circuit_failure_threshold: 15 # Consecutive failures per external MCP server before circuit breaking; 0=default 3; negative=circuit breaker off
  external_mcp_circuit_cooldown_seconds: 60 # Circuit-breaker cooldown seconds; 0=default 60
  shell_no_output_timeout_seconds: 1200 # execute/exec terminates (seconds) on continuous absence of new output; general anti-hang; 0=default 300; -1=off
  workspace_root_dir: "" # Session workspace root directory path (curl/wget downloads, read_file/glob/grep local analysis); blank=tmp/workspace, below that, isolated per projects/{id} or conversations/{id}; do not use system /tmp
  # system_prompt_path: prompts/single-agent.md # optional: single-agent system prompt file (relative to the directory containing this configuration file); non-empty and readable replaces the built-in prompt

  system_prompt_path: ""
# Call interception: takes effect immediately after editing and saving in "Security Protection → Call Interception"; independent of the HITL approval whitelist.
# Older configs omitting tool_guard also default to enabling government-domain protection. Manual YAML edits require a restart.
tool_guard:
  enabled: true
  rules:
    - id: government-domains
      name: Government sites protection
      enabled: true
      # Go/RE2 regex; the named capture group match is used for {match} in the reminder.
      pattern: '(?i)(?:^|[^\p{L}\p{M}\p{N}_.-])(?P<match>(?:(?:[\p{L}\p{M}\p{N}_*-]+\.)+gov(?:\.[\p{L}\p{M}\p{N}_*-]+)*|gov(?:\.[\p{L}\p{M}\p{N}_*-]+)+|\.gov(?:\.[\p{L}\p{M}\p{N}_*-]+)*)\.?)(?:$|[^\p{L}\p{M}\p{N}_.-])'
      # Supports {match}, {tool}, {rule}; leave blank to use the generic reminder.
      message: 'Identified {match}, attacking government sites is forbidden. Please check the target and authorization scope, and switch to an authorized non-government target.'

# Human-in-the-loop (HITL) global whitelist: tools listed here are always exempt from approval; merged with the conversation page's "whitelist tools (approval-exempt, comma-separated)" as a union; the sidebar "Apply" can merge-write into this list and take effect immediately.
# Non-whitelisted tools, when the approval side is audit agent, select the prompt by the session's HITL mode:
#   approval → audit_agent_prompt
#   review_edit → audit_agent_prompt_review_edit (can change params then allow)
hitl:
  # Global default human-in-the-loop mode: off=off, approval=approval mode, review_edit=review-edit; new sessions without separate config inherit
  default_mode: off
  # Global default approval side: human=human approval, audit_agent=audit agent; new sessions without separate config inherit
  default_reviewer: human
  # Global default approval wait timeout (seconds): 300=5 minutes, 0=unlimited; new sessions without separate config inherit
  default_timeout_seconds: 300
  # Audit agent backend, one of two: openai=protocol-compatible chat model (prompt is JSON); typesafe=TypeSafe Jev structured allow/block.
  audit_backend: openai
  # Audit agent dedicated model. openai backend fields left blank reuse the main model; typesafe backend api_key is required and does not inherit the main model key.
  audit_model:
    provider: "" # openai / claude; only takes effect for the openai backend, blank follows openai.provider
    base_url: "" # openai backend blank follows the main model; typesafe backend blank uses https://api.typesafe.ai
    api_key: "" # openai backend blank follows the main model; typesafe backend fill the TypeSafe API Key
    model: "" # openai backend suggests filling a small model; typesafe backend blank uses jev-latest
  # Already-decided audit log retention days (same as MCP monitoring; omitted defaults 90; 0 means no automatic cleanup)
  retention_days: 90
  # Add/remove per the actual tool names in your environment (same as the sidebar; case-insensitive); change to [] if no global approval exemption is needed
  tool_whitelist: [read_file, ls, list_dir, glob, grep, tool_search, upsert_project_fact, get_project_fact, list_project_facts, search_project_facts, list_vulnerabilities, get_vulnerability, get_asset, query_assets, list_knowledge_risk_types, get_tool_execution, wait_tool_execution, batch_task_list, batch_task_get, manage_webshell_list, c2_event, c2_file]
  # audit_agent_prompt: |  # approval mode; leave blank to use the built-in default, can be edited in the "Human-in-the-loop" page. For the openai backend it is a chat prompt; for the typesafe backend it is the Jev organization policy
  # audit_agent_prompt_review_edit: |  # review-edit mode; leave blank to use the built-in default

  audit_agent_prompt: |-
    You are the CyberStrikeAI human-in-the-loop audit agent. Review whether the tool call the Agent is about to execute would cause substantive harm to the system.

    You will receive JSON containing fields such as hitlMode, toolName, arguments/argumentsObj, userMessage, thinking, reasoningChain, planning.

    Rule priority order:
    - Rules that must reject
    - Rules that must approve
    - Default allow rule

    Rule matching requirements:
    - If both a reject and an approve rule hit simultaneously, you must reject.
    - Each verdict must give a rule number; do not output "hit rule: none".
    - When no explicit reject or approve rule hits, but no clear destructive behavior is found, D1 hits: default allow.
    - Do not judge a script harmless based only on "local execution", "timeout set", "filename contains test"; you must check the actual command, code, or request parameters.
    - If the specific script content is not visible, phrase it as "the current parameters show no clearly high-risk operations", and do not assert "no persistence impact".

    Verdict tone (default allow):
    - The overwhelming majority of penetration testing operations (including all kinds of attack payloads) should be allowed
    - Before the verdict you need to work out: 1. What does this request do (understand the request content)? 2. What consequence does this request cause?
    - Only in "clearly and directly breaking the normal operation of the target business system, or causing real user data loss/irreversible tampering" → reject
    - Insufficient information, overly broad parameters, merely probing intent → approve
    - When unsure → approve (prefer letting pass a recoverable test, do not mistakenly block a legitimate attack)

    High-risk situations that must reject (examples, not exhaustive):
    - Modify/reset any user or administrator password, force real users offline
    - Modify server or service configuration (system configuration, Web/database parameters, firewall, startup items, scheduled tasks)
    - Modify/create/delete users, roles, permissions (account-system tampering)
    - Delete or massively destroy data/files (DROP/TRUNCATE/DELETE on full tables, rm on important files, emptying databases)
    - Stop, disable, or restart business services (systemctl stop, kill critical processes, shutdown, reboot)
    - Large-scale load testing or high concurrency causing DoS

    The following situations must approve (even if they look "aggressive" or include write operations):
    - All kinds of vulnerability probing and exploitation payloads (SQL injection including read/write types, command injection, deserialization, file inclusion, path traversal, SSRF, SSTI, XXE, etc.)
    - File upload testing, including uploading webshells, writing webshell files
    - Command execution probing, reverse shells, dnslog / data exfiltration probing
    - Database command execution, writing files, writing scheduled tasks, memory-shell injection, and similar getshell exploitation
    - Password brute-forcing at normal rates (not DoS scale)
    - Information gathering, port/directory scanning, enumeration, scraping
    - Read, query, probe-type operations (including sensitive files)
    - Post-compromise harmless reconnaissance commands (whoami/id/uname/ls/cat, etc.)
    - Requests with broad parameters but no clear destructive intent

    Judgment principles:
    - "Write" itself is not a reason to block — penetration testing relies heavily on write operations (injection, upload, brute-forcing, getshell)
    - The key thing to look at is whether it breaks "business availability / key data integrity"
    - Only clearly hit the reject list above → reject

    Output only a single line of JSON, no markdown code block:
    {"decision":"approve"|"reject","comment":"Actual operation: ...; consequence after success: ...; hit rule: ..."}
  audit_agent_prompt_review_edit: |-
    You are the CyberStrikeAI human-in-the-loop audit agent. Review whether the tool call the Agent is about to execute would cause substantive harm to the system.

    You will receive JSON containing fields such as hitlMode, toolName, arguments/argumentsObj, userMessage, thinking, reasoningChain, planning.

    Rule priority order:
    - Rules that must reject
    - Rules that must approve
    - Default allow rule

    Rule matching requirements:
    - If both a reject and an approve rule hit simultaneously, you must reject.
    - Each verdict must give a rule number; do not output "hit rule: none".
    - When no explicit reject or approve rule hits, but no clear destructive behavior is found, D1 hits: default allow.
    - Do not judge a script harmless based only on "local execution", "timeout set", "filename contains test"; you must check the actual command, code, or request parameters.
    - If the specific script content is not visible, phrase it as "the current parameters show no clearly high-risk operations", and do not assert "no persistence impact".

    Verdict tone (default allow):
    - The overwhelming majority of penetration testing operations (including all kinds of attack payloads) should be allowed
    - Before the verdict you need to work out: 1. What does this request do (understand the request content)? 2. What consequence does this request cause?
    - Only in "clearly and directly breaking the normal operation of the target business system, or causing real user data loss/irreversible tampering" → reject
    - Insufficient information, overly broad parameters, merely probing intent → approve
    - When unsure → approve (prefer letting pass a recoverable test, do not mistakenly block a legitimate attack)

    High-risk situations that must reject (examples, not exhaustive):
    - Modify/reset any user or administrator password, force real users offline
    - Modify server or service configuration (system configuration, Web/database parameters, firewall, startup items, scheduled tasks)
    - Modify/create/delete users, roles, permissions (account-system tampering)
    - Delete or massively destroy data/files (DROP/TRUNCATE/DELETE on full tables, rm on important files, emptying databases)
    - Stop, disable, or restart business services (systemctl stop, kill critical processes, shutdown, reboot)
    - Large-scale load testing or high concurrency causing DoS

    The following situations must approve (even if they look "aggressive" or include write operations):
    - All kinds of vulnerability probing and exploitation payloads (SQL injection including read/write types, command injection, deserialization, file inclusion, path traversal, SSRF, SSTI, XXE, etc.)
    - File upload testing, including uploading webshells, writing webshell files
    - Command execution probing, reverse shells, dnslog / data exfiltration probing
    - Database command execution, writing files, writing scheduled tasks, memory-shell injection, and similar getshell exploitation
    - Password brute-forcing at normal rates (not DoS scale)
    - Information gathering, port/directory scanning, enumeration, scraping
    - Read, query, probe-type operations (including sensitive files)
    - Post-compromise harmless reconnaissance commands (whoami/id/uname/ls/cat, etc.)
    - Requests with broad parameters but no clear destructive intent

    Judgment principles:
    - "Write" itself is not a reason to block — penetration testing relies heavily on write operations (injection, upload, brute-forcing, getshell)
    - The key thing to look at is whether it breaks "business availability / key data integrity"
    - Only clearly hit the reject list above → reject

    Output only a single line of JSON, no markdown code block:
    {"decision":"approve"|"reject","comment":"Actual operation: ...; consequence after success: ...; hit rule: ...","editedArguments":{...}}

    editedArguments rules (fill in only when approve and params need changing, otherwise omit the field):
    - Provide the complete replaced tool parameter object, with key names matching argumentsObj
    - Only make the minimal necessary changes to narrow the scope, eliminate risk (such as restricting path, removing dangerous flags)
    - Expanding the attack surface is forbidden: must not expand the target scope, elevate privileges, or introduce destructive parameters
    - When it cannot be safely re-parameterized and the high-risk situations above exist, you should reject, do not force approve
# Multi-agent and Eino single-agent (CloudWeGo Eino ADK; single-agent entry /api/eino-agent*, multi-agent /api/multi-agent*)
# Dependencies are pulled in go.mod; if downloads fail you can set: go env -w GOPROXY=https://goproxy.cn,direct
# Deep / Plan-Execute / Supervisor are specified in the request body orchestration by the conversation page and WebShell mode selection; robots follow robot_default_agent_mode
multi_agent:
  enabled: true
  robot_default_agent_mode: eino_single # Enterprise WeChat/DingTalk/Lark robot default: eino_single | deep | plan_execute | supervisor
  batch_use_multi_agent: false # when true, each sub-task in the "Batch Tasks" queue also goes through the Eino multi-agent (higher cost)
  # plan_execute specific: outer execute↔replan loop upper limit, 0 means Eino default 10. Main/sub agent ReAct rounds see agent.max_iterations.
  plan_execute_loop_max_iterations: 0
  sub_agent_user_context_max_runes: 0 # Inject the user's original text in the sub agent's task description; 0=no truncation (default), >0=total character limit, negative=disable
  without_general_sub_agent: false # when false, keep the Deep built-in general-purpose sub agent
  without_write_todos: false
  orchestrator_instruction: "" # Deep main agent: body of agents/orchestrator.md (or a single .md with kind: orchestrator) takes priority; when the body is empty use this; both empty use the Eino default
  orchestrator_instruction_plan_execute: "" # plan_execute main agent: body of agents/orchestrator-plan-execute.md takes priority; when the body is empty use this; both empty use the built-in plan_execute prompt (Deep's orchestrator_instruction is not used)
  orchestrator_instruction_supervisor: "" # supervisor main agent: body of agents/orchestrator-supervisor.md takes priority; when the body is empty use this; both empty use the built-in supervisor prompt (transfer/exit descriptions are still appended by the runner; Deep's orchestrator_instruction is not used)
  # Eino official Skills: progressive disclosure + optional local files/shell (eino-ext local backend). For the Skills directory see skills_dir.
  eino_skills:
    disable: false # true: do not register the skill progressive-disclosure middleware, and mount no local FS/Shell tools; false: load per the switches below
    filesystem_tools: true # true: register read_file/glob/grep/write/edit/execute (use with caution in authorized environments); false: skill only, exposes no local read/write or shell
    skill_tool_name: skill # The "load skill" tool name the model side can call, generally keep it skill; just be consistent with the call name in the skill pack's docs
  # Eino ADK middleware and Deep/Supervisor/plan_execute Executor parameters (for the struct see internal/config/config.go → MultiAgentEinoMiddlewareConfig)
  # plan_execute: the patch/reduction/tool_search/plantask below also applies to the Executor (via ExecPreMiddlewares); Planner/Replanner mount no MCP pre-middlewares.
  eino_middleware:
    patch_tool_calls: true # true: patch dangling tool_call in history without tool_result (more stable after streaming interruption/retry); false: off; field omitted defaults to the equivalent of true
    tool_search_enable: true # true: when tool count ≥ min, enable tool_search; only the first N tools stay resident, the rest are unlocked on demand by regex, saving tokens and reducing mis-selection; false: full tools into context
    tool_search_min_tools: 20 # Only at that count is tool_search enabled (avoiding overkill when tools are few); used together with always_visible
    tool_search_always_visible: 12 # Number of tools always directly exposed to the model (order matches the role's tool list); the rest enter the dynamic pool and need tool_search to unlock
    tool_search_always_visible_tools: [read_file, glob, grep, analyze_image, write_file, edit_file, execute, task, transfer_to_agent, exit, write_todos, skill, tool_search, TaskCreate, TaskGet, TaskUpdate, TaskList, record_vulnerability, list_vulnerabilities, get_vulnerability, get_tool_execution, wait_tool_execution, cancel_tool_execution, list_knowledge_risk_types, search_knowledge_base, webshell_exec, webshell_file_list, webshell_file_read, webshell_file_write, manage_webshell_list, manage_webshell_add, manage_webshell_update, manage_webshell_delete, manage_webshell_test, batch_task_list, batch_task_get, batch_task_start, batch_task_rerun, batch_task_pause, batch_task_update_metadata, batch_task_update_schedule, batch_task_schedule_enabled, batch_task_update_task, batch_task_remove_task, batch_task_delete, batch_task_create, batch_task_add_task, http-framework-test, exec] # Backend built-in resident tool whitelist (takes priority over the always_visible count policy)
    plantask_enable: true # P0: the main agent mounts the structured TaskCreate/Get/Update/List task board; requires eino_skills available and skills_dir present
    plantask_rel_dir: .eino/plantask # Task file relative to skills_dir, sub-directory per session: skills/.eino/plantask/<conversationId>/
    reduction_enable: true # true: large tool output is truncated and persisted to a local file (tmp/reduction/.../trunc/<id>), leaving only a <persisted-output> preview in context; does not depend on eino_skills
    reduction_max_length_for_trunc: 100000 # When a single tool result exceeds this byte count: the full text is written to a local trunc file, returning a truncated preview with path (MCP/exec shares this threshold with reduction)
    reduction_max_tokens_for_clear: 60000 # History tool result cleanup threshold (tokens), should be below max_total_tokens * summarization_trigger_ratio
    reduction_root_dir: "" # Non-empty: root path for persisting truncated/cleared content; blank: the project directory's tmp/reduction (isolated per session/project)
    reduction_clear_exclude: [] # Extra list of tool names that do not take part in the "clear stage" (merged with built-in excludes such as task/transfer/exit); fill with a YAML list when needed
    reduction_sub_agents: true # true: sub agents also mount reduction; false: only the orchestrator main agent uses reduction
    summarization_trigger_ratio: 0.8 # Summarization trigger ratio (max_total_tokens * ratio), recommend 0.75~0.85
    summarization_output_reserve_tokens: 40960 # Summary model output reserved tokens; summary input budget = trigger threshold - this value
    summarization_emit_internal_events: true # true: emit summarization internal events (for diagnosis)
    summarization_user_intent_ledger_max_runes: 96000 # Total character limit of the "original user input and constraint ledger" injected into the model context after compression; original DB messages are not trimmed
    summarization_user_intent_ledger_entry_max_runes: 16000 # Character limit for a single user message in the ledger; when exceeded only the model-visible ledger is trimmed, the DB original text is unaffected
    latest_user_message_max_runes: 48000 # Character limit for this turn's latest user message entering the model context; when exceeded the full text is persisted, only a head/tail preview is injected
    latest_user_message_head_runes: 24000 # Head preview character count for an overly long this-turn user message
    latest_user_message_tail_runes: 24000 # Tail preview character count for an overly long this-turn user message
    plan_execute_user_input_budget_ratio: 0.35 # userInput budget ratio in plan_execute (shared by planner/replanner/executor)
    plan_execute_executed_steps_budget_ratio: 0.2 # executed_steps budget ratio in plan_execute
    plan_execute_max_step_result_runes: 4000 # Maximum characters per step result in plan_execute (truncated when exceeded)
    plan_execute_keep_last_steps: 8 # plan_execute keeps only the most recent N step bodies, earlier steps fold into titles
    checkpoint_dir: "" # The chat pipeline no longer uses ADK checkpoints; cross-turn model state uniformly goes through conversations.last_react_*, to ease stale-context debugging
    model_retry_max_retries: 0 # Eino native ChatModel retry; 408/409/425/429/5xx/network jitter/empty streaming output will retry; 0=default 4 (permanent 4xx not retried)
    model_retry_max_backoff_sec: 0 # Eino native ChatModel retry single backoff upper limit in seconds; 0=default 30
    model_failover_channels: [] # Eino native ChatModel failover; fill ai.channels IDs, e.g. [qwen-plus]; when retry is exhausted, switch in order
    model_failover_max_retries: 0 # Maximum tries for backup channels; 0=try all model_failover_channels
    empty_response_continue_max_attempts: 0 # Number of backoff-and-continue runs by the Handler when a Run succeeds but no assistant body is captured (including streaming interruption); 0=default 5
    deep_output_key: final_answer # P0: Eino session writes the final assistant conclusion (framework-internal; Deep/Supervisor main/eino_single)
    task_tool_description_prefix: "" # Non-empty: only Deep's task tool uses the custom description prefix, the runtime will append the sub agent name; empty goes through Eino's default generation logic
  # Eino callbacks + OpenTelemetry: framework-level spans (aligned with Zap); by default do not push eino_trace_* to the terminal-user UI (see sse_trace_to_client)
  eino_callbacks:
    enabled: true
    # log_only=only Zap+OTel (recommended default) | sse/full=only then enable streaming callback copies etc. (full includes stream hooks)
    mode: log_only
    sse_trace_to_client: false # true: and mode is sse/full, push eino_trace_* to the frontend timeline (for troubleshooting / intranet demos)
    max_input_summary_runes: 400
    max_output_summary_runes: 400
    zap_verbose: false # true: Debug also carries input/output summaries
    otel:
      enabled: true
      service_name: cyberstrike-ai
      exporter: stdout # none | stdout (dev/local) | otlphttp (production to a Collector)
      otlp_endpoint: localhost:4318 # used with otlphttp, host:port, path fixed /v1/traces
      sample_ratio: 1.0 # 0~1, ParentBased+TraceIDRatio
# Database configuration
database:
  path: data/conversations.db # SQLite database file path, used for storing conversation history and messages
  knowledge_db_path: data/knowledge.db # Knowledge base database file path (optional; if empty, uses the session database), used for storing knowledge items and vector embeddings; can be copied and reused independently
# ============================================
# Task-management-related configuration
# ============================================
# (Configuration items are included in the conversation-related configuration)

# ============================================
# Vulnerability management-related configuration
# ============================================

# Security tools configuration
# The system loads all .yaml format tool configuration files from this directory
# Recommended approach: create a separate configuration file per tool in the tools/ directory
security:
  # auto: native Job Object on Windows; Unix watchdog unless cgroup_root is set.
  # Linux production: configure a systemd service with Delegate=cpu memory pids; set
  # mode: required, cgroup_root: auto. Explicit isolation errors fail closed.
  process_isolation:
    mode: auto
    cgroup_root: ""
    max_processes: 256
    memory_max_bytes: 2147483648
    cpu_quota_micros: 0 # 0=no CPU cap; 100000=one core (100 ms period)
  tools_dir: tools # Tool configuration file directory (relative to the directory containing this configuration file)
  # Tool description mode: source of the description exposed to AI/API when loading tools under tools/
  #   short - prefer short_description (short description, saves tokens), falling back to description when empty
  #   full  - use description (detailed description)
  tool_description_mode: full
# ============================================
# MCP-related configuration
# ============================================

# MCP protocol configuration
# MCP (Model Context Protocol) for tool registration and invocation
mcp:
  enabled: false # Whether to enable the MCP server (http mode)
  host: 127.0.0.1 # MCP server listen address; change explicitly only when remote access is needed, and configure network-layer access control
  port: 8081 # MCP server port
  auth_header: "X-MCP-Token" # Optional global service credential header; for normal calls use the user's Authorization: Bearer Token
  auth_header_value: "" # Global service credential value, only effective when allow_global_access=true
  allow_global_access: false # High-risk compatibility mode: static key mapping as global service identity; by default use the user's Bearer Token
# External MCP configuration
external_mcp:
  servers: {}
# Built-in C2: when the machine is only used for conversations/knowledge base, can be set to false, starting no listeners and registering no C2 MCP tools; when this section is omitted, enabled by default
c2:
  enabled: true
# ============================================
# Knowledge base-related configuration
# ============================================
knowledge:
  enabled: false # Whether to enable knowledge retrieval
  base_path: knowledge_base # Knowledge base directory path (relative to the directory containing this configuration file)
  embedding:
    provider: openai # Embedding model provider (only openai is currently supported)
    model: text-embedding-v4 # Embedding model name
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1 # leave blank to use the base_url from the OpenAI configuration
    api_key: sk-xxxxxxx # leave blank to use the api_key from the OpenAI configuration
  retrieval:
    top_k: 5 # Number of Top-K results returned by retrieval
    similarity_threshold: 0.4 # Cosine similarity threshold (0-1); results below it are filtered out
    # Eino MultiQuery: LLM rewrites the query then multi-way vector retrieval then fusion (always enabled)
    multi_query:
      max_queries: 4 # Upper limit of rewritten variants (including semantic coverage); recommend 3~4
    # Rerank (always enabled): dashscope uses gte-rerank; other OpenAI-compatible endpoints go to /v1/rerank
    rerank:
      provider: "" # blank=inferred from base_url: dashscope | cohere
      model: "" # blank=dashscope→gte-rerank, cohere→rerank-multilingual-v3.0
      base_url: "" # leave blank to use the embedding / openai base_url
      api_key: "" # leave blank to use the embedding / openai api_key
    post_retrieve:
      prefetch_top_k: 20 # Vector candidate count per MultiQuery variant; 0=built-in max(top_k*4,20)
      max_context_chars: 0 # 0 no limit; otherwise the total Unicode character limit of the returned body (whole-section chunks)
      max_context_tokens: 0 # 0 no limit; otherwise the total tiktoken token limit
    sub_index_filter: ""
  # ============================================
  # Indexing configuration (used to solve API limitation problems)
  # ============================================
  indexing:
    # Chunking configuration
    chunk_size: 512 # Maximum tokens per chunk (default 512); long texts are split into multiple chunks
    chunk_overlap: 50 # Overlapping token count between chunks (default 50), keeping context coherent
    max_chunks_per_item: 0 # Maximum chunk count per knowledge item (0 means no limit); prevents a single file from consuming too much API quota
    # Rate-limit configuration (solves 429 errors)
    max_rpm: 0 # Maximum requests per minute (default 0 means no limit), e.g. OpenAI default 200 RPM
    rate_limit_delay_ms: 300 # Interval in milliseconds between requests (default 300); used to avoid API rate limits, set 0 for no limit
    # Suggested values: 200 req/min≈300ms, 100 req/min≈600ms

    # Retry configuration
    max_retries: 3 # Maximum retry count (default 3); automatically retries on rate limits or server errors
    retry_delay_ms: 1000 # Retry interval in milliseconds (default 1000); each retry increments the delay
    # Chunking strategy (Eino): markdown_then_recursive = first split by Markdown headings then recursively; recursive = only recursive splitting. Blank defaults to markdown_then_recursive in-program
    chunk_strategy: markdown_then_recursive
    # Embedding HTTP request timeout (seconds). 0 uses the built-in default (generally 120), consistent with the vectorization API client
    request_timeout_seconds: 120
    # true: when indexing, prefer the disk file content pointed to by the knowledge item's file_path (Eino FileLoader); false: use the body stored in the database. Disk read failure falls back to DB
    prefer_source_file: false
    # Upper limit of text items per single embedding API request (index writes are batched by this). Must be ≤ provider limits (some compatible interfaces at most 10); too large easily 400s
    batch_size: 10
    # Eino indexer.WithSubIndexes: logical partition label list, written to the vector table sub_indexes, retrieval can filter with sub_index_filter; no need can be []
    sub_indexes: []
# ============================================
# Robot configuration (Enterprise WeChat, DingTalk, Lark)
# ============================================
# Used for chatting with CyberStrikeAI from the mobile side via Enterprise WeChat/DingTalk/Lark; usable even without deploying on a server
# Can be configured in System Settings -> Robot Settings
robots:
  wechat: # WeChat iLink (personal WeChat ClawBot, bind by QR scan)
    enabled: false
    # Auth defaults to user_binding; a dedicated robot can change to service_account and must restrict the real sender
    auth:
      mode: user_binding # user_binding | service_account
      # service_user_id: "RBAC user ID of admin or the dedicated service account"
      # allowed_external_users: ["t:tenant|u:sender"]
    bot_token: ""
    ilink_bot_id: ""
    ilink_user_id: ""
    base_url: https://ilinkai.weixin.qq.com
    bot_type: "3"
    bot_agent: CyberStrikeAI/1.0
  wecom: # Enterprise WeChat
    enabled: false
    auth:
      mode: user_binding
    token: ""
    encoding_aes_key: ""
    corp_id: ""
    secret: ""
    agent_id: 0
  dingtalk: # DingTalk
    enabled: false
    auth:
      mode: user_binding
    client_id: ""
    client_secret: ""
    allow_conversation_id_fallback: false
  lark: # Lark
    enabled: false
    auth:
      mode: user_binding
    app_id: ""
    app_secret: ""
    verify_token: ""
    allow_chat_id_fallback: false
  telegram: # Telegram
    enabled: false
    auth:
      mode: user_binding
    bot_token: ""
    bot_username: ""
    allow_group_messages: false
  slack: # Slack
    enabled: false
    auth:
      mode: user_binding
    bot_token: ""
    app_token: ""
  discord: # Discord
    enabled: false
    auth:
      mode: user_binding
    bot_token: ""
    allow_guild_messages: false
  qq: # QQ robot
    enabled: false
    auth:
      mode: user_binding
    app_id: ""
    client_secret: ""
    sandbox: true
# ============================================
# Skills-related configuration
# ============================================

# Skill pack directory: each sub-directory only a standard SKILL.md (Agent Skills: front matter only name, description) + optional auxiliary files; no SKILL.yaml
# Example: skills/cyberstrike-eino-demo/
skills_dir: skills # Skills configuration file directory (relative to the directory containing this configuration file)
# ============================================
# Multi-agent sub-agents (Markdown, the single maintenance site)
# ============================================
# Each .md: YAML front matter (name / id / description / tools / bind_role / optional max_iterations>0 overriding the global / optional kind: orchestrator) + body is the system prompt
# Main agent: fixed file name orchestrator.md, or any file name + front matter kind: orchestrator (only one allowed per directory); the main agent does not take part in the task sub-agent list
# Advanced usage: you can still write sub_agents inside the multi_agent block, merged with this directory, and when the same id occurs the YAML can be overridden by the .md
agents_dir: agents
# ============================================
# Role-related configuration
# ============================================

# The system loads all .yaml format role configuration files from this directory
# Each role should create a separate configuration file, e.g. roles/CTF.yaml, roles/default.yaml
roles_dir: roles # Role configuration file directory (relative to the directory containing this configuration file)
# ============================================
# Project management and fact blackboard
# ============================================
project:
  enabled: true
  # When compressing, automatically save the continuation summary as a tentative note (one per session/agent, does not replace confirmed facts)
  context_checkpoints: true
  # default_project_id: "" # optional: default project ID when robots/batch tasks create conversations
  # Project continuation supplements are included in the fact index budget; the working file candidate list has a separate budget of at most 4000 characters
  fact_index_max_runes: 65000
  # Budget for the fact-relationship quick-view section (reserved from the total index budget)
  fact_index_path_max_runes: 10000
  fact_summary_max_runes: 24000
  default_inject_deprecated: false

# ============================================
# One-click update (optional)
# ============================================
# Update source: a repository address; updates follow that repository's own default branch; if not configured, it is the official repository
# (https://github.com/AIPentest/CyberStrikeAI.git). When GitHub access is poor, you can fill in a mirror address here;
# to follow your own fork only change this one place; the console's "System Settings → One-Click Update" page can fill and save directly.
# Non-git directories (unpacked/package installs) do not need to be configured, and can also run "Connect to update source" on the console's "One-Click Update" page,
# turning the directory into a git working tree tracking that repository, after which one-click update as normal installs.
# update:
#   repo: https://github.com/AIPentest/CyberStrikeAI.git  # A repository address; blank/omitted = official repository
